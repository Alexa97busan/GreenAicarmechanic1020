<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>정비 기출 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1110">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 정비 기출 노트 · editorial-greeting (app screen)
   Grid: 1100px column = 12 x 77 + 11 x 16 ; tiles 3 x 4 ; panels 6 + 6. One gap (16px). */
:root{
  color-scheme:light;
  --ground:#ffffff; --surface:#f1f4f4; --raised:#ffffff; --border:#e2e7e7; --rule:#ebeeee; --control:#cdd4d4; --active:#e6ebeb;
  --text:#1f201d; --muted:#5b5f5e; --faint:#6b6f6e;
  --accent:#1b6e66; --accent-soft:#dcebe8; --primary:#1f201d; --on-primary:#ffffff;
  --positive:#2e7d32; --negative:#b42318; --warning:#92400e;
  --ok-bg:#dcfae5; --ok-ink:#04250e; --no-bg:#fdecea; --no-ink:#7a1d14; --warn-bg:#fffbeb; --warn-ink:#92400e; --warn-line:#fde68a;
  --radius-card:20px; --radius-row:14px; --radius-control:999px;
  --gap:16px; --pad:20px; --control-height:38px; --row-height:63px;
  --font:"Instrument Sans","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0f1110; --surface:#181b1a; --raised:#202423; --border:#2c3130; --rule:#232827; --control:#444b49; --active:#2a2f2e;
  --text:#f1f2ef; --muted:#aab0ad; --faint:#9aa09d;
  --accent:#5cc0b4; --accent-soft:#173a36; --primary:#f1f2ef; --on-primary:#0f1110;
  --positive:#5dbe87; --negative:#ee7b6e; --warning:#e0a94b;
  --ok-bg:#183323; --ok-ink:#7fd6a2; --no-bg:#35201d; --no-ink:#f19a90; --warn-bg:#33291a; --warn-ink:#e8bf73; --warn-line:#4a3b1c}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1110; --surface:#181b1a; --raised:#202423; --border:#2c3130; --rule:#232827; --control:#444b49; --active:#2a2f2e;
  --text:#f1f2ef; --muted:#aab0ad; --faint:#9aa09d;
  --accent:#5cc0b4; --accent-soft:#173a36; --primary:#f1f2ef; --on-primary:#0f1110;
  --positive:#5dbe87; --negative:#ee7b6e; --warning:#e0a94b;
  --ok-bg:#183323; --ok-ink:#7fd6a2; --no-bg:#35201d; --no-ink:#f19a90; --warn-bg:#33291a; --warn-ink:#e8bf73; --warn-line:#4a3b1c}
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:break-word}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;font-variant-numeric:tabular-nums;
  padding-bottom:64px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button,input,textarea{font:inherit;color:inherit}
.num,.tile b,.score,.n b,.stat b{font-variant-numeric:tabular-nums}
/* top bar: two destinations, so no sidebar */
.top{height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:20px;padding:0 max(16px,calc((100vw - 1100px)/2));position:sticky;top:0;background:var(--ground);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--text);text-decoration:none}
.brand svg{flex:none;width:26px;height:26px;color:var(--accent)}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
nav{display:flex;gap:4px;margin-left:8px}
nav button{background:none;border:0;border-radius:var(--radius-control);color:var(--muted);font-size:14px;padding:6px 14px;min-height:32px;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}

nav button[aria-current="true"]{background:var(--active);color:var(--text);font-weight:500}
.sub{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* canvas */
.col{width:min(1100px,100% - 32px);margin:0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.col.narrow{width:min(920px,100% - 32px)}
#app{padding-top:8px}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:40px 0 18px}
.greet h1{font-size:32px;line-height:1.3;font-weight:500;letter-spacing:-.015em;margin:0;max-width:24em;text-wrap:balance}
.greet p{margin:8px 0 0;color:var(--muted);font-size:15px}
.ttl{font-size:24px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin:36px 0 4px}
.lead{margin:0 0 8px;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.s3{grid-column:span 3}.s6{grid-column:span 6}.s12{grid-column:span 12}
.tile{background:var(--surface);border-radius:var(--radius-card);padding:16px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.tile>span{font-size:13px;color:var(--muted)}
.tile b{font-size:32px;line-height:1;font-weight:400;letter-spacing:-.02em}
.tile b small{font-size:14px;color:var(--muted);margin-left:4px;letter-spacing:0}
.tile i{font-style:normal;font-size:12px;color:var(--muted)}
.tile.lead-tile{background:var(--accent-soft)}
.tile.lead-tile>span{color:var(--text)}
.panel{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.panel h2{margin:0;font-size:14px;font-weight:600;color:var(--text);letter-spacing:0;text-transform:none}
.panel-h .chip-n{font-size:12px;color:var(--muted);background:var(--raised);border-radius:999px;padding:2px 10px}
.rowcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;min-height:var(--row-height);padding:10px 16px;
  background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);text-align:left;cursor:pointer;width:100%;
  transition:border-color .15s var(--ease),transform .1s var(--ease)}

.rowcard:active{transform:scale(.995)}
.rowcard:disabled{opacity:.5;cursor:default}
.rowcard b{font-weight:600;font-size:15px}
.rowcard span{color:var(--muted);font-size:13px}
.rowcard .n{grid-row:1/3;grid-column:2;text-align:right;font-size:20px;font-weight:400;line-height:1.1}
.rowcard .n small{display:block;font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:8px}
.colstack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.colstack .panel{flex:1 1 auto}
/* controls */
.filters{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{height:32px;font-size:13px;border:1px solid var(--control);background:transparent;color:var(--text);border-radius:var(--radius-control);padding:0 14px;cursor:pointer;
  transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}

.chip:active{transform:scale(.96)}
.chiplabel{font-size:13px;color:var(--muted);margin-right:2px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn{font-size:14px;font-weight:500;min-height:var(--control-height);padding:8px 20px;border-radius:var(--radius-control);border:1px solid var(--control);background:transparent;color:var(--text);cursor:pointer;
  transition:transform .1s var(--ease),border-color .15s var(--ease),background .15s var(--ease)}

.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

.btn:disabled{opacity:.45;cursor:default}
.btn.grow{flex:1 1 0}
.btn kbd{font:inherit;font-size:11px;opacity:.65;margin-left:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{flex:1 1 220px;min-width:0;font-size:16px;min-height:46px;padding:0 16px;border:1px solid var(--control);border-radius:var(--radius-row);background:var(--raised);color:var(--text)}
input[type=text]:focus{border-color:var(--text);outline:none}
input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;align-self:flex-start}

/* meters */
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.bar.ink i{background:var(--text)}
.meter{display:grid;grid-template-columns:72px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:13px;min-height:36px}
.meter b{font-weight:500}
.meter code{font-family:inherit;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.meter code em{font-style:normal;color:var(--text)}
.boxstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.boxcell{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:10px 8px;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center;min-width:0}
.boxcell span{font-size:12px;color:var(--muted);white-space:nowrap}
.boxcell b{font-size:22px;font-weight:400;line-height:1.2}
.boxcell i{font-style:normal;font-size:11px;color:var(--accent);min-height:14px}
.dashed{border:1px dashed var(--control);border-radius:var(--radius-row);padding:12px 16px;color:var(--muted);font-size:13px}
/* session */
.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--radius-card);padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.tag{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tag em{font-style:normal;color:var(--accent);font-weight:500}
.q{font-size:21px;line-height:1.55;font-weight:500;margin:0;text-wrap:balance;overflow-wrap:anywhere;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{text-align:left;font-weight:400;line-height:1.5;min-height:52px;border-radius:var(--radius-row);background:var(--raised);border-color:var(--border);overflow-wrap:anywhere}

.res{border-radius:var(--radius-row);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;animation:rise .16s var(--ease)}
.res.ok{background:var(--ok-bg);color:var(--ok-ink)} .res.fmt{background:var(--warn-bg);color:var(--warn-ink)} .res.no{background:var(--no-bg);color:var(--no-ink)}
.res .ic{grid-row:1/6;grid-column:1;width:22px;height:22px;margin-top:2px}
.res>:not(.ic){grid-column:2}
.ic path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .26s .04s var(--ease) forwards}
.res h3{margin:0;font-size:14px;font-weight:600}
.key{font-size:17px;font-weight:600;white-space:pre-line;overflow-wrap:anywhere}
.tip{font-size:13px;color:var(--muted)}
.res .tip{color:inherit;opacity:.85}
.ans{border-left:2px solid var(--accent);padding:2px 0 2px 14px;animation:rise .16s var(--ease)}
.ans .key{display:block}
.more{border-top:1px solid var(--border);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.more h4{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.more p{margin:0;font-size:14px;line-height:1.75;overflow-wrap:anywhere}
.figimg{display:block;width:100%;max-width:100%;height:auto;margin:6px 0;border-radius:var(--radius-row);background:#fff;cursor:zoom-in}
.askimg{display:block;width:100%;max-width:420px;height:auto;margin-top:12px;border-radius:8px}
.ask{white-space:pre-wrap;font-size:14px;line-height:1.75;overflow-wrap:anywhere;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:12px;animation:rise .2s ease-out}
textarea#cpbox{width:100%;font-size:13px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-row);background:var(--raised);color:var(--text);resize:vertical}
.detail{margin:4px 0;border-radius:var(--radius-row);background:var(--raised);border:1px solid var(--border)}
.detail .cap{font-size:13px;color:var(--muted);padding:10px 14px}
.detail .wide{overflow-x:auto;padding:0 8px 10px;-webkit-overflow-scrolling:touch}
.figwide{display:block;width:100%;min-width:640px;height:auto;border-radius:10px;cursor:zoom-in}
.detail .cap em{font-style:normal;color:var(--accent);margin-left:6px;font-size:12px}
.lb{position:fixed;inset:0;z-index:50;overflow:hidden;touch-action:none;overscroll-behavior:contain;opacity:0;transition:opacity .16s var(--ease);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.lb.in{opacity:1}
.lb.drag{cursor:grabbing}
.lb .bg{position:absolute;inset:0;background:rgb(15,17,16);opacity:.94;pointer-events:none}
.lb img{position:absolute;left:0;top:0;display:block;max-width:none;background:#fff;border-radius:12px;transform-origin:0 0;will-change:transform;pointer-events:none;-webkit-user-drag:none}
.lb .hint{transition:opacity .2s var(--ease)}.lb .hint.gone{opacity:0}
.lb .x{position:fixed;top:12px;right:12px;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid #fff;background:#fff;color:#111;font-weight:600;cursor:pointer;z-index:51}
.lb .hint{position:fixed;top:20px;left:16px;color:#fff;font-size:13px;opacity:.85;z-index:51}
.m3 .btn{margin:4px 14px 14px;align-self:flex-start}
.f3d{display:block;width:100%;height:540px;border:0;border-radius:var(--radius-row);background:var(--surface)}
.iact{display:flex;flex-direction:column;gap:6px;padding:10px 14px;font-size:13px}
.iact a{color:var(--accent);text-decoration:none}
.shake{animation:shake .28s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}60%{transform:translateX(5px)}85%{transform:translateX(-2px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#app.fade{animation:fadein .14s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
/* result and records */
.score{font-size:40px;font-weight:400;line-height:1;letter-spacing:-.02em}
.score small{font-size:15px;color:var(--muted);margin-left:8px;letter-spacing:0}
.miss{display:flex;flex-direction:column;gap:8px}
.miss div{padding:12px 16px;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);display:flex;flex-direction:column;gap:2px;min-width:0}
.miss b{font-weight:500;overflow-wrap:anywhere}
.miss span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--control);border-radius:var(--radius-row);padding:12px 16px}
h2.sec{margin:12px 0 0;font-size:14px;font-weight:600;color:var(--text);letter-spacing:0;text-transform:none}
@media (hover:hover) and (pointer:fine){
  nav button:hover{color:var(--text)}
  .rowcard:hover{border-color:var(--control)}
  .chip:hover{border-color:var(--text)}
  .btn:hover{border-color:var(--text)}
  .btn.pri:hover{filter:brightness(1.15)}
  .link:hover{color:var(--text)}
  .opts .btn:hover{border-color:var(--text)}
  .iact a:hover{text-decoration:underline}
  .mt-i:hover{border-color:var(--text)}
  .topic:hover{border-color:var(--text)}
  .cmp .btn:hover{border-color:var(--text)}
}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,a,[role="button"],summary,.chip,.rowcard{touch-action:manipulation}
button,[role="button"]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img[data-zoom]{-webkit-touch-callout:none;touch-action:manipulation}
.top{padding-top:env(safe-area-inset-top,0px);height:calc(56px + env(safe-area-inset-top,0px))}
@media (max-width:480px){.top{height:calc(52px + env(safe-area-inset-top,0px))}}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.lb .x{top:calc(12px + env(safe-area-inset-top,0px))}.lb .hint{top:calc(20px + env(safe-area-inset-top,0px))}
.opts .btn:active,.mt-i:active,.topic:active,.cmp .btn:active,.seq-slot.filled:active,nav button:active{transform:scale(.98)}
.opts .btn,.mt-i,.topic,.cmp .btn,.seq-slot,nav button{transition:transform .1s var(--ease),border-color .15s var(--ease),background .15s var(--ease)}
@media (max-width:860px){
  .figwide{min-width:800px}
  .s3{grid-column:span 6}.s6{grid-column:span 12}
  .brand span{display:none}
}
@media (max-width:480px){
  .top{gap:8px}
  nav{margin-left:0}
  nav button{padding:6px 10px}
  .sub{display:none}
  .greet{padding:28px 0 12px}
  .greet h1{font-size:25px}
  .greet .btn{width:100%}
  .tile b{font-size:28px}
  .q{font-size:19px}
  .card{padding:22px 16px}
  .meter{grid-template-columns:56px minmax(0,1fr) 78px;gap:8px}
  .boxstrip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opts .btn,.btn{min-height:48px}
  .btn kbd{display:none}
}

/* 이해 중심 학습: 연결하기, 구조도 이름, 순서, 주제 */
.mt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;align-items:start}
.mt-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mt-i{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 12px;text-align:left;border:1px solid var(--border);border-radius:var(--radius-row);background:var(--raised);cursor:pointer;line-height:1.45;overflow-wrap:anywhere;transition:border-color .15s var(--ease),background .15s var(--ease)}

.mt-i[aria-pressed="true"]{border-color:var(--text);outline:1px solid var(--text);outline-offset:-2px}
.mt-i.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.mt-i.no{background:var(--no-bg);color:var(--no-ink);border-color:transparent}
.mt-i.fixed{cursor:default}
.mt-b{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:600;background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 60% 22%)}
.mt-b.empty{background:var(--rule);color:var(--muted)}
.mt-note{font-size:13px;color:var(--muted)}
.seq{display:flex;flex-direction:column;gap:8px}
.seq-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center}
.seq-row>b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--rule);font-size:13px;font-weight:600}
.seq-slot{min-height:46px;padding:8px 14px;border:1px dashed var(--control);border-radius:var(--radius-row);display:flex;align-items:center;color:var(--muted);font-size:13px;text-align:left;background:transparent;cursor:default;width:100%}
.seq-slot.filled{border-style:solid;border-color:var(--border);background:var(--raised);color:var(--text);font-size:14px;cursor:pointer}
.seq-slot.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.seq-slot.no{background:var(--no-bg);color:var(--no-ink);border-color:transparent}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .chip{height:auto;min-height:40px;padding:8px 16px;white-space:normal;text-align:left;line-height:1.4}
.pool .chip:disabled{opacity:.35;cursor:default}
.dgimg{display:block;width:100%;height:auto;border-radius:var(--radius-row);background:#fff;cursor:zoom-in}
.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.topic{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-row);background:var(--raised);cursor:pointer;min-width:0;transition:border-color .15s var(--ease)}

.topic b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.topic span{font-size:12px;color:var(--muted)}
.topic .bar{height:4px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.points li{padding:10px 14px;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);font-size:14px;line-height:1.7}
@media (max-width:860px){.topics,.trio{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.topics,.trio{grid-template-columns:minmax(0,1fr)}.mt{gap:8px 8px}.mt-i{padding:8px;font-size:13px}}

.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cmp .btn{min-height:64px;font-size:16px;font-weight:600;border-radius:var(--radius-row);background:var(--raised);border-color:var(--border);overflow-wrap:anywhere}

.cmp .btn.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.cmp .btn.no{background:var(--no-bg);color:var(--no-ink);border-color:transparent}
.stmt{font-size:19px;line-height:1.6;font-weight:500;margin:0;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:8px}
.step-done{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 14px;background:var(--ok-bg);color:var(--ok-ink);border-radius:var(--radius-row)}
.step-done b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--raised);font-size:12px;margin-top:1px}
.given{display:flex;flex-direction:column;gap:2px;padding:12px 16px;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);font-size:14px}
.sim-note{font-size:13px;color:var(--accent);padding:2px 0}
.why-fb{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:var(--radius-row);background:var(--raised);border:1px solid var(--border);font-size:14px;line-height:1.7}
.trio .rowcard{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:72px}
.trio.five{grid-template-columns:repeat(6,minmax(0,1fr))}
.trio.five>*:nth-child(-n+3){grid-column:span 2}
.trio.five>*:nth-child(n+4){grid-column:span 3}
@media (max-width:860px){.trio.five{grid-template-columns:repeat(2,minmax(0,1fr))}.trio.five>*{grid-column:auto!important}}
@media (max-width:560px){.trio.five{grid-template-columns:minmax(0,1fr)}.cmp .btn{min-height:56px;font-size:15px}}
/* 다듬기: 풀이 화면 */
.bar{height:8px;border-radius:4px}
.bar i{transition:width .3s var(--ease)}
.q{font-size:24px;line-height:1.5}
.link{min-height:40px;padding:0 14px;margin-left:-14px;border-radius:var(--radius-row);text-decoration:none;display:inline-flex;align-items:center;transition:background-color .14s var(--ease),color .14s var(--ease)}
.link:active{background:var(--surface)}
@media (hover:hover) and (pointer:fine){.link:hover{background:var(--surface)}}
@media (max-width:480px){.q{font-size:20px}.card{padding:22px 18px}}
@media (prefers-reduced-motion:reduce){
  .bar i{transition:none}
  .shake{animation:none!important}
  .res,.ans{animation:fadein .15s ease-out}
  .btn:active,.chip:active,.rowcard:active,.opts .btn:active,.mt-i:active,.topic:active,.cmp .btn:active,.seq-slot.filled:active,nav button:active{transform:none}
  .lb .hint{transition:none}
  .ic path{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
}

var EXP={"0": "삼원촉매는 약 400~800℃에서 정화율이 높고 오래 갑니다. 너무 높으면 촉매가 열화됩니다.", "1": "삼원은 HC·CO·NOx 세 가지입니다. N2는 NOx가 환원된 결과물입니다.", "2": "NOx가 환원되며 나온 O2가 HC·CO를 산화시킵니다. 한 촉매에서 환원과 산화가 같이 일어납니다.", "3": "삼원촉매가 HC·CO·NOx를 한꺼번에 정화합니다.", "4": "산소센서가 배기 중 산소를 감지해 혼합비를 이론공연비(14.7) 근처로 맞춥니다.", "6": "후단 센서는 촉매 성능 감시용이라 농후/희박만 구분하는 바이너리 타입을 씁니다.", "7": "지르코니아는 대기와 배기의 산소 농도 차이로 전압을 만들고, 이론공연비 부근에서 전압이 급변합니다.", "8": "티타니아는 전압이 아니라 저항이 변하는 방식입니다. 농후 0V, 희박 5V를 출력합니다.", "9": "14.7:1은 공기 14.7kg에 연료 1kg입니다. 부피가 아니라 공기의 질량입니다.", "10": "λ = 실제 공기량 ÷ 이론 공기량입니다. 1보다 크면 공기가 남는 희박, 작으면 농후입니다.", "12": "CO는 불완전 연소 가스입니다. 농후하면 산소가 부족해 많이 나옵니다.", "13": "HC는 타지 않고 나온 연료입니다. 농후할 때, 또 아주 희박해 실화가 날 때 늘어납니다.", "14": "디젤은 NOx와 PM이 서로 반대로 움직입니다. 연소온도가 높으면 NOx↑·PM↓, 농후하고 온도가 낮으면 PM↑입니다.", "15": "EGR은 배기가스 일부를 흡기로 돌려 연소온도를 낮춰 NOx를 줄입니다.", "19": "증발가스 계통은 탱크 → 캐니스터 → PCSV → 흡기입니다. EGR은 배기 재순환이라 별개 계통입니다.", "20": "캐니스터의 활성탄은 연료탱크 증발가스(HC)를 흡착해 두었다가 PCSV로 흡기에 보냅니다.", "21": "PCSV는 듀티율로 열림량을 조절해 캐니스터의 증발가스를 흡기로 보냅니다.", "23": "연료 탱크 압력 센서가 증기압을 감지해 퍼지 제어와 누설 판정에 씁니다.", "24": "가압식은 탱크에 압력을 가한 뒤 압력이 유지되는지로 누설을 판정합니다.", "25": "블로우바이 계통은 PCV 밸브·브리더 호스 등입니다. 롤오버밸브는 전복 시 연료를 막는 연료탱크 쪽 부품입니다.", "26": "블로우바이는 피스톤과 실린더 틈으로 크랭크케이스에 샌 가스를 PCV로 흡기에 되돌려 태웁니다. 사이트 기준 오답 표현은 '배기매니폴드로 배출되는 가스'입니다.", "27": "피에조 소자는 코일보다 응답이 빨라 다단 분사에 유리하고 분사압은 최대 약 1,800bar입니다.", "28": "주 분사 전에 소량을 먼저 분사해 연소실 압력 상승을 완만하게 합니다.", "29": "주 분사 뒤에 추가로 분사해 배기온도를 올리고 DPF 재생이나 LNT에 HC를 공급합니다.", "33": "CRDI는 연료 소비가 줄어드는 것이 장점입니다. '연료 소비의 향상'은 반대 뜻이라 오답입니다.", "34": "커먼레일의 장점은 성능·연비 향상과 배출가스·소음 감소입니다. 중량화는 장점이 아닙니다.", "40": "DPF는 PM(그을음)을 잡는 필터입니다. 질소산화물은 SCR이나 LNT가 처리합니다.", "44": "SCR은 EGR 역할이 줄고 DPF 용량을 줄일 수 있으며 불필요한 배압이 없습니다.", "45": "요소수는 요소 약 32.5% 수용액이고 어는점이 약 -11℃입니다. 촉매 앞에서 분사돼 암모니아로 바뀝니다.", "46": "공기 조절 밸브가 흡입공기량을 제어하고 시동 정지 시 흡입통로를 닫습니다.", "49": "CKPS는 피스톤 위치와 엔진 회전수를 알려 줘 분사·점화 시기를 정하는 기준이 됩니다.", "51": "12V를 인가하고 홀 효과로 디지털(구형파) 신호를 내는 것은 홀센서 방식입니다. 인덕티브는 교류 정현파입니다.", "52": "AFS는 핫필름·칼만와류 방식입니다. CKPS·CMPS·TPS는 홀 방식이 쓰입니다.", "53": "부조실린더 검사에서는 CKPS와 CMPS 신호로 회전수를 판단합니다.", "56": "전자식 스로틀(ETC)이 고장 나면 급발진이나 시동 꺼짐이 생길 수 있어 안전상 O입니다.", "60": "EMS의 장점은 연비·출력·배출가스 개선입니다. 황사 억제는 EMS와 관련이 없습니다.", "61": "AFS 직접계측은 질량 유량을 재는 핫와이어·핫필름·칼만와류입니다. 맵 센서는 간접계측입니다.", "63": "급출발하면 뒤가 주저앉고 앞이 들립니다(스쿼트). 이를 막는 제어가 안티 스쿼트입니다.", "64": "제동하면 앞이 숙여지는 현상이 다이브입니다. 이를 막는 제어가 안티 다이브입니다.", "65": "G센서는 차체 가속도를 검출해 롤(좌우 기울어짐)을 감지합니다.", "67": "타이로드 엔드는 조향 부품이라 차고 유지와 관계가 없습니다.", "68": "좌우 바퀴를 잇는 스테빌라이저가 롤링을 억제합니다.", "69": "스테빌라이저는 롤링(좌우 기울어짐)을 억제합니다. 상하 바운싱 방지는 쇽업소버·스프링의 몫입니다.", "70": "맥퍼슨형은 위시본형보다 부품이 적고 구조가 간단합니다.", "71": "V자 탄성 암을 상·하단에 조립하는 앞 현가장치는 위시본형입니다.", "75": "프리 피스톤으로 오일과 고압 질소를 나눈 단통 가스식 쇽업소버는 드카르봉식입니다.", "76": "차체 전체가 Z축(상하)으로 움직이면 바운싱입니다.", "77": "정면에서 볼 때 좌우로 기우는 회전이 롤링입니다.", "78": "앞뒤로 끄덕이듯 흔들리는 것이 피칭입니다.", "79": "스프링 위(차체): 바운싱·롤링·피칭·요잉. 스프링 아래(바퀴·차축): 휠 홉·휠 트램프·와인드업입니다.", "81": "스프링 아래 질량이 상하로 출렁이면 휠 홉입니다.", "83": "시미는 바퀴 회전 불균형 때문에 스티어링 휠이 떨리는 현상입니다.", "84": "MDPS는 모터 위치에 따라 컬럼(C)·피니언(P)·랙(R)형만 있습니다. 링기어 구동식은 없습니다.", "85": "머리글자를 그대로 연결합니다. C=컬럼 축, P=피니언 축, R=랙 축입니다.", "86": "타이로드는 조향 링크 부품이지 동력 조향 방식이 아닙니다.", "88": "전동식은 저속에서 조향이 가볍고 고속에서 무거워지는 특성이 있습니다. 사이트 기준 오답 표현은 '저속 주행안전성이 향상된다'입니다.", "89": "전자제어 동력 조향은 에너지 소모를 줄이는 방식입니다. '연료소비율을 높여'라는 표현이 틀렸습니다.", "91": "구비조건은 내구성과 신뢰도가 높아야 하는 것입니다. '낮아야 한다'는 오답입니다.", "92": "차속감응=속도에 따른 조향력, 직진안정=복원력·직진성, 롤링억제=급조향 시 롤링, 페일세이프=이상 시 안전 제어입니다.", "97": "프리로드 점검은 핸들을 중립 위치에서 측정합니다. 끝까지 돌린 뒤 측정하지 않습니다.", "103": "스테이터가 오일 흐름 방향을 바꿔 펌프를 돕게 하므로 토크가 증대됩니다.", "105": "D·R 모두 낮음=엔진 출력 부족·토크컨버터 불량, 모두 높음=오일 부족·라인압 저하, D만 높음=원웨이 클러치, R만 높음=프런트 클러치입니다.", "106": "스톨 테스트는 주차브레이크를 당기고 브레이크 페달을 강하게 밟은 채 합니다. 살짝 밟으면 차가 움직입니다.", "122": "공기 브레이크는 보조가 아니라 주 제동장치입니다. 보조 브레이크는 배기·엔진 브레이크 같은 것입니다.", "126": "(150+120) ÷ (700+450) × 100 = 23.47이고 소수 둘째 자리 이하를 버려 23.4%입니다.", "127": "(130+170) ÷ (900+600) × 100 = 20%입니다.", "128": "(150+190) ÷ 950 × 100 = 35.78이고 버림해 35.7%입니다.", "129": "(130+170+100+90) ÷ (900+600) × 100 = 32.67이고 버림해 32%입니다.", "131": "LIN은 Single Master / Multi Slave입니다. multi master라는 표현은 X입니다.", "132": "LIN은 1선의 저속·저비용 통신입니다. 고비용이라는 설명이 틀렸습니다.", "134": "이모빌라이저는 K-line 통신을 씁니다.", "135": "엔진·변속기·VDC·에어백처럼 빠르고 신뢰가 필요한 곳은 고속 CAN입니다.", "137": "bus off는 오류가 많아 제어기가 스스로 버스에서 이탈한 상태입니다.", "138": "CAN은 양 끝 120Ω 두 개가 병렬이라 합성 약 60Ω입니다. '반드시 120Ω 이상'이라는 설명이 틀렸습니다.", "140": "한쪽 주선이 끊기면 종단저항 하나만 남아 약 120Ω이 측정됩니다.", "146": "CAN은 ID 숫자가 작을수록 우선순위가 높습니다. '큰 ID가 우선'은 오답입니다.", "156": "직렬 합성저항 4+8+12 = 24Ω이고 I = 12 ÷ 24 = 0.5A입니다.", "157": "R = V ÷ I = 12 ÷ 0.125 = 96Ω입니다.", "158": "들어오는 전류 합 1+3+4 = 8A, 나가는 전류 합 2 + I5 = 8A이므로 I5 = 6A입니다.", "162": "파워 MOSFET은 파워 TR보다 내부저항이 작아 손실이 적고 큰 전류를 제어합니다.", "164": "조도 = 광도 ÷ 거리² = 18000 ÷ 9 = 2000 Lux입니다.", "165": "냉매 압력은 외기온도에 비례해 변합니다. 온도가 높으면 압력이 오르므로 X입니다.", "166": "엔진 정지 후 고압측으로 충전하고, 가동 중 저압으로 액체 냉매를 넣으면 압축기가 액체를 압축해 손상됩니다.", "168": "냉동오일과 함께 주입하는 형광액은 5mL입니다.", "170": "R-1234yf는 ODP 0, GWP 4인 친환경 냉매입니다.", "172": "압축기 → 응축기 → 리시버드라이어 → 팽창밸브 → 증발기입니다.", "173": "냉난방장치 중 실외에 있는 것은 응축기입니다.", "179": "핀서모 센서는 증발기 온도를 감지해 일정 이하면 압축기를 정지시킵니다.", "180": "핀서모 센서는 증발기가 어는 빙결을 막습니다.", "182": "핀서모 센서의 에어컨 릴레이 OFF 온도는 증발기 출구 약 0~0.5℃입니다.", "183": "AQS는 유해가스를 감지하는 센서입니다.", "184": "AQS는 유해가스를 감지하면 내기모드로 전환합니다. 필터링이 아니라서 X입니다.", "186": "레인센서 구성품은 발광 다이오드·수광 다이오드·커플링 패드입니다. 반사판은 아닙니다.", "188": "레인센서는 와이퍼·헤드라이트·공조를 제어합니다. 강우량은 제어 대상이 아니라 감지 대상입니다.", "190": "빛=라이트, 일조량=공조, 강우량=와이퍼입니다.", "192": "홀 센서 방식도 배터리가 방전되면 데이터가 사라져 초기화가 필요합니다.", "195": "크랭크각센서는 광학식·인덕티브·홀센서 방식입니다. 스피드덴시티는 흡입공기량을 간접 계산하는 방식이라 오답입니다.", "196": "MAP 센서는 5V 기준 전원을 쓰는 아날로그 센서라 파형 전압 축을 5V로 맞춥니다.", "197": "유압 라인에 공기가 섞이면 압축되어 엔진 정지 때와 작동 때의 오일 레벨 차이가 5mm 이상 벌어집니다. 에어 빼기를 합니다.", "198": "삼원촉매는 약 300℃ 부근에서 정화를 시작(활성 개시 온도, LOT)하고, 400~800℃에서 정화율이 가장 높습니다.", "199": "예비 분사는 주 분사 전에 소량을 미리 태워 연소실 온도를 높이고 착화 지연을 줄입니다. 그래서 폭발압력이 급하게 오르지 않아 소음과 진동이 줄어듭니다. 후처리 필터 재생과 촉매 공급은 사후 분사의 역할입니다."};

function firstSentence(s){ s=String(s||'').trim(); var m=s.match(/^[\s\S]*?[.!?](?=\s|$)/); var o=(m?m[0]:s); return o.length>130?o.slice(0,128)+'…':o; }

  if(S.whyFor===id&&S.whyList) return S.whyList;

  if(pool.length<2) return null;

}

function addSim(id){
  S.sim=S.sim||{}; if(S.sim[id]!==undefined) return;
  var sub=D[id][1], keys=DX[id]||[], ahead=S.queue.slice(S.i+1);
  var c=[]; D.forEach(function(it,i){
    if(i===id||it[1]!==sub||ahead.indexOf(i)>-1) return;
    var share=(DX[i]||[]).some(function(k){return keys.indexOf(k)>-1;});
    c.push({i:i,w:share?2:1});
  });
  if(!c.length) return;
  var bag=[]; c.forEach(function(x){ for(var n=0;n<x.w;n++) bag.push(x.i); });
  var pick=bag[Math.floor(Math.random()*bag.length)];

function startCmp(){

function cmpView(){
  var q=S.cq, it=q.items[q.i], p=CMP[it.p];
  var h='<div class="col narrow" style="padding-top:28px"><div class="meta"><span>'+MODES.cmp+'</span><span>'+(q.i+1)+' / '+q.items.length+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+q.items.length+'" aria-valuenow="'+q.i+'"><i style="width:'+(q.i/q.items.length*100)+'%"></i></div>';
  h+='<div class="card"><div class="tag"><span>'+esc(p.a)+' · '+esc(p.b)+'</span><em>짝 비교</em></div><h1 class="stmt">'+esc(it.s)+'</h1><div class="mt-note">이 설명은 어느 쪽일까요?</div>';
  var sides=q.flip?['b','a']:['a','b'];
  h+='<div class="cmp">'+sides.map(function(sd){
    var cls='btn'+(q.ans?(sd===it.side?' ok':(sd===q.ans?' no':'')):'');
    return '<button class="'+cls+'" data-cmp="'+sd+'"'+(q.ans?' disabled':'')+'>'+esc(p[sd])+'</button>';
  }).join('')+'</div>';
  if(q.ans){
    var ok=q.ans===it.side;
    h+='<div class="res '+(ok?'ok':'no')+'">'+(ok?ICON.ok:ICON.no)+'<h3>'+(ok?'맞았습니다':'정답은 '+esc(p[it.side])+'입니다')+'</h3><div class="tip">'+esc(it.s)+' → '+esc(p[it.side])+'</div></div>';
    if(!ok) h+=p.f.map(function(k){ return '<div class="detail"><div class="cap">구조도 · '+esc(DXT[k]||k)+' <em>눌러서 크게 보기</em></div><div class="wide"><img class="figwide" data-zoom="1" alt="'+esc(DXT[k]||k)+'" src="diagrams/'+k+'.svg"></div></div>'; }).join('');
    h+='<div class="row"><button class="btn pri grow" data-cnext="1">다음 <kbd>Enter</kbd></button></div>';
  }
  return h+'</div><button class="link" data-quit>그만하기</button></div>';
}

function startCalc(){
  S.kq={items:shuffle(CALC).slice(0,6),i:0,ok:0,miss:[],cur:null};
  S.mode='calc'; S.view='calc'; S.kq.cur=mkCalc(); render(); window.scrollTo(0,0);

function mkCalc(){
  var it=S.kq.items[S.kq.i]; if(!it) return null;
  return {it:it,step:0,mistakes:0,wrong:[],chosen:[],orders:it.s.map(function(st){return shuffle(st[1].map(function(_,i){return i;}));}),done:false};
}
function calcView(){
  var q=S.kq, c=q.cur, it=c.it, h='<div class="col narrow" style="padding-top:28px">';
  h+='<div class="meta"><span>'+MODES.calc+'</span><span>'+(q.i+1)+' / '+q.items.length+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+q.items.length+'" aria-valuenow="'+q.i+'"><i style="width:'+(q.i/q.items.length*100)+'%"></i></div>';
  h+='<div class="card"><div class="tag"><span>'+esc(it.t)+'</span><em>계산</em></div><h1 class="q">'+esc(it.q)+'</h1>';
  h+='<div class="given">'+it.g.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>';
  h+='<div class="steps">';
  for(var k=0;k<c.chosen.length;k++) h+='<div class="step-done"><b>'+(k+1)+'</b><span><b style="background:none;display:inline;width:auto;height:auto;margin:0">'+esc(it.s[k][0])+'</b> '+esc(it.s[k][1][it.s[k][2]])+'</span></div>';
  h+='</div>';
  if(!c.done){
    var st=it.s[c.step];
    h+='<div class="mt-note">단계 '+(c.step+1)+' / '+it.s.length+' · '+esc(st[0])+'</div><div class="opts">';
    c.orders[c.step].forEach(function(oi,n){
      var bad=c.wrong.indexOf(oi)>-1;
      h+='<button class="btn" data-copt="'+oi+'"'+(bad?' disabled style="opacity:.45;text-decoration:line-through"':'')+'>'+(n+1)+'&nbsp;&nbsp;'+esc(st[1][oi])+'</button>';
    });
    h+='</div>';
    if(c.wrong.length) h+='<div class="tip" style="color:var(--negative)">아닙니다. 다시 생각해 보세요.</div>';

    h+='<div class="res '+(c.mistakes?'fmt':'ok')+'">'+(c.mistakes?ICON.fmt:ICON.ok)+'<h3>'+(c.mistakes?'풀었지만 '+c.mistakes+'번 틀렸습니다':'한 번에 맞혔습니다')+'</h3><div class="key">'+esc(it.s[it.s.length-1][1][it.s[it.s.length-1][2]])+'</div></div>';

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b||S.view!=='calc') return;
  var q=S.kq, c=q.cur;
  if(b.dataset.copt!==undefined&&!c.done){
    var oi=+b.dataset.copt, st=c.it.s[c.step];
    if(oi===st[2]){ c.chosen.push(oi); c.wrong=[]; c.step++; if(c.step>=c.it.s.length){ c.done=true; if(!c.mistakes) q.ok++; else q.miss.push(c.it.t); } render(); }
    else { c.mistakes++; c.wrong.push(oi); render(); }
    return;
  }
  if(b.dataset.knext){ q.i++; if(q.i>=q.items.length){ xResult('calc',q.ok,q.items.length,q.miss); return; } q.cur=mkCalc(); render(); window.scrollTo(0,0); }
});
