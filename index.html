*{box-sizing:border-box}

var EXP={"0": "삼원촉매는 약 400~800℃에서 정화율이 높고 오래 갑니다. 너무 높으면 촉매가 열화됩니다.", "1": "삼원은 HC·CO·NOx 세 가지입니다. N2는 NOx가 환원된 결과물입니다.", "2": "NOx가 환원되며 나온 O2가 HC·CO를 산화시킵니다. 한 촉매에서 환원과 산화가 같이 일어납니다.", "3": "삼원촉매가 HC·CO·NOx를 한꺼번에 정화합니다.", "4": "산소센서가 배기 중 산소를 감지해 혼합비를 이론공연비(14.7) 근처로 맞춥니다.", "6": "후단 센서는 촉매 성능 감시용이라 농후/희박만 구분하는 바이너리 타입을 씁니다.", "7": "지르코니아는 대기와 배기의 산소 농도 차이로 전압을 만들고, 이론공연비 부근에서 전압이 급변합니다.", "8": "티타니아는 전압이 아니라 저항이 변하는 방식입니다. 농후 0V, 희박 5V를 출력합니다.", "9": "14.7:1은 공기 14.7kg에 연료 1kg입니다. 부피가 아니라 공기의 질량입니다.", "10": "λ = 실제 공기량 ÷ 이론 공기량입니다. 1보다 크면 공기가 남는 희박, 작으면 농후입니다.", "12": "CO는 불완전 연소 가스입니다. 농후하면 산소가 부족해 많이 나옵니다.", "13": "HC는 타지 않고 나온 연료입니다. 농후할 때, 또 아주 희박해 실화가 날 때 늘어납니다.", "14": "디젤은 NOx와 PM이 서로 반대로 움직입니다. 연소온도가 높으면 NOx↑·PM↓, 농후하고 온도가 낮으면 PM↑입니다.", "15": "EGR은 배기가스 일부를 흡기로 돌려 연소온도를 낮춰 NOx를 줄입니다.", "19": "증발가스 계통은 탱크 → 캐니스터 → PCSV → 흡기입니다. EGR은 배기 재순환이라 별개 계통입니다.", "20": "캐니스터의 활성탄은 연료탱크 증발가스(HC)를 흡착해 두었다가 PCSV로 흡기에 보냅니다.", "21": "PCSV는 듀티율로 열림량을 조절해 캐니스터의 증발가스를 흡기로 보냅니다.", "23": "연료 탱크 압력 센서가 증기압을 감지해 퍼지 제어와 누설 판정에 씁니다.", "24": "가압식은 탱크에 압력을 가한 뒤 압력이 유지되는지로 누설을 판정합니다.", "25": "블로우바이 계통은 PCV 밸브·브리더 호스 등입니다. 롤오버밸브는 전복 시 연료를 막는 연료탱크 쪽 부품입니다.", "26": "블로우바이는 피스톤과 실린더 틈으로 크랭크케이스에 샌 가스를 PCV로 흡기에 되돌려 태웁니다. 사이트 기준 오답 표현은 '배기매니폴드로 배출되는 가스'입니다.", "27": "피에조 소자는 코일보다 응답이 빨라 다단 분사에 유리하고 분사압은 최대 약 1,800bar입니다.", "28": "주 분사 전에 소량을 먼저 분사해 연소실 압력 상승을 완만하게 합니다.", "29": "주 분사 뒤에 추가로 분사해 배기온도를 올리고 DPF 재생이나 LNT에 HC를 공급합니다.", "33": "CRDI는 연료 소비가 줄어드는 것이 장점입니다. '연료 소비의 향상'은 반대 뜻이라 오답입니다.", "34": "커먼레일의 장점은 성능·연비 향상과 배출가스·소음 감소입니다. 중량화는 장점이 아닙니다.", "40": "DPF는 PM(그을음)을 잡는 필터입니다. 질소산화물은 SCR이나 LNT가 처리합니다.", "44": "SCR은 EGR 역할이 줄고 DPF 용량을 줄일 수 있으며 불필요한 배압이 없습니다.", "45": "요소수는 요소 약 32.5% 수용액이고 어는점이 약 -11℃입니다. 촉매 앞에서 분사돼 암모니아로 바뀝니다.", "46": "공기 조절 밸브가 흡입공기량을 제어하고 시동 정지 시 흡입통로를 닫습니다.", "49": "CKPS는 피스톤 위치와 엔진 회전수를 알려 줘 분사·점화 시기를 정하는 기준이 됩니다.", "51": "12V를 인가하고 홀 효과로 디지털(구형파) 신호를 내는 것은 홀센서 방식입니다. 인덕티브는 교류 정현파입니다.", "52": "AFS는 핫필름·칼만와류 방식입니다. CKPS·CMPS·TPS는 홀 방식이 쓰입니다.", "53": "부조실린더 검사에서는 CKPS와 CMPS 신호로 회전수를 판단합니다.", "56": "전자식 스로틀(ETC)이 고장 나면 급발진이나 시동 꺼짐이 생길 수 있어 안전상 O입니다.", "60": "EMS의 장점은 연비·출력·배출가스 개선입니다. 황사 억제는 EMS와 관련이 없습니다.", "61": "AFS 직접계측은 질량 유량을 재는 핫와이어·핫필름·칼만와류입니다. 맵 센서는 간접계측입니다.", "63": "급출발하면 뒤가 주저앉고 앞이 들립니다(스쿼트). 이를 막는 제어가 안티 스쿼트입니다.", "64": "제동하면 앞이 숙여지는 현상이 다이브입니다. 이를 막는 제어가 안티 다이브입니다.", "65": "G센서는 차체 가속도를 검출해 롤(좌우 기울어짐)을 감지합니다.", "67": "타이로드 엔드는 조향 부품이라 차고 유지와 관계가 없습니다.", "68": "좌우 바퀴를 잇는 스테빌라이저가 롤링을 억제합니다.", "69": "스테빌라이저는 롤링(좌우 기울어짐)을 억제합니다. 상하 바운싱 방지는 쇽업소버·스프링의 몫입니다.", "70": "맥퍼슨형은 위시본형보다 부품이 적고 구조가 간단합니다.", "71": "V자 탄성 암을 상·하단에 조립하는 앞 현가장치는 위시본형입니다.", "75": "프리 피스톤으로 오일과 고압 질소를 나눈 단통 가스식 쇽업소버는 드카르봉식입니다.", "76": "차체 전체가 Z축(상하)으로 움직이면 바운싱입니다.", "77": "정면에서 볼 때 좌우로 기우는 회전이 롤링입니다.", "78": "앞뒤로 끄덕이듯 흔들리는 것이 피칭입니다.", "79": "스프링 위(차체): 바운싱·롤링·피칭·요잉. 스프링 아래(바퀴·차축): 휠 홉·휠 트램프·와인드업입니다.", "81": "스프링 아래 질량이 상하로 출렁이면 휠 홉입니다.", "83": "시미는 바퀴 회전 불균형 때문에 스티어링 휠이 떨리는 현상입니다.", "84": "MDPS는 모터 위치에 따라 컬럼(C)·피니언(P)·랙(R)형만 있습니다. 링기어 구동식은 없습니다.", "85": "머리글자를 그대로 연결합니다. C=컬럼 축, P=피니언 축, R=랙 축입니다.", "86": "타이로드는 조향 링크 부품이지 동력 조향 방식이 아닙니다.", "88": "전동식은 저속에서 조향이 가볍고 고속에서 무거워지는 특성이 있습니다. 사이트 기준 오답 표현은 '저속 주행안전성이 향상된다'입니다.", "89": "전자제어 동력 조향은 에너지 소모를 줄이는 방식입니다. '연료소비율을 높여'라는 표현이 틀렸습니다.", "91": "구비조건은 내구성과 신뢰도가 높아야 하는 것입니다. '낮아야 한다'는 오답입니다.", "92": "차속감응=속도에 따른 조향력, 직진안정=복원력·직진성, 롤링억제=급조향 시 롤링, 페일세이프=이상 시 안전 제어입니다.", "97": "프리로드 점검은 핸들을 중립 위치에서 측정합니다. 끝까지 돌린 뒤 측정하지 않습니다.", "103": "스테이터가 오일 흐름 방향을 바꿔 펌프를 돕게 하므로 토크가 증대됩니다.", "105": "D·R 모두 낮음=엔진 출력 부족·토크컨버터 불량, 모두 높음=오일 부족·라인압 저하, D만 높음=원웨이 클러치, R만 높음=프런트 클러치입니다.", "106": "스톨 테스트는 주차브레이크를 당기고 브레이크 페달을 강하게 밟은 채 합니다. 살짝 밟으면 차가 움직입니다.", "122": "공기 브레이크는 보조가 아니라 주 제동장치입니다. 보조 브레이크는 배기·엔진 브레이크 같은 것입니다.", "126": "(150+120) ÷ (700+450) × 100 = 23.47이고 소수 둘째 자리 이하를 버려 23.4%입니다.", "127": "(130+170) ÷ (900+600) × 100 = 20%입니다.", "128": "(150+190) ÷ 950 × 100 = 35.78이고 버림해 35.7%입니다.", "129": "(130+170+100+90) ÷ (900+600) × 100 = 32.67이고 버림해 32%입니다.", "131": "LIN은 Single Master / Multi Slave입니다. multi master라는 표현은 X입니다.", "132": "LIN은 1선의 저속·저비용 통신입니다. 고비용이라는 설명이 틀렸습니다.", "134": "이모빌라이저는 K-line 통신을 씁니다.", "135": "엔진·변속기·VDC·에어백처럼 빠르고 신뢰가 필요한 곳은 고속 CAN입니다.", "137": "bus off는 오류가 많아 제어기가 스스로 버스에서 이탈한 상태입니다.", "138": "CAN은 양 끝 120Ω 두 개가 병렬이라 합성 약 60Ω입니다. '반드시 120Ω 이상'이라는 설명이 틀렸습니다.", "140": "한쪽 주선이 끊기면 종단저항 하나만 남아 약 120Ω이 측정됩니다.", "146": "CAN은 ID 숫자가 작을수록 우선순위가 높습니다. '큰 ID가 우선'은 오답입니다.", "156": "직렬 합성저항 4+8+12 = 24Ω이고 I = 12 ÷ 24 = 0.5A입니다.", "157": "R = V ÷ I = 12 ÷ 0.125 = 96Ω입니다.", "158": "들어오는 전류 합 1+3+4 = 8A, 나가는 전류 합 2 + I5 = 8A이므로 I5 = 6A입니다.", "162": "파워 MOSFET은 파워 TR보다 내부저항이 작아 손실이 적고 큰 전류를 제어합니다.", "164": "조도 = 광도 ÷ 거리² = 18000 ÷ 9 = 2000 Lux입니다.", "165": "냉매 압력은 외기온도에 비례해 변합니다. 온도가 높으면 압력이 오르므로 X입니다.", "166": "엔진 정지 후 고압측으로 충전하고, 가동 중 저압으로 액체 냉매를 넣으면 압축기가 액체를 압축해 손상됩니다.", "168": "냉동오일과 함께 주입하는 형광액은 5mL입니다.", "170": "R-1234yf는 ODP 0, GWP 4인 친환경 냉매입니다.", "172": "압축기 → 응축기 → 리시버드라이어 → 팽창밸브 → 증발기입니다.", "173": "냉난방장치 중 실외에 있는 것은 응축기입니다.", "179": "핀서모 센서는 증발기 온도를 감지해 일정 이하면 압축기를 정지시킵니다.", "180": "핀서모 센서는 증발기가 어는 빙결을 막습니다.", "182": "핀서모 센서의 에어컨 릴레이 OFF 온도는 증발기 출구 약 0~0.5℃입니다.", "183": "AQS는 유해가스를 감지하는 센서입니다.", "184": "AQS는 유해가스를 감지하면 내기모드로 전환합니다. 필터링이 아니라서 X입니다.", "186": "레인센서 구성품은 발광 다이오드·수광 다이오드·커플링 패드입니다. 반사판은 아닙니다.", "188": "레인센서는 와이퍼·헤드라이트·공조를 제어합니다. 강우량은 제어 대상이 아니라 감지 대상입니다.", "190": "빛=라이트, 일조량=공조, 강우량=와이퍼입니다.", "192": "홀 센서 방식도 배터리가 방전되면 데이터가 사라져 초기화가 필요합니다.", "195": "크랭크각센서는 광학식·인덕티브·홀센서 방식입니다. 스피드덴시티는 흡입공기량을 간접 계산하는 방식이라 오답입니다.", "196": "MAP 센서는 5V 기준 전원을 쓰는 아날로그 센서라 파형 전압 축을 5V로 맞춥니다.", "197": "유압 라인에 공기가 섞이면 압축되어 엔진 정지 때와 작동 때의 오일 레벨 차이가 5mm 이상 벌어집니다. 에어 빼기를 합니다.", "198": "삼원촉매는 약 300℃ 부근에서 정화를 시작(활성 개시 온도, LOT)하고, 400~800℃에서 정화율이 가장 높습니다.", "199": "예비 분사는 주 분사 전에 소량을 미리 태워 연소실 온도를 높이고 착화 지연을 줄입니다. 그래서 폭발압력이 급하게 오르지 않아 소음과 진동이 줄어듭니다. 후처리 필터 재생과 촉매 공급은 사후 분사의 역할입니다."};

var GAL=[["art", "가장 짧은 오버행, 르노 스포츠풍 핫해치 쇼카", "", "컨셉카는 양산 전에 디자인 방향과 신기술을 보여 주려고 만드는 시제품입니다.", 1.0], ["f1", "콜라병 곡선으로 와류를 다듬는 R25", "", "F1 머신은 휠이 차체 밖으로 열려 있어 공기 흐름이 복잡해지고, 그래서 윙과 바지보드로 기류를 정리합니다. 푸른색·노란색 도색은 르노 F1 팀의 상징 색입니다.", 0.56], ["car", "곤 체제 닛산의 유러피언 3박스 세단", "", "세단은 엔진룸·실내·트렁크가 분리된 3박스 구조입니다. 닛산 계열 세단으로 보이지만 모델 확정은 어렵습니다.", 1.5], ["poster", "백지에서 태어난 최초의 랠리 전용차, 스트라토스", "", "스트라토스는 랠리 우승을 위해 처음부터 새로 설계한 월드 랠리카로, 베르토네의 마르첼로 간디니가 디자인했고 페라리 디노 V6를 중앙에 얹었습니다. 1974·1975·1976년 WRC 제조사 부문에서 우승했습니다.", 0.67], ["poster", "규정 허점을 파고든 1994 르망의 포르쉐", "", "르망 24시는 1923년 시작된 세계에서 가장 오래된 내구 레이스입니다. 차의 성능뿐 아니라 24시간을 버티는 내구성과 정비 팀의 속도가 승부를 가릅니다.", 0.75], ["f1", "슈마허의 5년 독주를 끝낸 R25의 V10", "", "2005년 르노 R25로 페르난도 알론소가 당시 최연소 드라이버 챔피언이 되었고, 르노는 2005·2006 컨스트럭터스 챔피언을 차지했습니다.", 0.6], ["poster", "후륜으로 개조한 NISMO 제크셀 GT-R", "", "NISMO는 1984년 설립된 닛산의 모터스포츠·튜닝 부문입니다. 제크셀(ZEXEL)은 자동차 부품 회사로, 후원사 로고가 차체 외관이 되는 점이 모터스포츠의 특징입니다.", 0.71], ["car", "저속 셔터로 담은 패닝 샷 속 금빛 세단", "", "배경을 흐리는 패닝(panning) 촬영으로 차를 선명하게 두고 주변만 흐리게 해 속도를 표현합니다.", 1.07], ["people", "카발리노 람판테, 전투기 문장에서 페라리 깃발로", "", "페라리의 말(카발리노 람판테)은 1차 대전 이탈리아 에이스 프란체스코 바라카의 문장이었고, 엔초 페라리가 1923년 그의 부모에게 허락받아 썼다고 전해집니다. 노란 바탕은 페라리의 고향 모데나의 시색입니다.", 1.04], ["art", "클레이 모델 전에 선 하나로 정해지는 비율", "", "양산차 디자인은 스케치 → 클레이 모델 → 3D 모델링 순서로 구체화됩니다. 처음 스케치에서 비율(휠베이스·오버행)이 거의 정해집니다.", 1.33], ["people", "F1 옐로우를 닮은 르노 패독의 클리오", "", "노란색은 르노의 브랜드 색이고, 푸른색과 함께 르노 F1 팀의 도색에도 쓰였습니다. 차종은 르노 소형차로 보입니다.", 1.51], ["f1", "파르크 페르메에서 만난 르노 블루와 페라리 레드", "", "붉은색은 페라리, 푸른색은 르노 팀 도색으로 보이며 2000년대 중반 두 팀의 경쟁을 떠올리게 합니다.", 1.51], ["people", "스바루 555 슈트가 점검하는 랠리 타이어", "", "랠리는 비포장·눈길 등 노면이 계속 바뀌어 타이어 마모와 공기압 점검이 승부를 가릅니다. 섀시 영역의 타이어·휠 점검과 이어집니다. 슈트의 555 로고는 스바루 월드 랠리팀의 메인 스폰서였습니다.", 0.67], ["car", "버슬백 엉덩이로 충격을 준 2세대 메간", "", "르노 메간(Mégane)은 유럽에서 해치백 베스트셀러로 알려진 모델입니다.", 0.7], ["poster", "양의 탈을 쓴 늑대, 스카이라인 4도어 광고", "", "닛산 스카이라인은 1957년 프린스 스카이라인으로 시작했고, GT-R은 1969년에 처음 등장했습니다.", 0.8], ["art", "높은 무게중심과 싸우는 쿠페형 SUV", "", "SUV는 차체가 높고 지상고가 커서 승용차보다 무게중심이 높습니다. 그래서 롤링 억제와 현가장치 설계가 중요합니다.", 2.0], ["car", "F1 V10을 얹은 M5, 아이브로우 헤드램프", "", "2005~2010년 E60 M5는 F1에서 영감을 받은 5.0L V10(약 507마력, 8,250rpm 회전 한계) 엔진을 얹은 것으로 유명합니다.", 1.34], ["race", "호시노의 임풀 칼소닉 GT-R, 29전 29승 신화", "", "푸른색에 칼소닉(CALSONIC) 로고를 단 닛산 스카이라인 GT-R은 JGTC를 대표하는 이미지로 널리 알려져 있습니다.", 0.56], ["car", "종이접기 디자인 시대의 80년대 세단", "", "1980년대 세단은 직선 위주의 각진 디자인이 유행했고 공기저항 계수가 지금보다 높았습니다.", 1.4], ["f1", "1,400마력 괴물들의 터보 F1 시대", "", "1980년대는 1.5L 터보 엔진의 시대로, 예선용으로는 1,000마력을 넘는 출력이 나왔다고 합니다. 1977년 르노가 F1에 터보를 처음 도입했습니다.", 0.65], ["poster", "박서 럼블이 울리는 임프레자 WRX STi", "", "STi는 1988년 설립된 스바루 테크니카 인터내셔널의 약자로, 스바루의 모터스포츠·고성능 부문입니다. 수평 대향(박서) 엔진과 대칭형 AWD가 임프레자의 특징입니다.", 0.73], ["f1", "흑백 서킷에 남긴 R25의 프렌치 블루", "", "푸른색과 노란색은 르노 F1의 도색으로 알려져 있고, 흑백 바탕에 색을 남겨 머신을 강조했습니다.", 1.43], ["poster", "파리 거리에서 시작된 르노의 F1 혁신", "", "도시 일상과 서킷을 대비시켜 르노 F1 팀을 알리는 광고로 보입니다. 르노는 1898년 르노 형제가 세운 프랑스 자동차 회사입니다.", 1.42], ["car", "알루미늄 전단부로 50:50을 맞춘 M5", "", "BMW는 1916년 항공기 엔진 회사로 출발했습니다. 로고의 파랑·흰색은 바이에른 주의 색에서 왔고, 회전하는 프로펠러를 형상화했다는 이야기는 1929년 광고에서 퍼진 것으로 알려져 있습니다.", 1.32], ["poster", "호주가 붙인 별명, 고질라 GT-R", "", "R32 GT-R(1989)은 RB26DETT 2.6L 트윈터보와 ATTESA E-TS 4륜구동으로 당시 일본 투어링카 레이스를 석권했고, 호주 언론이 붙인 '고질라' 별명으로 유명합니다.", 0.8], ["people", "프로드라이브가 만든 스바루 WRC 3연패 시대", "", "스바루는 1995·1996·1997년 WRC 제조사 우승을 했고, 1995년에는 콜린 맥레이가 영국인 최초의 WRC 드라이버 챔피언이 되었습니다.", 0.82], ["car", "뒷좌석을 들어내고 V6를 얹은 광기의 클리오", "", "클리오 V6는 3.0L V6 엔진을 뒷좌석 자리에 얹은 미드십 후륜 구동 핫해치입니다. 개발과 생산에 TWR이 참여했습니다.", 1.33], ["f1", "속도의 제곱으로 커지는 다운포스, 4G 코너링", "", "F1은 코너에서 다운포스로 차를 노면에 눌러 줍니다. 속도가 높을수록 다운포스가 커져 고속 코너에서 훨씬 빨리 달릴 수 있습니다.", 0.56], ["poster", "마티니 스트라이프를 두른 델타 인테그랄레", "", "파랑·빨강 마티니 줄무늬는 모터스포츠에서 가장 유명한 도색 중 하나입니다. 랜치아 델타 인테그랄레는 마티니 도색으로 1987~1992년 WRC 제조사 6연속 우승을 했습니다.", 0.75], ["people", "800도를 견디는 노멕스 레이싱 슈트", "", "레이싱 슈트는 내화(방염) 소재로 만들어 화재에서 몇 초라도 더 버티게 합니다.", 1.78], ["poster", "알리탈리아 'A' 그래픽을 입은 스트라토스 #539", "", "이탈리아 항공사 알리탈리아가 랜치아 랠리팀을 후원한 시기의 도색으로 보입니다. 스트라토스는 'Stratos'라는 이름처럼 성층권을 뜻하는 이름입니다.", 0.6], ["poster", "30분 만에 완판된 22B STi, 소닉 블루와 금휠", "", "푸른 차체에 금색 휠은 스바루 WRC 머신의 상징적인 조합입니다.", 0.7], ["people", "2006 바레인 GP, 알론소와 슈마허의 라이벌전", "", "붉은 마를보로 팀복과 푸른 르노 팀복의 대비로 2000년대 중반 페라리와 르노의 경쟁이 떠오릅니다. 바레인 그랑프리 글자가 보입니다.", 1.78], ["art", "파란 바탕에 흰 줄, 프랑스 레이싱 리버리", "", "푸른색 바탕에 흰 줄무늬는 프랑스 레이싱 팀의 전통 도색이기도 합니다.", 0.81], ["car", "코너에서 네 바퀴를 움켜쥔 청색 쿠페", "", "배경을 흐리게 해 속도감을 살린 광고 사진입니다.", 0.86], ["f1", "크렘린 앞을 달린 르노 F1 로드쇼", "", "성 바실리 대성당은 이반 4세 때인 1555~1561년에 지어졌습니다. 이 장면은 모스크바 도심 시연 주행으로 보입니다.", 1.0], ["f1", "MILD SEVEN 노즈와 스푼형 프런트 윙", "", "마일드세븐은 일본담배산업(JT)의 담배 브랜드로 1990년대~2006년 르노(베네통) F1을 후원했습니다. 2005년 미국 GP에서는 미쉐린 타이어를 쓴 팀들이 안전 문제로 출전을 포기해 6대만 달렸습니다.", 0.75], ["poster", "소닉이 F1에 올라탄 1993 세가 마케팅", "", "소닉은 1991년 세가가 메가드라이브용으로 내놓은 캐릭터입니다. 빠른 속도가 상징이라 모터스포츠 이미지와 자주 이어졌습니다.", 0.67], ["car", "매직 아워 해안 도로 위의 블랙 세단", "", "검은색 차체는 광택과 오염이 도드라져 사진 촬영에서는 반사를 잘 다뤄야 합니다.", 1.64], ["f1", "세나의 12번, JPS 블랙 로터스 터보", "", "검은색과 금색의 JPS 도색 로터스가 대표적인 검은 F1 머신입니다.", 0.68], ["poster", "28년 만의 더블 챔피언, R25 기념 포스터", "", "R25는 2005년 르노 F1 머신으로 3.0L V10 엔진을 썼고 알론소가 챔피언이 되었습니다. 2006년부터는 규정이 2.4L V8로 바뀌었습니다.", 0.71], ["people", "우승 후 머신 위에 올라선 알론소의 세리머니", "", "우승 후 머신 위에서 환호하는 세리머니는 F1 시상식의 전통적인 장면입니다.", 0.56], ["f1", "카멜 옐로우 로터스 99T와 액티브 서스펜션", "", "카멜 노란색 도색은 1980년대 로터스 머신으로 유명합니다.", 0.56], ["art", "쇼카 제로에서 태어난 간디니의 쐐기", "", "스트라토스는 휠베이스 2.18m의 짧은 차체로 코너에서 방향 전환이 빨랐지만, 그만큼 직진 안정성은 까다로웠다고 알려져 있습니다.", 1.6], ["f1", "6점식 하네스에 묶인 F1 콕핏", "", "F1 드라이버는 6점식 안전벨트로 몸을 고정하고, 콕핏 주변에는 충돌 에너지를 흡수하는 구조가 있습니다.", 0.66], ["race", "붉은 광장에 번진 타이어 연기, 번아웃", "", "번아웃은 구동륜을 헛돌려 타이어를 달구는 동작입니다. 모스크바 도심 시연 주행으로 보입니다.", 1.5], ["car", "노을빛 패스트백 쿠페, 덕테일로 양력을 누르다", "", "쿠페는 2도어 형태로 지붕이 낮고 뒷좌석이 좁은 것이 보통입니다.", 1.2], ["car", "시선 이동을 줄인 르노 실내 설계", "", "이 세대 르노 실내는 센터 모니터와 계기판을 하나로 묶어 정리한 것이 특징입니다.", 1.33], ["race", "석세스 밸러스트와 칼소닉 블루 드라이버", "", "칼소닉(CALSONIC)은 자동차 열교환기·공조 부품 회사로, 푸른색 임풀(IMPUL) 스카이라인 GT-R로 JGTC에서 유명했습니다.", 1.49], ["f1", "슬립스트림뿐이던 터보 F1 휠 투 휠 배틀", "", "1980년대 터보 머신은 지금보다 윙이 작고 바퀴가 가늘어 기계적인 그립에 더 의존했습니다.", 1.01], ["people", "SENNA 번호판 NSX, 올 알루미늄 모노코크", "", "혼다 NSX와 같은 시리즈 사진으로 보입니다. NSX는 1990년 데뷔한 혼다의 미드십 스포츠카로 3.0L V6 VTEC 엔진을 썼습니다.", 0.81], ["poster", "엔지니어링 브리핑 같은 R25 스펙 시트", "", "F1 머신 사양표에는 엔진 형식, 무게(최소 중량 규정), 타이어 공급사 등이 적힙니다.", 0.71], ["car", "숲길을 가볍게 도는 레드 유러피언 해치백", "", "해치백은 뒤쪽이 위로 열리는 형태라 트렁크와 실내 공간이 이어집니다.", 1.33], ["car", "P400에서 P500으로, 305km/h 슬리퍼 M5", "", "BMW M은 1972년 BMW 모터스포츠로 시작했고 M5는 5시리즈의 고성능 버전입니다.", 1.36], ["poster", "데이토나를 제패한 닛산 R91CP", "", "그룹 C는 1982~1993년 내구 레이스용 스포츠 프로토타입 규정이고, 닛산 R91CP는 1992년 데이토나 24시에서 종합 우승했습니다.", 0.71], ["poster", "'Fernando is faster than you', 2010 팀 오더 무전", "", "\"Fernando is faster than you\"는 2005~2006년 르노 시절 알론소와 연결되어 유명해진 문구로 알려져 있습니다.", 0.75], ["car", "트렁크 모서리에 녹인 에어로, 2000년대 세단", "", "세단의 후면은 트렁크 리드와 테일 램프 디자인이 차의 인상을 정합니다.", 1.51], ["poster", "도시 전체가 서킷, 오픈월드 레이싱 게임 광고", "", "도시 도로를 달리는 'Midtown Madness' 같은 시리즈 광고로 보입니다.", 0.72], ["f1", "1달러에 레드불로 넘어간 재규어 레이싱", "", "초록은 영국 레이싱 그린입니다. 2000~2004년 재규어 레이싱의 색이었고 2004년 말 레드불에 팀이 인수되었습니다.", 0.67], ["f1", "레드불 본사가 된 재규어 팩토리의 콕핏", "", "재규어 레이싱은 포드 소유 팀으로 코스워스 엔진을 썼습니다.", 0.56], ["car", "짐차라는 편견을 깨는 유러피언 스포츠 왜건", "", "왜건(에스테이트)은 지붕이 뒤쪽까지 이어져 적재 공간이 넓습니다.", 1.33], ["poster", "모나코 부두 위로 튀어나온 R25 합성 광고", "", "F1 홍보 이미지는 서킷이 아닌 도시 풍경과 합성해 브랜드의 일상성을 강조하곤 합니다.", 1.0], ["poster", "헤드램프 켠 그룹 C 프로토타입 행렬", "", "내구 레이스는 한 대의 차를 여러 드라이버가 번갈아 몰아 몇 시간 동안 달립니다.", 0.56], ["art", "알핀 A110 유산을 잇는 블루 스터디", "", "알핀은 1955년 장 레데레가 세운 프랑스 브랜드이고, A110은 1973년 WRC 첫 제조사 챔피언십에서 우승했습니다. 현재는 르노 그룹의 브랜드입니다.", 1.0], ["race", "2초 안에 끝내는 12인의 피트스톱", "", "현대 F1의 피트스톱은 약 2초 안쪽(최고 기록 1.8초대)에 타이어 네 개를 교체합니다. 팀 정비사 20명 안팎이 호흡을 맞춥니다.", 0.62], ["art", "연석을 타고 날아오른 R25 일러스트", "", "F1 머신은 연석(커브)을 타고 넘는 일이 많아 서스펜션과 플로어가 큰 충격을 받습니다.", 1.47], ["art", "선과 원호만으로 그린 스트라토스 해부", "", "스트라토스는 1970년대 랠리를 지배한 이탈리아 차로, 길이가 짧고 폭이 넓은 쐐기형 차체가 특징입니다.", 1.0], ["race", "알론소마니아가 번진 스페인 그랑프리", "", "스페인 국기는 알론소의 인기와 연결되어 2005~2006년 르노 시절 관중석에서 흔히 보였습니다.", 0.67], ["art", "카트에서 F3까지, 카페타 21권", "", "'카페타(Capeta)'는 소다 마사토가 그린 카트 레이서 소년의 성장 만화로 알려져 있습니다. 표지의 21은 단행본 권수로 보입니다.", 0.69], var HUE=[175,32,265,330,95,205,12,150];
function lpairs(it){
  var ls=String(it[4]).split('\n'), out=[];
  for(var i=0;i<ls.length;i++){ var p=ls[i].split(' = '); if(p.length!==2) return null; out.push([p[0].trim(),p[1].trim()]); }
  return out.length>=2?out:null;
}
function mkMT(pairs,extra){
  var rights=pairs.map(function(p){return p[1];}).concat(extra||[]);
  var order=shuffle(rights.map(function(_,i){return i;}));
  var right=order.map(function(i){return rights[i];});
  var ans=pairs.map(function(_,i){return order.indexOf(i);});
  return {left:pairs.map(function(p){return p[0];}),right:right,ans:ans,map:{},sel:null,checked:false,res:null};
}

var NOLABEL=['시험 포인트','점검 포인트','단점','측정 설정','제어 원리','시험 방법','프로토콜','추가','입력 (센서)','출력 (액추에이터)','입력','출력'];
function dgCands(doc){
  var out=[], seen={};
  [].slice.call(doc.querySelectorAll('text')).forEach(function(el){
    if(el.getAttribute('class')) return;
    var s=(el.textContent||'').trim();
    if(s.length<2||s.length>16||seen[s]||NOLABEL.indexOf(s)>-1) return;
    if(/[\u2192\u2713\u2717:=]|^\d+$|^[\d.]+V?$/.test(s)) return;
    seen[s]=1; out.push(el);
  });
  return out;
}
function dgMask(text){
  var doc=new DOMParser().parseFromString(text,'image/svg+xml');
  var c=dgCands(doc);
  if(c.length<6) return null;
  var K=c.length>=10?5:4, pick=shuffle(c).slice(0,K);
  var rest=shuffle(c.filter(function(x){return pick.indexOf(x)<0;})).slice(0,2);
  var ns='http://www.w3.org/2000/svg';
  pick.forEach(function(el,i){
    var x=+el.getAttribute('x'), y=+el.getAttribute('y'), s=(el.textContent||'').trim();
    var st=el.getAttribute('style')||'', m=st.match(/font-size:\s*(\d+)/), fs=m?+m[1]:12;
    var w=0; for(var k=0;k<s.length;k++) w+=s.charCodeAt(k)>255?fs:fs*.58; w+=12;
    var an=el.getAttribute('text-anchor')||'start', rx=an==='middle'?x-w/2:an==='end'?x-w:x-3;
    var g=doc.createElementNS(ns,'g');
    var r=doc.createElementNS(ns,'rect'); r.setAttribute('x',rx); r.setAttribute('y',y-fs-1); r.setAttribute('width',Math.max(w,34)); r.setAttribute('height',fs+8); r.setAttribute('rx',4);
    r.setAttribute('fill','#fff'); r.setAttribute('stroke','#c05a00'); r.setAttribute('stroke-width','1.4'); r.setAttribute('stroke-dasharray','4 2');
    var q=doc.createElementNS(ns,'text'); q.setAttribute('x',rx+Math.max(w,34)/2); q.setAttribute('y',y+1); q.setAttribute('text-anchor','middle'); q.setAttribute('style','font-size:14px;font-weight:700;fill:#c05a00');
    q.textContent=String(i+1);
    g.appendChild(r); g.appendChild(q); el.parentNode.replaceChild(g,el);
  });
  return {svg:new XMLSerializer().serializeToString(doc.documentElement),names:pick.map(function(e){return (e.textContent||'').trim();}),extra:rest.map(function(e){return (e.textContent||'').trim();})};
}

function firstSentence(s){ s=String(s||'').trim(); var m=s.match(/^[\s\S]*?[.!?](?=\s|$)/); var o=(m?m[0]:s); return o.length>130?o.slice(0,128)+'…':o; }
function expOf(id){ return firstSentence((typeof EXP!=='undefined'&&EXP[id])||D[id][6]||''); }
function whyOpts(id){
  if(S.whyFor===id&&S.whyList) return S.whyList;
  var right=expOf(id); if(!right) return null;
  var pool=[]; D.forEach(function(it,i){ if(i!==id&&it[2]==='o'){ var e=expOf(i); if(e&&e!==right&&pool.indexOf(e)<0) pool.push(e); } });
  if(pool.length<2) return null;
  var list=shuffle([right].concat(shuffle(pool).slice(0,2)));
  S.whyFor=id; S.whyList=list; return list;
}
function pickOX(v){
  var id=S.queue[S.i], it=D[id], r=(v===it[4])?'ok':'no';
  if(whyOpts(id)){ S.oxr=r; S.oxv=v; S.why=null; S.stage='why'; render(); return; }
  handleRes(r);
}
function whyHTML(id){
  var h='<div class="mt-note">선택한 답: <b>'+esc(S.oxv)+'</b> · 그렇다면 이유는 무엇일까요?</div><div class="opts">';

}
function pickWhy(k){
  var id=S.queue[S.i], list=whyOpts(id); if(!list) return;
  S.why={pick:list[k],ok:list[k]===expOf(id)};
  handleRes(S.oxr);
}

function addSim(id){
  S.sim=S.sim||{}; if(S.sim[id]!==undefined) return;
  var sub=D[id][1], keys=DX[id]||[], ahead=S.queue.slice(S.i+1);
  var c=[]; D.forEach(function(it,i){
    if(i===id||it[1]!==sub||ahead.indexOf(i)>-1) return;
    var share=(DX[i]||[]).some(function(k){return keys.indexOf(k)>-1;});
    c.push({i:i,w:share?2:1});
  });
  if(!c.length) return;
  var bag=[]; c.forEach(function(x){ for(var n=0;n<x.w;n++) bag.push(x.i); });
  var pick=bag[Math.floor(Math.random()*bag.length)];
  S.sim[id]=pick; S.queue.splice(S.i+1,0,pick);
}

function startCmp(){

function cmpView(){
  var q=S.cq, it=q.items[q.i], p=CMP[it.p];
  var h='<div class="col narrow" style="padding-top:28px"><div class="meta"><span>'+MODES.cmp+'</span><span>'+(q.i+1)+' / '+q.items.length+'</span></div>';
  h+='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+q.items.length+'" aria-valuenow="'+q.i+'"><i style="--p:'+((q.i/q.items.length*100))/100+'"></i></div>';
  h+='<div class="card"><div class="tag"><span>'+esc(p.a)+' · '+esc(p.b)+'</span><em>짝 비교</em></div><h1 class="stmt">'+esc(it.s)+'</h1><div class="mt-note">이 설명은 어느 쪽일까요?</div>';
  var sides=q.flip?['b','a']:['a','b'];
  h+='<div class="cmp">'+sides.map(function(sd){
    var cls='btn'+(q.ans?(sd===it.side?' ok':(sd===q.ans?' no':'')):'');
    return '<button class="'+cls+'" data-cmp="'+sd+'"'+(q.ans?' disabled':'')+'>'+esc(p[sd])+'</button>';
  }).join('')+'</div>';
  if(q.ans){
    var ok=q.ans===it.side;
    h+='<div class="res '+(ok?'ok':'no')+'">'+(ok?ICON.ok:ICON.no)+'<h3>'+(ok?'맞았습니다':'정답은 '+esc(p[it.side])+'입니다')+'</h3><div class="tip">'+esc(it.s)+' → '+esc(p[it.side])+'</div></div>';
    if(!ok) h+=p.f.map(function(k){ return '<div class="detail"><div class="cap">구조도 · '+esc(DXT[k]||k)+' <em>눌러서 크게 보기 · 부품·용어를 눌러 설명 보기</em></div><div class="wide"><img class="figwide" data-zoom="1" alt="'+esc(DXT[k]||k)+'" src="diagrams/'+k+'.svg"></div></div>'; }).join('');
    h+='<div class="row"><button class="btn pri grow" data-cnext="1">다음 <kbd>Enter</kbd></button></div>';

}

  function sim(detail,key,wrap){
    var S0=SIMS[key]; if(!S0||detail.querySelector('.sim')) return;
    var box=document.createElement('div'); box.className='sim';
    var vals={}, h='<h4>'+S0.t+'</h4>';

    h+='<div class="sres" aria-live="polite"></div>';
    if(S0.st) h+='<h5 class="sth">풀이 순서</h5><ol class="sstep"></ol>';
    box.innerHTML=h; detail.appendChild(box);
    var res=box.querySelector('.sres'), mk=null;
    if(S0.mark){ mk=[document.createElement('span'),document.createElement('span')]; mk.forEach(function(m){ m.className='hsm'; wrap.appendChild(m); }); }
    function upd(){
      if(S0.st) box.querySelector('.sstep').innerHTML=S0.st(vals).map(function(t){ return '<li>'+esc2(t)+'</li>'; }).join('');
      res.innerHTML=S0.f(vals).map(function(r){ return '<div'+(r[2]?' class="em"':'')+'>'+r[0]+' <b>'+r[1]+'</b></div>'; }).join('');
      if(mk){ var L=vals.L, s=ss((L-0.985)/0.03), hi=318, lo=400;
        var zx=96+(L-0.9)/0.2*224, tx=440+(L-0.9)/0.2*230;
        var zy=lo-(0.9-0.8*s-0.1)/0.8*(lo-hi), ty=lo-(5*s)/5*(lo-hi);
        // 곡선(색 반전) 기준: 지르코니아는 높은 쪽이 위, 티타니아는 낮은 쪽이 아래
        var pos=[[zx,zy],[tx,ty]];
        mk.forEach(function(m,i){ m.style.left=(pos[i][0]/720*100)+'%'; m.style.top=(pos[i][1]/540*100)+'%'; });
      }
    }
    box.addEventListener('input',function(e){ var k=e.target.getAttribute('data-k'); if(!k) return; vals[k]=+e.target.value; var c=S0.c.filter(function(x){ return x[0]===k; })[0]; e.target.nextElementSibling.textContent=vals[k]+c[6]; upd(); });
    upd();
  }

  var PINS2={"aps-etc": [["가속 페달(APS)", "가속 페달(APS)", "운전자가 밟은 양을 두 개의 센서(APS1·APS2) 전압으로 바꿔 ECU에 알립니다. 두 센서는 서로 다른 전압을 내서 서로 검증합니다.", "한쪽 센서가 이상하면 경고등과 함께 출력이 제한되고(림프홈) 공회전이 불안정하거나 가속이 둔해집니다."], ["ECU", "ECU", "APS 신호와 TPS 피드백을 비교해 목표 스로틀 열림량을 계산하고 ETC 모터를 구동합니다.", "제어가 안 되면 스로틀이 정해진 위치에 머물고 출력이 제한되며 고장 코드가 저장됩니다."], ["ETC 모터", "ETC 모터", "ECU 명령에 따라 스로틀 밸브를 열고 닫는 전동 모터입니다.", "작동이 불량하면 가속 지연·공회전 불안정·시동 꺼짐이 생기고 스로틀 경고등과 출력 제한이 나타납니다."], ["스로틀 밸브", "스로틀 밸브(ETC)", "흡입 공기량을 조절합니다. TPS 1·2가 열린 정도를 ECU에 되돌려 줍니다.", "카본이 끼면 공회전 불안정과 가속 불량, 센서가 불량이면 경고등과 출력 제한이 생깁니다."]], "atm-tcm": [["APS (가속 페달)", "APS(가속 페달)", "운전자의 가속 의지를 TCM이 읽어 변속 시점(변속선)을 정합니다.", "신호가 이상하면 변속 시점이 어긋나고 킥다운이 작동하지 않거나 변속 충격이 납니다."], ["차속·출력축 속도센서", "출력축 속도센서", "출력축 회전수(차속)를 TCM에 알려 변속 시점과 슬립을 판단하게 합니다.", "신호가 없으면 변속이 안 되거나 특정 단에 고정되고 변속 충격이 납니다."], ["입력축 속도센서", "입력축 속도센서", "터빈(입력축)의 회전수를 알려 슬립량과 댐퍼 클러치 작동 판단에 씁니다.", "신호가 이상하면 변속 충격과 댐퍼 클러치 불량이 생기고 변속기 경고등이 켜집니다."], ["유온 센서", "유온 센서", "변속기 오일 온도를 알려 줍니다. 온도가 오르면 저항이 낮아지는 부특성 저항으로, 댐퍼 클러치 작동 영역과 유압 보정에 씁니다.", "신호가 이상하면 냉간 변속 충격이 나거나 과열 보호가 작동하지 않아 오일이 쉽게 열화됩니다."], ["인히비터 스위치", "인히비터 스위치", "변속 레버 위치(P·R·N·D)를 TCM에 알리고 P·N에서만 시동이 걸리게 합니다.", "불량이면 시동이 안 걸리거나 P·N이 아닌 곳에서 걸리고 후진등이 안 켜집니다."], ["변속 솔레노이드", "변속 솔레노이드", "TCM 신호로 유로를 열고 닫아 클러치·브레이크 작동 순서를 바꿔 변속합니다.", "고착되거나 단선되면 특정 단 고정, 변속 충격, 변속 불능과 고장 코드가 나옵니다."], ["댐퍼 클러치 솔레노이드", "댐퍼 클러치 솔레노이드", "토크 컨버터의 댐퍼 클러치(록업)를 연결·해제합니다.", "불량이면 정속 주행에서 연비가 나빠지거나 저속에서 진동·시동 꺼짐이 생깁니다."], ["압력 제어 솔레노이드", "압력 제어 솔레노이드", "라인 압력을 제어해 변속 충격을 줄입니다.", "불량이면 변속 충격이 커지고 클러치가 미끄러집니다."]], "ccot-heatpump": [["압축기", "압축기", "냉매를 압축해 고온·고압 기체로 만듭니다. CCOT 방식은 클러치를 붙였다 떼어 온도를 조절합니다.", "클러치가 자주 붙었다 떨어지거나 안 붙으면 냉방이 약해지고 작동 소음이 납니다."], ["응축기", "응축기", "고온·고압 기체 냉매의 열을 방출해 액체로 만듭니다.", "냉방이 약해지고 고압이 지나치게 높아집니다."], ["오리피스 튜브", "오리피스 튜브", "팽창밸브 대신 고정된 가는 구멍으로 냉매를 감압·분사합니다.", "이물질로 막히면 냉매 흐름이 줄어 냉방이 약해지고 증발기 앞 배관에 서리가 낍니다."], ["증발기", "증발기", "저온·저압 냉매가 실내 공기의 열을 빼앗아 냉각합니다.", "냉기가 약해지고 곰팡이 냄새가 나며 표면이 얼 수 있습니다."], ["어큐뮬", "어큐뮬레이터", "증발기와 압축기 사이에서 냉매를 일시 저장하고 액체를 기체로 만들어 압축기로 보냅니다.", "수분 흡수 능력이 떨어지면 오리피스 튜브가 얼 수 있고, 액냉매가 넘어가면 압축기가 손상됩니다."]], "crank-sensors": [["홀 센서 방식", "홀 센서 방식", "전류가 흐르는 반도체에 자기장이 수직으로 걸리면 홀 전압이 생기는 원리로, 디지털 신호를 냅니다. 전원이 필요합니다.", "신호가 끊기면 시동이 안 걸리거나 주행 중 꺼지고 크랭크각·캠각 고장 코드가 저장됩니다."], ["인덕티브 방식", "인덕티브 방식", "영구자석 코일 옆을 톤 휠(돌기)이 지날 때 유도되는 아날로그(교류) 신호를 냅니다. 전원이 필요 없습니다.", "센서와 톤 휠 간극이 크거나 코일이 단선되면 신호가 약해져 시동 불량과 불규칙 회전이 생깁니다."], ["광학식", "광학식", "LED 빛이 슬릿 디스크를 통과하거나 차단될 때 포토 트랜지스터가 디지털 신호를 만듭니다.", "오염되거나 빛이 막히면 신호가 끊겨 시동이 안 걸립니다."]], "crdi-features": [["피에조 인젝터", "피에조 인젝터", "피에조 소자가 전압을 받으면 순간적으로 늘어나는 성질로 니들을 빠르게 열어 분사합니다. 반응이 빨라 다단 분사가 가능합니다.", "분사가 불량하면 소음·진동이 늘고 연기가 나며 출력이 떨어지고 실린더 불균형 고장 코드가 저장됩니다."], ["피에조 소자", "피에조 소자", "전기를 가하면 늘어나는 압전 소자로, 인젝터의 구동부 역할을 합니다.", "소자가 불량하면 해당 실린더가 분사되지 않아 실화와 시동 불량이 생깁니다."], ["니들", "니들", "연료 분사구를 열고 닫는 바늘 밸브입니다.", "마모되거나 고착되면 분사량과 분무가 불량해져 연소가 나빠지고 연기가 늘어납니다."]], "dpf-scr": [["DPF (입자상 물질 포집)", "DPF", "디젤 배기의 입자상 물질(PM)을 필터에 모으고, 쌓이면 고온으로 태워 없앱니다(재생).", "막히면 출력이 떨어지고 경고등이 켜지며 재생이 잦아 연비가 나빠집니다. 심하면 강제 재생이나 교환이 필요합니다."], ["SCR 촉매 (NOx 환원)", "SCR 촉매", "요소수에서 생긴 암모니아로 NOx를 질소와 물로 환원합니다.", "성능이 떨어지면 NOx가 늘어 경고등이 켜지고 출력이 제한됩니다."], ["요소수 탱크", "요소수 탱크", "약 32.5% 요소와 물을 섞은 요소수를 저장합니다.", "요소수가 부족하거나 품질이 나쁘면 경고등이 켜지고 시동이나 출력이 제한됩니다."], ["도징 인젝터", "도징 인젝터", "요소수를 SCR 앞쪽 배기관에 분사합니다.", "막히거나 결정이 생기면 분사량이 부족해 NOx 정화율이 떨어집니다."], ["EGTS", "배기가스 온도센서(EGTS)", "촉매와 DPF 앞뒤 온도를 재서 재생 시점과 열 손상을 감시합니다.", "불량이면 재생이 제대로 제어되지 않아 DPF가 손상되거나 경고등이 켜집니다."], ["차압 센서", "차압 센서", "DPF 앞뒤 압력 차이로 막힘 정도를 알아냅니다.", "불량이면 재생 시기를 잘못 판단해 경고등과 출력 제한이 생깁니다."]], "ecu-io": [["CKPS (크랭크각)", "크랭크각 센서(CKPS)", "크랭크축 회전수와 위치를 알려 분사·점화 시기의 기준이 됩니다.", "불량이면 시동이 안 걸리거나 주행 중 꺼지고 회전계가 움직이지 않습니다."], ["CMPS (캠각)", "캠각 센서(CMPS)", "캠축 위치로 1번 실린더의 압축 행정을 판별해 순차 분사·점화를 가능하게 합니다.", "불량이면 시동이 늦게 걸리거나 안 걸리고 출력이 떨어지며 림프홈에 들어갑니다."], ["WTS (수온)", "수온 센서(WTS)", "냉각수 온도를 알려 분사량·점화 시기와 냉각팬 제어에 반영합니다.", "불량이면 냉간 시동이 어렵고 연료가 과다·부족해지며 냉각팬이 이상 작동합니다."], ["AFS", "공기 유량 센서(AFS)", "흡입 공기량(질량)을 재서 기본 분사량을 정합니다.", "불량이면 공회전이 불안정하고 출력과 연비가 나빠지며 시동 후 꺼질 수 있습니다."], ["MAP (흡입공기)", "흡기 압력 센서(MAP)", "흡기 매니폴드의 절대압력으로 엔진 부하를 알려 줍니다.", "불량이면 가속이 나쁘고 연료가 과다·부족해지며 공회전이 불안정합니다."], ["APS 1·2 (가속페달)", "가속 페달 센서(APS 1·2)", "운전자의 가속 요구를 두 센서로 알려 줍니다.", "이상하면 경고등과 함께 출력이 제한됩니다."], ["TPS (스로틀)", "스로틀 위치 센서(TPS)", "스로틀 밸브 열림량을 알려 줍니다.", "불량이면 가속이 나쁘고 공회전이 불안정하며 변속 충격이 생깁니다."], ["산소(람다) 센서", "산소센서(람다)", "배기 산소 농도로 혼합비를 알려 피드백 제어에 씁니다.", "불량이면 연비가 나빠지고 배출가스가 늘며 공회전이 불안정하고 고장 코드가 저장됩니다."], ["인젝터", "인젝터", "ECU 신호로 연료를 분사합니다.", "막히거나 누설되면 실화·공회전 불안정·출력 저하·연료 과다가 생깁니다."], ["점화 코일", "점화 코일", "ECU의 점화 신호로 고전압을 만들어 점화 플러그에 보냅니다.", "불량이면 실화와 떨림이 생기고 출력과 연비가 떨어집니다."], ["EGR 액추에이터", "EGR 액추에이터", "ECU 신호로 EGR 밸브를 열어 배기가스를 흡기로 되돌립니다.", "열린 채 고착되면 공회전 불안정과 시동 꺼짐, 닫힌 채면 NOx 증가와 노킹이 생깁니다."], ["ETC 모터(스로틀)", "ETC 모터(스로틀)", "스로틀 밸브를 전동으로 열고 닫습니다.", "불량이면 가속이 늦고 출력이 제한됩니다."], ["PCSV", "PCSV", "캐니스터의 증발가스를 흡기로 보내는 양을 조절합니다.", "열린 채 고착되면 공회전이 불안정하고, 닫힌 채면 연료 냄새와 증발가스가 늘어납니다."], ["연료펌프 릴레이", "연료펌프 릴레이", "ECU 신호로 연료 펌프 전원을 연결합니다.", "불량이면 연료가 공급되지 않아 시동이 안 걸리거나 주행 중 꺼집니다."]], "heating-aqs": [["온수식", "온수식 난방", "엔진 냉각수의 열을 히터 코어로 보내 공기를 데웁니다.", "히터 코어가 막히거나 냉각수가 부족하면 난방이 약하고, 서모스탯이 불량이면 온도가 오르지 않습니다."], ["PTC 난방", "PTC 난방", "PTC 소자가 전기를 받아 열을 내 공기를 직접 가열합니다. 온도가 오르면 스스로 전류가 줄어 과열을 막습니다.", "소자나 릴레이가 불량이면 난방이 안 되고 전력 소모가 큽니다."], ["프리히터(가열플러그식)", "프리히터", "시동 직후 엔진이 데워지기 전에 가열해 실내 난방을 돕습니다.", "불량이면 겨울에 난방이 늦게 들어옵니다."], ["히트펌프", "히트펌프", "냉방 사이클을 거꾸로 돌려 실외의 열을 실내로 옮겨 난방합니다.", "냉매가 부족하거나 밸브가 불량이면 난방이 약합니다."], ["AQS (공기 질 센서)", "AQS(공기 질 센서)", "외기의 유해 가스를 감지해 내기 모드로 바꾸는 센서입니다(유해물질을 걸러 내는 장치가 아님).", "오염되거나 불량이면 내·외기 전환이 이상해져 악취가 들어오거나 환기가 안 됩니다."]], "hydraulic-eps": [["차속센서", "차속센서", "차속을 ECU에 알려 속도에 맞는 조향력을 정하게 합니다.", "불량이면 고속에서도 핸들이 가벼워지거나 조향력이 일정하지 않습니다."], ["ECU", "ECU", "차속을 읽어 솔레노이드를 제어해 조향력을 조절합니다.", "불량이면 조향이 항상 무겁거나 가벼워지고 경고등이 켜집니다."], ["솔레노이드", "솔레노이드 밸브", "ECU 신호로 유량·유압을 조절합니다.", "고착되면 핸들 무게가 변하지 않거나 소음이 납니다."], ["펌프", "오일 펌프", "엔진으로 구동해 유압을 만들어 기어박스로 보냅니다.", "오일이 부족하거나 벨트가 미끄러지면 핸들이 무겁고 소음이 납니다."], ["기어박스", "기어박스(랙·피니언)", "조향 입력을 직선 운동으로 바꿔 바퀴를 움직입니다.", "누유와 마모가 있으면 핸들이 헐겁고 소음이 납니다."], ["바이패스 밸브", "바이패스 밸브", "실린더 양쪽 유압을 서로 연결해 조향 보조력을 줄입니다. 속도가 오르면 개폐 면적을 넓혀 작용 압력을 줄입니다(실린더 바이패스 제어식).", "고착되면 고속에서 핸들이 가벼워지거나 보조력이 일정하지 않습니다."], ["반력 플런저", "반력 플런저", "차속에 따라 반력 유압을 걸어 핸들 무게(감각)를 조절합니다.", "불량이면 속도별 핸들 감각이 변하지 않거나 한쪽으로 쏠리는 느낌이 납니다."]], "injection-stages": [["예비 분사", "예비 분사", "주 분사 전에 소량을 분사해 연소 압력 상승을 완만하게 하고 소음을 줄입니다.", "불량이면 디젤 노킹(딱딱거리는 소리)과 진동이 커집니다."], ["주 분사", "주 분사", "엔진 출력을 만드는 주된 분사입니다.", "불량이면 출력이 떨어지고 연기가 나며 연비가 나빠집니다."], ["사후 분사", "사후 분사", "주 분사 뒤에 추가로 분사해 DPF 재생이나 LNT에 탄화수소를 공급합니다.", "과다하면 엔진오일에 연료가 섞이고, 불량이면 DPF 재생이 되지 않습니다."]], "lambda-egr": [["EGR 밸브", "EGR 밸브(액추에이터)", "배기가스 일부를 흡기로 되돌려 연소 온도를 낮춰 NOx를 줄입니다. 엔진 워밍업 후 작동합니다.", "열린 채 고착되면 공회전 불안정과 시동 꺼짐, 닫힌 채면 NOx 증가와 노킹이 생깁니다."]], "manifold-gauge": [["저압 서비스 포트", "저압 서비스 포트", "에어컨 저압 쪽(증발기~압축기 사이)에 게이지와 호스를 연결하는 포트입니다.", "누설되면 냉매가 새어 냉방이 약해지고, 캡이 없으면 이물질이 들어갑니다."], ["고압 서비스 포트", "고압 서비스 포트", "고압 쪽(압축기~팽창밸브 사이)에 연결합니다. 고압 쪽에는 액체 냉매를 충전하지 않습니다.", "누설되면 냉매가 부족해 냉방이 약해집니다."], ["진공 펌프", "진공 펌프", "냉매를 넣기 전에 계통의 공기와 수분을 빼냅니다.", "진공이 부족하면 수분이 남아 팽창밸브가 얼고 냉방이 안 됩니다."]], "mdps-types": [["C-MDPS (컬럼 구동식)", "C-MDPS(컬럼 구동식)", "모터가 스티어링 컬럼 축에 있어 컬럼을 돕습니다. 구조가 단순해 소형차에 씁니다.", "모터나 회전력(토크) 센서가 이상하면 핸들이 무거워지고 경고등이 켜집니다."], ["P-MDPS (피니언 구동식)", "P-MDPS(피니언 구동식)", "모터가 기어박스 피니언 축에 있어 피니언을 직접 돕습니다. 중형차에 씁니다.", "모터나 센서가 이상하면 핸들이 무거워지고 소음과 경고등이 나타납니다."], ["R-MDPS (랙 구동식)", "R-MDPS(랙 구동식)", "모터가 랙 축에 있어 랙을 직접 구동해 큰 조향력을 만듭니다. 대형차에 씁니다.", "모터나 벨트가 이상하면 핸들이 무겁고 소음이 나며 경고등이 켜집니다."]], "network-types": [["고속 CAN", "고속 CAN", "다중 마스터 방식으로 ID가 작은 쪽이 우선합니다. 파워트레인·안전 제어(에어백, VDC, 변속기)에 씁니다.", "단선이나 종단저항 이상이면 통신 오류 경고등이 켜지고 여러 시스템에 동시에 고장 코드가 뜹니다."], ["LIN", "LIN", "마스터 하나가 슬레이브들을 제어하는 저가·저속(약 20kbps) 1선 통신입니다. 윈도우·와이퍼 등 바디 전장에 씁니다.", "선에 이상이 있으면 해당 스위치와 모터가 작동하지 않습니다."], ["MOST", "MOST", "광섬유 링으로 수십 Mbit/s 멀티미디어를 전송합니다.", "광케이블이 꺾이거나 오염되면 오디오·내비 통신이 끊깁니다."]], "o2-sensor-types": [["지르코니아(ZrO", "지르코니아 형식", "산소 농도 차로 전압을 직접 만듭니다(기준 공기 필요). 농후하면 약 0.8V 이상, 희박하면 약 0.1V 이하입니다.", "신호가 느리거 function lbZoomBtn(d){

function lbClose(){ var o=lbEl(); if(!o) return; o.classList.remove('on'); o.classList.remove('deep'); if(window.lbDeepBtn) lbDeepBtn(); document.body.style.overflow=''; if(lb.from&&document.body.contains(lb.from)) lb.from.focus(); }
function lbBind(){
  var o=lbEl(), st=document.getElementById('lbs'), ptr={}, start=null, last=0, lx=0, ly=0, smp=[];
  var cnt=function(){ return Object.keys(ptr).length; };
  var dist=function(){ var k=Object.keys(ptr); return Math.hypot(ptr[k[0]].x-ptr[k[1]].x,ptr[k[0]].y-ptr[k[1]].y); };
  var mid=function(){ var k=Object.keys(ptr); return {x:(ptr[k[0]].x+ptr[k[1]].x)/2,y:(ptr[k[0]].y+ptr[k[1]].y)/2}; };
  st.addEventListener('pointerdown',function(e){
    st.setPointerCapture(e.pointerId); ptr[e.pointerId]={x:e.clientX,y:e.clientY}; smp=[]; if(GSOK) gsap.killTweensOf(lb);
    if(cnt()===2) start={d:dist(),z:lb.z,two:true};
    else start={x:e.clientX,y:e.clientY,ox:lb.x,oy:lb.y,t:Date.now(),moved:0,two:false};
  });
  st.addEventListener('pointermove',function(e){
    if(!ptr[e.pointerId]) return; ptr[e.pointerId]={x:e.clientX,y:e.clientY};
    if(cnt()===2&&start&&start.two){ var m=mid(); lbZoomAt(start.z*dist()/start.d,m.x,m.y); return; }
    if(cnt()===1&&start&&!start.two){ var dx=e.clientX-start.x, dy=e.clientY-start.y; start.moved=Math.max(start.moved,Math.hypot(dx,dy)); if(lb.z>1){ lb.x=start.ox+dx; lb.y=start.oy+dy; lbApply(); smp.push({t:e.timeStamp,x:e.clientX,y:e.clientY}); while(smp.length>2&&e.timeStamp-smp[0].t>100) smp.shift(); } }
  });
  var up=function(e){
    if(!ptr[e.pointerId]) return; var wasTwo=start&&start.two; delete ptr[e.pointerId];
    if(wasTwo){ start=null; return; }
    if(!start) return;
    var dx=e.clientX-start.x, dy=e.clientY-start.y, dur=Date.now()-start.t, s=start; start=null;
    if(s.moved<8&&dur<300){ var now=Date.now(); if(now-last<320&&Math.hypot(e.clientX-lx,e.clientY-ly)<40){ if(lb.z>1){ lb.z=1; lbApply(); } else lbZoomAt(2.5,e.clientX,e.clientY); last=0; } else { last=now; lx=e.clientX; ly=e.clientY; } return; }
    if(lb.z===1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5) lbSet(dx<0?1:-1);
    else if(GSOK&&lb.z>1&&s.moved>=8&&smp.length>1){
      var a=smp[0], b=smp[smp.length-1], dt=(b.t-a.t)/1000;
      if(dt>0.005&&e.timeStamp-b.t<80){
        var im=document.getElementById('lbi'), mx=im.clientWidth*(lb.z-1)/2+40, my=im.clientHeight*(lb.z-1)/2+40;
        gsap.to(lb,{inertia:{x:{velocity:(b.x-a.x)/dt,min:-mx,max:mx},y:{velocity:(b.y-a.y)/dt,min:-my,max:my}},onUpdate:lbApply});
      }
    }
  };
  st.addEventListener('pointerup',up); st.addEventListener('pointercancel',function(e){ delete ptr[e.pointerId]; start=null; });
  st.addEventListener('wheel',function(e){ e.preventDefault(); lbZoomAt(lb.z*Math.exp(-e.deltaY*0.0018),e.clientX,e.clientY); },{passive:false});
  o.addEventListener('click',function(e){
    var n=e.target.closest('[data-lbn]'); if(n){ lbSet(+n.getAttribute('data-lbn')); return; }
    var z=e.target.closest('[data-lbz]'); if(z){ lbZoomBtn(+z.getAttribute('data-lbz')); return; }
    if(e.target.closest('[data-lbf]')){ gfToggle(lbCur()); lbFav(); galRefresh(); return; }
    if(e.target.closest('[data-lbc]')||e.target===o) lbClose();
  });
}

  else if(e.key==='+'||e.key==='=') lbZoomBtn(1); else if(e.key==='-') lbZoomBtn(-1); else if(e.key==='0') lbZoomBtn(0);

   ['DOHC',/DOHC/],['VTEC',/VTEC/],['모노코크',/모노코크/],['더블 위시본',/더블 위시본|위시본/],['맥퍼슨 스트럿',/맥퍼슨/],['서스펜션',/서스펜션/],['디퍼렌셜',/디퍼렌셜/],
   ['사륜구동',/사륜구동|4WD/],['FR · FF · MR',/미드십|\b(?:MR|FR|FF)\b/],['변속기',/변속기/],['시퀀셜 변속기',/시퀀셜/],['클러치',/클러치/],['다운포스',/다운포스/],['디퓨저',/디퓨저/],
   ['윙',/(?:프런트|프론트|리어|빔)\s?윙/],['스로틀',/스로틀/],['라디에이터',/라디에이터/],['과급',/과급/],['카본',/카본|탄소섬유/],['타이어',/타이어/],['롤링',/롤링/],['브레이크',/브레이크/],
   ['HICAS',/HICAS/],['ATTESA E-TS',/ATTESA/]
  ];
  ABBR.forEach(function(x){ if(/^[A-Z]{3,5}$/.test(x[0])&&!L.some(function(y){ return y[0]===x[0]; })&&x[0]!=='DOHC') L.push([x[0],new RegExp('\\b'+x[0]+'\\b')]); });
  return TM=L;
}
/* 마크다운 일부(굵게·코드·링크)를 안전한 HTML로 바꾸고 정비 용어를 사전에 연결 */
function dgRender(text,used){
  var holds=[];
  var t=String(text).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,function(_,a,u){ holds.push('<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(a)+'</a>'); return '\u0001'+(holds.length-1)+'\u0001'; });
  t=esc(t);
  termMap().forEach(function(p){
    if(used[p[0]]) return;
    var m=p[1].exec(t); if(!m) return;
    used[p[0]]=1;
    t=t.slice(0,m.index)+'<button class="gterm" type="button" data-gt="'+esc(p[0])+'">'+m[0]+'</button>'+t.slice(m.index+m[0].length);
  });
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  return t.replace(/\u0001(\d+)\u0001/g,function(_,i){ return holds[+i]; });
}
function dgDeepHTML(i){
  var e=DGM[i], used={};
  return '<h4>식별 모델 · 테마</h4><p>'+dgRender(e[0],used)+'</p><h4>코드네임 · 메커니즘 분석</h4><p>'+dgRender(e[1],used)+'</p><h4>차덕후 관전 포인트</h4><p>'+dgRender(e[2],used)+'</p>';
}
function lbDeepSet(){
  var box=document.getElementById('lbdp'), b=document.querySelector('[data-lbd]'); if(!box||!b) return;
  if(!DGM){ b.hidden=true; box.innerHTML=''; return; }
  b.hidden=false; box.innerHTML=dgDeepHTML(lbCur());
}
function lbDeepToggle(){
  var o=lbEl(); if(!o) return;
  if(!DGM){ dogamLoad().then(function(){ lbDeepSet(); o.classList.add('deep'); lb.z=1; lb.x=0; lb.y=0; lbApply(); lbDeepBtn(); }); return; }
  o.classList.toggle('deep'); lb.z=1; lb.x=0; lb.y=0; lbApply(); lbDeepBtn();
  if(o.classList.contains('deep')){ var c=o.querySelector('.lbx-cap'); if(c) c.scrollTop=0; }
}
function lbDeepBtn(){ var o=lbEl(), b=document.querySelector('[data-lbd]'); if(!o||!b) return; var on=o.classList.contains('deep'); b.setAttribute('aria-expanded',String(on)); b.textContent=on?'접기':'더 깊이 보기'; }
document.addEventListener('click',function(e){
  var d=e.target.closest('[data-lbd]'); if(d){ lbDeepToggle(); return; }
  var g=e.target.closest('[data-gt]'); if(g){
    var t=g.getAttribute('data-gt'); lbClose(); S.glq=t; S.glcat='all'; S.view='gloss'; S.reset=false; render(); window.scrollTo(0,0); return;
  }
  var gp=e.target.closest('[data-gphotos]'); if(gp){
    var list=dgTermPhotos(gp.getAttribute('data-gphotos')); if(list.length) lbOpen(0,gp,list); return;
  }
  var mc=e.target.closest('[data-mc]'); if(mc){ var m=MODELS[+mc.getAttribute('data-mc')]; lbOpen(0,mc,m.i.slice()); }
});
function dgTermPhotos(title){
  if(!DGM) return [];
  var p=termMap().filter(function(x){ return x[0]===title; })[0]; if(!p) return [];
  var out=[]; DGM.forEach(function(e,i){ if(p[1].test(e.join(' '))) out.push(i); });
  return out;
}

    h+='<details class="more"><summary>사양 보기</summary><dl><dt>섀시</dt><dd>'+esc(m.c)+'</dd><dt>구동·메커니즘</dt><dd>'+esc(m.d)+'</dd><dt>도색·무대</dt><dd>'+esc(m.l)+'</dd></dl></details></article>';
  });
  return h+'</div></section>';
}
