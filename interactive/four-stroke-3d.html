<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><script>try{var __t=localStorage.getItem("jeongbi-theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>4행정 엔진 3D</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f4f4f1;--panel:#e9e9e4;--text:#1b1d1c;--muted:#5d625f;--accent:#1b6e66;--line:#cfcfc8;--ease:cubic-bezier(0.23,1,0.32,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--panel:#1c1f1d;--text:#ecefed;--muted:#9aa19d;--accent:#5fc3b8;--line:#2f3532}}
:root[data-theme="dark"]{--bg:#121413;--panel:#1c1f1d;--text:#ecefed;--muted:#9aa19d;--accent:#5fc3b8;--line:#2f3532}
:root[data-theme="light"]{--bg:#f4f4f1;--panel:#e9e9e4;--text:#1b1d1c;--muted:#5d625f;--accent:#1b6e66;--line:#cfcfc8}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:960px;margin:0 auto}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
a.back{color:var(--accent);text-decoration:none;font-size:14px;min-height:40px;display:inline-flex;align-items:center}
.stage{position:relative;background:var(--panel);border-radius:20px;overflow:hidden;height:min(62vh,560px);min-height:340px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hud{position:absolute;left:14px;top:12px;right:14px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.badge{background:var(--bg);border-radius:14px;padding:8px 14px;min-width:0}
.badge b{display:block;font-size:20px;line-height:1.3}
.badge span{font-size:13px;color:var(--muted)}
.state{display:flex;flex-direction:column;gap:2px;text-align:right;font-size:13px;color:var(--muted)}
.state i{font-style:normal;color:var(--text);font-weight:600}
.state i.on{color:var(--accent)}
.hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.bar{position:absolute;right:14px;bottom:12px;width:120px;pointer-events:none}
.bar small{display:block;font-size:12px;color:var(--muted);text-align:right;margin-bottom:3px}
.bar div{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px}
.ctl{display:grid;gap:12px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;cursor:pointer;touch-action:manipulation;transition:transform .14s var(--ease),background-color .14s var(--ease)}
button:active{transform:scale(.97)}
button.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:1px}
@media (hover:hover) and (pointer:fine){button:hover{background:var(--line)}button.pri:hover{background:var(--text);opacity:.88}}
input[type=range]{width:100%;min-height:44px;accent-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
p.note{font-size:14px;color:var(--muted);margin:14px 0 0}
.fallback{display:none;padding:40px 20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>4행정 엔진 · 3D 단면</h1><a class="back" href="../index.html">‹ 공부 사이트</a></header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="4행정 가솔린 엔진 3D 모형. 드래그하면 돌려 볼 수 있고, 두 손가락이나 휠로 확대한다."></canvas>
    <div class="hud">
      <div class="badge"><b id="stroke">흡입 행정</b><span id="angle">크랭크 0° · 캠축 0°</span></div>
      <div class="state"><div>흡기밸브 <i id="vin">열림</i></div><div>배기밸브 <i id="vex">닫힘</i></div><div>점화 <i id="vsp">—</i></div></div>
    </div>
    <div class="hint">드래그: 돌려 보기 · 휠/핀치: 확대</div>
    <div class="bar"><small>실린더 압력(모형)</small><div><i id="p"></i></div></div>
    <div class="fallback" id="fb">이 기기에서는 3D를 표시할 수 없습니다.</div>
  </div>
  <div class="ctl">
    <input type="range" id="slider" min="0" max="719" step="1" value="0" aria-label="크랭크 각도 0도에서 720도">
    <div class="row">
      <button class="pri" id="play" aria-pressed="false">일시정지</button>
      <select id="speed" aria-label="재생 속도"><option value="30">느리게</option><option value="80" selected>보통</option><option value="200">빠르게</option></select>
      <button data-a="90">흡입</button><button data-a="270">압축</button><button data-a="450">폭발</button><button data-a="630">배기</button>
    </div>
    <div class="legend"><span style="--c:#5aa0e6">신선한 혼합기</span><span style="--c:#8fb8e8">압축된 혼합기</span><span style="--c:#f08a3c">연소 가스</span><span style="--c:#8a8f8c">배기가스</span></div>
  </div>
  <p class="note">크랭크축 2회전(720°)에 캠축이 1회전하고, 한 사이클에 폭발은 한 번 일어난다. 압력과 밸브 시기는 이해를 돕기 위한 단순 모형 값이다.</p>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const stage = $("stage"), canvas = $("c");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { canvas.style.display = "none"; $("fb").style.display = "block"; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
camera.position.set(9.5, 6.2, 18.5);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 4.0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 30; controls.maxPolarAngle = Math.PI * 0.62;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f8c, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 10, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(-8, 4, -6); scene.add(rim);

// ---- geometry constants (stroke 2, bore 3.2, rod 3.6)
const R = 1, L = 3.6, BORE = 1.6, HEAD_Y = 5.45, PIN_TO_TOP = 0.5;
const metal = (c, r = 0.45, m = 0.7) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const steel = metal(0xb9bec2), dark = metal(0x5c6266, 0.5, 0.6), alu = metal(0xd9dcdf, 0.4, 0.8);
const glass = new THREE.MeshStandardMaterial({ color: 0x9aa7ad, roughness: 0.3, metalness: 0.2, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false });
const mesh = (g, m, p = [0, 0, 0]) => { const o = new THREE.Mesh(g, m); o.position.set(...p); return o; };
const root = new THREE.Group(); scene.add(root);

// block: back half of the liner and a lower crankcase floor, so the inside can be seen
const liner = mesh(new THREE.CylinderGeometry(BORE + 0.12, BORE + 0.12, HEAD_Y - 1.1, 48, 1, true, Math.PI, Math.PI), glass, [0, (HEAD_Y + 1.1) / 2, 0]);
root.add(liner);
const linerBack = mesh(new THREE.CylinderGeometry(BORE + 0.3, BORE + 0.3, HEAD_Y - 1.1, 48, 1, true, Math.PI * 1.05, Math.PI * 0.9), metal(0x7d858a, 0.6, 0.5), [0, (HEAD_Y + 1.1) / 2, -0.05]);
linerBack.material.side = THREE.DoubleSide; root.add(linerBack);
const head = mesh(new THREE.BoxGeometry(BORE * 2 + 0.7, 0.6, BORE * 2 + 0.3), metal(0x8f979c, 0.55, 0.5), [0, HEAD_Y + 0.3, 0]); root.add(head);
// ports
const intakePipe = mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.9, 28), metal(0x5aa0e6, 0.4, 0.3), [-2.75, HEAD_Y + 0.3, 0]); intakePipe.rotation.z = Math.PI / 2; root.add(intakePipe);
const exhaustPipe = mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.9, 28), metal(0x7b7f7c, 0.5, 0.5), [2.75, HEAD_Y + 0.3, 0]); exhaustPipe.rotation.z = Math.PI / 2; root.add(exhaustPipe);
// spark plug
const plug = new THREE.Group(); plug.position.set(0, HEAD_Y + 0.6, 0);
plug.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.1, 16), alu, [0, 0.55, 0]), mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 6), steel, [0, 0.1, 0]));
const plugTip = mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshBasicMaterial({ color: 0x777777 }), [0, -0.32, 0]);
plug.add(plugTip); root.add(plug);

// chamber gas
const gasMat = new THREE.MeshStandardMaterial({ color: 0x5aa0e6, transparent: true, opacity: 0.45, roughness: 0.2, depthWrite: false, emissive: 0x000000 });
const gas = mesh(new THREE.CylinderGeometry(BORE - 0.02, BORE - 0.02, 1, 40), gasMat); root.add(gas);

// piston
const piston = new THREE.Group(); root.add(piston);
piston.add(mesh(new THREE.CylinderGeometry(BORE - 0.05, BORE - 0.05, 1.4, 40), alu, [0, -0.7, 0]));
for (const y of [-0.18, -0.34, -0.5]) piston.add(mesh(new THREE.TorusGeometry(BORE - 0.05, 0.035, 8, 48), dark, [0, y, 0]).rotateX(Math.PI / 2));
piston.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, BORE * 2 - 0.4, 20), steel, [0, -PIN_TO_TOP, 0]).rotateZ(0).rotateX(Math.PI / 2));
const rod = mesh(new THREE.BoxGeometry(0.34, L, 0.5), steel); root.add(rod);
const rodSmall = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.55, 24), steel); rodSmall.rotation.x = Math.PI / 2; root.add(rodSmall);
const rodBig = mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.55, 28), steel); rodBig.rotation.x = Math.PI / 2; root.add(rodBig);

// crank (rotates about z)
const crank = new THREE.Group(); root.add(crank);
const web = (z) => { const g = new THREE.Group(); g.position.z = z;
  g.add(mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.3, 36), dark).rotateX(Math.PI / 2));
  const lobe = new THREE.Shape(); lobe.absarc(0, 0, 0.62, 0, Math.PI * 2);
  const cw = mesh(new THREE.CylinderGeometry(1.55, 1.55, 0.3, 40, 1, false, 0, Math.PI), metal(0x484e52, 0.55, 0.5));
  cw.rotation.set(Math.PI / 2, 0, 0); cw.rotateZ(0); cw.rotation.z = Math.PI / 2 + Math.PI; cw.rotation.order = "XYZ";
  g.add(cw); return g; };
const w1 = web(0.45), w2 = web(-0.45); crank.add(w1, w2);
crank.add(mesh(new THREE.CylinderGeometry(0.34, 0.34, 1.0, 24), steel, [0, R, 0]).rotateX(Math.PI / 2));
crank.add(mesh(new THREE.CylinderGeometry(0.4, 0.4, 3.6, 28), steel).rotateX(Math.PI / 2));
// crank-axis marker so rotation reads
crank.add(mesh(new THREE.BoxGeometry(0.1, 0.5, 0.06), new THREE.MeshBasicMaterial({ color: 0xf08a3c }), [0, -0.2, 0.62]));

// valves
function valve(x) {
  const g = new THREE.Group(); g.position.set(x, HEAD_Y, 0);
  g.add(mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.2, 12), steel, [0, 1.15, 0]));
  g.add(mesh(new THREE.CylinderGeometry(0.46, 0.34, 0.12, 28), steel, [0, 0, 0]));
  const spring = new THREE.Group(); spring.position.y = 0.55;
  const pts = []; for (let i = 0; i <= 90; i++) { const t = i / 90, a = t * Math.PI * 2 * 7; pts.push(new THREE.Vector3(Math.cos(a) * 0.24, t * 0.9, Math.sin(a) * 0.24)); }
  spring.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 140, 0.028, 6), metal(0xd68a2c, 0.4, 0.6)));
  g.add(spring); g.userData.spring = spring;
  g.add(mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.08, 20), dark, [0, 1.5, 0]));
  root.add(g); return g;
}
const vIn = valve(-0.78), vEx = valve(0.78);
// cams
function cam(x) {
  const g = new THREE.Group(); g.position.set(x, HEAD_Y + 2.9, 0);
  const c = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 40), dark).rotateX(Math.PI / 2); c.scale.set(1, 1, 1);
  const nose = mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.5, 20), dark, [0, -0.5, 0]).rotateX(Math.PI / 2);
  const body = mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.5, 40), dark).rotateX(Math.PI / 2);
  const lobeShape = new THREE.Shape(); lobeShape.moveTo(-0.42, 0); lobeShape.lineTo(0, -0.62); lobeShape.lineTo(0.42, 0); lobeShape.absarc(0, 0, 0.42, 0, Math.PI, false);
  const lobe = mesh(new THREE.ExtrudeGeometry(lobeShape, { depth: 0.5, bevelEnabled: false }), dark, [0, 0, -0.25]);
  g.add(body, lobe); root.add(g); return g;
}
const camIn = cam(-0.78), camEx = cam(0.78);
const camShaft = (x) => root.add(mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.2, 14), steel, [x, HEAD_Y + 2.9, 0]).rotateX(Math.PI / 2));
camShaft(-0.78); camShaft(0.78);

// ---- model
const rad = Math.PI / 180;
const bump = (t, a, b) => { if (t < a || t > b) return 0; const u = (t - a) / (b - a); return Math.sin(Math.PI * u) ** 1.6; };
const lerp = (a, b, k) => a + (b - a) * k;
function model(th) {
  const stroke = th < 180 ? 0 : th < 360 ? 1 : th < 540 ? 2 : 3;
  const liftIn = bump(th, 0, 200) * 0.45;
  const liftEx = Math.max(bump(th, 520, 720), 0) * 0.45;
  const spark = th > 352 && th < 372;
  const s = Math.sin(th * rad), c = Math.cos(th * rad);
  const yPin = R * c + Math.sqrt(L * L - R * R * s * s);
  const yTop = yPin + PIN_TO_TOP;
  const V = Math.max(0.02, HEAD_Y - yTop);
  const Vmax = HEAD_Y - (L - R + PIN_TO_TOP), Vmin = HEAD_Y - (L + R + PIN_TO_TOP);
  let p;
  const comp = (V0, p0, v) => p0 * Math.pow(V0 / v, 1.32);
  if (th < 180) p = 0.18;
  else if (th < 360) p = comp(Vmax, 0.18, V);
  else if (th < 540) { const pPk = comp(Vmax, 0.18, Vmin + 0.05) * 3.1; p = th < 372 ? comp(Vmax, 0.18, V) : pPk * Math.pow((Vmin + 0.05) / V, 1.32) * (th < 380 ? (th - 372) / 8 * 0.6 + 0.4 : 1); }
  else p = 0.24;
  const pn = Math.min(1, p / 7.2);
  return { stroke, liftIn, liftEx, spark, s, c, yPin, yTop, V, pn };
}
const gasColors = [new THREE.Color(0x5aa0e6), new THREE.Color(0x8fb8e8), new THREE.Color(0xf08a3c), new THREE.Color(0x8a8f8c)];
const names = ["흡입 행정", "압축 행정", "폭발(동력) 행정", "배기 행정"];
const tmp = new THREE.Color();
const memo = {};
const setT = (id, v, cls) => { const k = id + (cls || ""); if (memo[k] === v + (cls || "")) return; memo[k] = v + (cls || ""); const e = $(id); e.textContent = v; if (cls !== undefined) e.className = cls; };
function apply(th) {
  const m = model(th);
  piston.position.y = m.yTop;
  const crankPin = new THREE.Vector3(R * m.s, R * m.c, 0);
  const pinP = new THREE.Vector3(0, m.yPin, 0);
  crank.rotation.z = -th * rad;
  rod.position.copy(crankPin).add(pinP).multiplyScalar(0.5);
  const d = pinP.clone().sub(crankPin);
  rod.rotation.z = Math.atan2(-d.x, d.y);
  rodSmall.position.copy(pinP); rodBig.position.copy(crankPin);
  gas.position.y = (m.yTop + HEAD_Y) / 2; gas.scale.y = m.V;
  let col = gasColors[m.stroke].clone();
  if (m.stroke === 1) col.lerp(gasColors[0], 1 - (th - 180) / 180);
  if (m.stroke === 2) col.lerp(gasColors[3], Math.max(0, (th - 440) / 100));
  if (m.stroke === 3) col.copy(gasColors[3]);
  gasMat.color.copy(col);
  gasMat.opacity = m.stroke === 2 ? 0.55 + 0.25 * m.pn : 0.4;
  gasMat.emissive.copy(m.stroke === 2 ? new THREE.Color(0xf08a3c).multiplyScalar(Math.max(0, 1 - (th - 360) / 170) * 0.55) : tmp.set(0x000000));
  vIn.position.y = HEAD_Y - m.liftIn; vEx.position.y = HEAD_Y - m.liftEx;
  vIn.userData.spring.scale.y = 1 - m.liftIn * 0.45; vEx.userData.spring.scale.y = 1 - m.liftEx * 0.45;
  camIn.rotation.z = (th - 100) * 0.5 * rad;
  camEx.rotation.z = (th - 620) * 0.5 * rad;
  plugTip.material.color.set(m.spark ? 0xfff2a8 : 0x777777);
  plugTip.scale.setScalar(m.spark ? 2.2 : 1);
  setT("stroke", names[m.stroke]);
  setT("angle", "크랭크 " + Math.round(th) + "° · 캠축 " + Math.round(th / 2) + "°");
  const vin = $("vin"), vex = $("vex"), vsp = $("vsp");
  const oi = m.liftIn > 0.02, oe = m.liftEx > 0.02;
  setT("vin", oi ? "열림" : "닫힘", oi ? "on" : "");
  setT("vex", oe ? "열림" : "닫힘", oe ? "on" : "");
  setT("vsp", m.spark ? "스파크" : "—", m.spark ? "on" : "");
  $("p").style.width = (m.pn * 100).toFixed(0) + "%";
  const sv = String(Math.floor(th) % 720); if (slider.value !== sv) slider.value = sv;
  slider.setAttribute("aria-valuetext", names[m.stroke] + ", 크랭크 " + Math.round(th) + "도");
}

// ---- controls
const slider = $("slider"), play = $("play"), speed = $("speed");
const still = matchMedia("(prefers-reduced-motion: reduce)");
let th = 20, playing = !still.matches, last = 0;
const setPlay = (v) => { playing = v; play.textContent = v ? "일시정지" : "재생"; play.setAttribute("aria-pressed", String(!v)); };
setPlay(playing);
play.addEventListener("click", () => setPlay(!playing));
slider.addEventListener("input", () => { th = +slider.value; setPlay(false); apply(th); });
document.querySelectorAll("button[data-a]").forEach((b) => b.addEventListener("click", () => { th = +b.dataset.a; setPlay(false); apply(th); }));
addEventListener("keydown", (e) => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); setPlay(!playing); } });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.position.z = camera.position.z; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
let visible = true;
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; }, { rootMargin: "80px" }).observe(stage);
function frame(now) {
  requestAnimationFrame(frame);
  if (!visible) { last = now; return; }
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0; last = now;
  if (playing) { th = (th + dt * +speed.value) % 720; apply(th); }
  controls.update();
  renderer.render(scene, camera);
}
apply(th);
requestAnimationFrame(frame);
</script>
</body>
</html>
