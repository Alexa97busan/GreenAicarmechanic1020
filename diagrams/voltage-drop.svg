="#f6e7a6"/><path d="M488,134 q7,-14 14,0" fill="none" stroke="#c98a2a" stroke-width="2"/><rect class="o" x="486" y="144" width="18" height="10" rx="2" fill="#9ea3a7"/><path d="M320,146V160" fill="none" stroke="#222" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M320,146V160" fill="none" stroke="#c1121f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M352,146V160" fill="none" stroke="#222" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M352,146V160" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect class="o" x="300" y="160" width="70" height="40" rx="8" fill="#f2c94c"/><rect x="308" y="168" width="54" height="22" rx="3" fill="#cfe0c8" stroke="#555"/><rect class="o" x="20" y="268" width="338" height="86" rx="10" fill="#e8f0d8"/><rect class="o" x="370" y="268" width="330" height="86" rx="10" fill="#f4dede"/><text class="t" x="18" y="30">커넥터 접촉저항과 전압강하</text><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">전압강하(접촉저항) 점검</text><text class="n" x="62" y="170" text-anchor="end" style="font-weight:700">12V</text><text class="n" x="206" y="112" text-anchor="middle" >스위치</text><text class="n" x="336" y="112" text-anchor="middle" style="font-weight:700">커넥터</text><text class="n" x="495" y="112" text-anchor="middle" >부하</text><text x="336" y="184" text-anchor="middle" style="font-weight:700;fill:#c1121f">0.2 V</text><text class="n" x="392" y="184" text-anchor="start" >← 전압계로 커넥터 양단을 측정</text><text x="36" y="288" text-anchor="start" style="font-weight:700">정상 기준</text><text x="36" y="308" text-anchor="start" >커넥터 접촉저항에 의한 선간전압</text><text x="36" y="328" text-anchor="start" >허용 범위 = 0.2 V 이하</text><text x="386" y="288" text-anchor="start" style="font-weight:700">틀린 설명 (옳지 않은 것)</text><text x="386" y="308" text-anchor="start" >“저항측정기로는 불필요한 저항을</text><text x="386" y="328" text-anchor="start" > 검출할 수 없다”  → 틀림</text><text class="n" x="18" y="380">통전(부하 작동) 중 불필요한 접촉저항은 전압강하로 점검하고, 전원을 끄면 저항측정기로도 측정할 수 있다.</text><text class="n" x="18" y="398">전압강하가 기준(0.2 V)보다 크면 커넥터·터미널의 접촉 불량을 의심한다.</text></svg>