<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="스위치와 커넥터가 있는 회로에서 커넥터 양단 전압강하 0.2볼트 이하 점검"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">커넥터 접촉저항과 전압강하</text><rect x="20" y="50" width="680" height="200" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">전압강하(접촉저항) 점검</text><path d="M70,146V174" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M80,152V168" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text class="n" x="62" y="164" text-anchor="end" style="font-weight:700">12V</text><path d="M80,160H100V110H180" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="180" y="96" width="50" height="28" fill="#e6e4da" rx="3"/><text class="n" x="205" y="114" text-anchor="middle" >스위치</text><path d="M230,110H300" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="300" y="96" width="70" height="28" fill="#f3dcc3" rx="3"/><text class="n" x="335" y="114" text-anchor="middle" style="font-weight:700">커넥터</text><path d="M370,110H460" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="460" y="96" width="70" height="28" fill="#d4e4f1" rx="3"/><text class="n" x="495" y="114" text-anchor="middle" >부하</text><path d="M530,110H570V190H100V160" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="296" y="148" width="78" height="34" fill="#fff" rx="17"/><text x="335" y="170" text-anchor="middle" style="font-weight:700;fill:#c1121f">0.2 V</text><path d="M310,148V124M360,148V124" fill="none" stroke="#c1121f" stroke-width="1.5" stroke-linejoin="round"/><text class="n" x="420" y="170" text-anchor="start" >← 전압계로 커넥터 양단을 측정</text><rect class="o" x="20" y="266" width="330" height="90" fill="#e8f0d8" rx="8"/><text x="36" y="288" text-anchor="start" style="font-weight:700">정상 기준</text><text x="36" y="308" text-anchor="start" >커넥터 접촉저항에 의한 선간전압</text><text x="36" y="328" text-anchor="start" >허용 범위 = 0.2 V 이하</text><rect class="o" x="370" y="266" width="330" height="90" fill="#f4e1dd" rx="8"/><text x="386" y="288" text-anchor="start" style="font-weight:700">틀린 설명 (옳지 않은 것)</text><text x="386" y="308" text-anchor="start" >“저항측정기로는 불필요한 저항을</text><text x="386" y="328" text-anchor="start" > 검출할 수 없다”  → 틀림</text><text class="n" x="18" y="380">통전(부하 작동) 중 불필요한 접촉저항은 전압강하로 점검하고, 전원을 끄면 저항측정기로도 측정할 수 있다.</text><text class="n" x="18" y="398">전압강하가 기준(0.2 V)보다 크면 커넥터·터미널의 접촉 불량을 의심한다.</text></svg>