rx="10" fill="url(#mat_gl)" pointer-events="none"/><rect x="372.0" y="271.0" width="330.0" height="86.0" rx="10" fill="#000" opacity=".09"/><rect class="o" x="370" y="268" width="330" height="86" rx="10" fill="url(#mat_f4dedem)"/><rect x="370.0" y="268.0" width="330.0" height="86.0" rx="10" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="371.5" y="269.5" width="327.0" height="26" rx="10" fill="url(#mat_gl)" pointer-events="none"/><text class="t" x="18" y="30">커넥터 접촉저항과 전압강하</text><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">전압강하(접촉저항) 점검</text><text class="n" x="62" y="170" text-anchor="end" style="font-weight:700">12V</text><text class="n" x="206" y="112" text-anchor="middle" >스위치</text><text class="n" x="336" y="112" text-anchor="middle" style="font-weight:700">커넥터</text><text class="n" x="495" y="112" text-anchor="middle" >부하</text><text x="336" y="184" text-anchor="middle" style="font-weight:700;fill:#c1121f">0.2 V</text><text class="n" x="392" y="184" text-anchor="start" >← 전압계로 커넥터 양단을 측정</text><text x="36" y="288" text-anchor="start" style="font-weight:700">정상 기준</text><text x="36" y="308" text-anchor="start" >커넥터 접촉저항에 의한 선간전압</text><text x="36" y="328" text-anchor="start" >허용 범위 = 0.2 V 이하</text><text x="386" y="288" text-anchor="start" style="font-weight:700">틀린 설명 (옳지 않은 것)</text><text x="386" y="308" text-anchor="start" >“저항측정기로는 불필요한 저항을</text><text x="386" y="328" text-anchor="start" > 검출할 수 없다”  → 틀림</text><text class="n" x="18" y="380">통전(부하 작동) 중 불필요한 접촉저항은 전압강하로 점검하고, 전원을 끄면 저항측정기로도 측정할 수 있다.</text><text class="n" x="18" y="398">전압강하가 기준(0.2 V)보다 크면 커넥터·터미널의 접촉 불량을 의심한다.</text></svg>