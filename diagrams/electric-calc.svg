<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="직렬 저항, 릴레이 코일 저항, 키르히호프 제1법칙, 병렬 직렬 전압강하 예제"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="540" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">전기 계산 문제 정리 (옴의 법칙·키르히호프)</text><rect x="20" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185" y="70" text-anchor="middle" style="font-weight:700">직렬 합성저항과 전류</text><rect x="370" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535" y="70" text-anchor="middle" style="font-weight:700">릴레이 코일 저항 (85-86)</text><rect x="20" y="240" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185" y="260" text-anchor="middle" style="font-weight:700">키르히호프 제1법칙</text><rect x="370" y="240" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535" y="260" text-anchor="middle" style="font-weight:700">병렬+직렬 전압강하</text><path d="M60,180V100H90M150,100H160M220,100H230M290,100H310V180H60" fill="none" stroke="#222" stroke-width="1.6"/><path d="M90,100L98,100L101.7,107L109.0,93L116.3,107L123.7,93L131.0,107L138.3,93L142,100L150,100" fill="none" stroke="#222" stroke-width="1.6"/><path d="M160,100L168,100L171.7,107L179.0,93L186.3,107L193.7,93L201.0,107L208.3,93L212,100L220,100" fill="none" stroke="#222" stroke-width="1.6"/><path d="M230,100L238,100L241.7,107L249.0,93L256.3,107L263.7,93L271.0,107L278.3,93L282,100L290,100" fill="none" stroke="#222" stroke-width="1.6"/><path d="M52,128H68" stroke="#222" stroke-width="3"/><path d="M56,136H64" stroke="#222" stroke-width="3"/><path d="M52,144H68" stroke="#222" stroke-width="3"/><path d="M56,152H64" stroke="#222" stroke-width="3"/><text class="n" x="74" y="144" text-anchor="start" >12V</text><text class="n" x="120" y="88" text-anchor="middle" >4Ω</text><text class="n" x="190" y="88" text-anchor="middle" >8Ω</text><text class="n" x="260" y="88" text-anchor="middle" >12Ω</text><text x="185" y="202" text-anchor="middle" style="font-weight:700;fill:#e07a1f">R = 4+8+12 = 24Ω,  I = 12÷24 = 0.5A</text><rect class="o" x="490" y="100" width="90" height="50" fill="#fff" rx="3"/><text x="535" y="130" text-anchor="middle" >코일</text><path d="M490,125H430V175M580,125H640V175" fill="none" stroke="#222" stroke-width="1.6"/><text class="n" x="482" y="120" text-anchor="end" >85</text><text class="n" x="588" y="120" text-anchor="start" >86</text><path d="M527,178H543" stroke="#222" stroke-width="3"/><path d="M531,186H539" stroke="#222" stroke-width="3"/><path d="M527,194H543" stroke="#222" stroke-width="3"/><path d="M531,202H539" stroke="#222" stroke-width="3"/><path d="M430,175H520" stroke="#222" stroke-width="1.6"/><path d="M550,175H640" stroke="#222" stroke-width="1.6"/><text class="n" x="558" y="196" text-anchor="start" >12V</text><text class="n" x="605" y="96" text-anchor="start" >I = 0.125A</text><text x="535" y="212" text-anchor="middle" style="font-weight:700;fill:#e07a1f">R = V÷I = 12÷0.125 = 96Ω</text><circle cx="185" cy="330" r="6" fill="#222"/><path d="M100,351L174,333" stroke="#1d4e89" stroke-width="2.4" marker-end="url(#a)"/><text class="n" x="90.42766412926824" y="346.5212085995401" text-anchor="end" >1A 유입</text><path d="M100,309L174,327" stroke="#1d4e89" stroke-width="2.4" marker-end="url(#a)"/><text class="n" x="90.42766412926825" y="305.47879140045984" text-anchor="end" >3A 유입</text><path d="M140,278L179,323" stroke="#1d4e89" stroke-width="2.4" marker-end="url(#a)"/><text class="n" x="136.0" y="274.0384757729337" text-anchor="middle" >4A 유입</text><path d="M196,327L270,309" stroke="#c1121f" stroke-width="2.4" marker-end="url(#r)"/><text class="n" x="273.57233587073176" y="313.4787914004599" text-anchor="start" >2A 유출</text><path d="M196,333L270,351" stroke="#c1121f" stroke-width="2.4" marker-end="url(#r)"/><text class="n" x="273.57233587073176" y="354.5212085995401" text-anchor="start" >I5 유출</text><text x="185" y="398" text-anchor="middle" style="font-weight:700;fill:#e07a1f">1+3+4 = 2+I5  →  I5 = 6A</text><path d="M410,370V290H440M520,290H540M620,290H660V370H410" fill="none" stroke="#222" stroke-width="1.6"/><path d="M540,290L548,290L553.3,297L564.0,283L574.7,297L585.3,283L596.0,297L606.7,283L612,290L620,290" fill="none" stroke="#222" stroke-width="1.6"/><path d="M402,318H418" stroke="#222" stroke-width="3"/><path d="M406,326H414" stroke="#222" stroke-width="3"/><path d="M402,334H418" stroke="#222" stroke-width="3"/><path d="M406,342H414" stroke="#222" stroke-width="3"/><text class="n" x="424" y="334" text-anchor="start" >12V</text><path d="M440,290V280H520V290M440,290V304H520V290" fill="none" stroke="#222" stroke-width="1.6"/><rect class="o" x="460" y="274" width="40" height="12" fill="#fff" /><rect class="o" x="460" y="298" width="40" height="12" fill="#fff" /><text class="n" x="480" y="326" text-anchor="middle" >A: 병렬 합성 4.8Ω</text><text class="n" x="580" y="278" text-anchor="middle" >B: 1.2Ω</text><text x="535" y="392" text-anchor="middle" style="font-weight:700;fill:#e07a1f">I = 12÷6 = 2A  →  A 전압강하 = 2×4.8 = 9.6V</text><rect class="o" x="20" y="424" width="680" height="56" fill="#fff" rx="8"/><text class="n" x="36" y="446" text-anchor="start" >주차 제동력 비율 = (좌 + 우 제동력) ÷ 축중(차량 중량) × 100</text><text class="n" x="36" y="466" text-anchor="start" >예) (150+190) ÷ 950 × 100 = 35.7%(소수 둘째 자리 이하 버림) · 조도(lx) = 광도(cd) ÷ 거리²(m²) = 18000 ÷ 3² = 2000lx</text><text class="n" x="18" y="510">직렬은 저항을 더하고, 병렬은 역수 합으로 구한다. 키르히호프 제1법칙: 들어오는 전류의 합 = 나가는 전류의 합.</text><text class="n" x="18" y="528">릴레이 코일 저항은 코일 단자 85-86에 걸린 전압을 전류로 나눈 값이다.</text></svg>