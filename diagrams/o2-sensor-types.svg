<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="바이너리 타입의 의미와 지르코니아형 전압 발생, 티타니아형 저항 변화의 출력 특성 그래프 비교"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e4e2dam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f2ee"/><stop offset="0.28" stop-color="#e4e2da"/><stop offset="0.5" stop-color="#d4d2cb"/><stop offset="0.74" stop-color="#ecebe5"/><stop offset="1" stop-color="#b6b5ae"/></linearGradient><linearGradient id="mat_d4e4f1m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecf3f9"/><stop offset="0.28" stop-color="#d4e4f1"/><stop offset="0.5" stop-color="#c5d4e0"/><stop offset="0.74" stop-color="#e1ecf5"/><stop offset="1" stop-color="#aab6c1"/></linearGradient><linearGradient id="mat_f3dcc3p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8ebdc"/><stop offset="0.5" stop-color="#f3dcc3"/><stop offset="1" stop-color="#d1bda8"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="540" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">산소센서 3가지: 바이너리 · 지르코니아 · 티타니아</text><rect x="20" y="50" width="680" height="112" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">바이너리 타입 = 이론공연비(λ=1)를 경계로 농후/희박 두 가지만 구분하는 ON·OFF형</text><text x="36" y="90" text-anchor="start" >· 이론공연비 부근에서 출력이 급변해 ‘농후’ 또는 ‘희박’ 신호만 낸다.</text><text x="36" y="109" text-anchor="start" >· 삼원촉매 감시용 후단(Downstream) 센서에 쓰인다.</text><text x="36" y="128" text-anchor="start" >· 센서 소자의 방식은 지르코니아형·티타니아형으로 나뉜다.</text><text x="36" y="147" text-anchor="start" >· 전방의 광역(와이드밴드) 센서는 공연비를 연속으로 정밀 측정한다.</text><rect x="20" y="176" width="330" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="196" text-anchor="middle" style="font-weight:700;fill:#222">지르코니아(ZrO₂) 형식</text><rect x="38.0" y="209.0" width="100.0" height="58.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="36" y="206" width="100" height="58" fill="url(#mat_e4e2dam)" rx="6"/><rect x="36.0" y="206.0" width="100.0" height="58.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="37.5" y="207.5" width="97.0" height="24.36" rx="6" fill="url(#mat_gl)" pointer-events="none"/><rect x="58.0" y="221.0" width="60.0" height="34.0" rx="4" fill="#000" opacity=".09"/><rect class="o" x="56" y="218" width="60" height="34" fill="url(#mat_d4e4f1m)" rx="4"/><rect x="56.0" y="218.0" width="60.0" height="34.0" rx="4" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="57.5" y="219.5" width="57.0" height="14.28" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="86" y="238" text-anchor="middle" style="font-weight:700">대기</text><text class="n" x="86" y="280" text-anchor="middle" >바깥쪽 = 배기가스</text><path d="M96,220H80" stroke="#c1121f" stroke-width="0"/><text x="150" y="220" text-anchor="start" >산소 농도 차로 ‘전압’ 발생</text><text x="150" y="240" text-anchor="start" >대기(기준 공기)가 필요</text><text x="150" y="260" text-anchor="start" >자체 기전력이라 전원 불필요</text><path d="M96,310V408H320" fill="none" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/><path d="M208.0,310V408" stroke="#bbb" stroke-dasharray="3 3"/><path d="M102,318H168.0C202.0,318 214.0,400 248.0,400H314" fill="none" stroke="#1d4e89" stroke-width="3"/><text class="n" x="90" y="322" text-anchor="end" style="font-weight:700">0.8V↑</text><text class="n" x="90" y="404" text-anchor="end" style="font-weight:700">0.1V↓</text><text class="n" x="100" y="424" text-anchor="start" >농후(λ&lt;1)</text><text class="n" x="320" y="424" text-anchor="end" >희박(λ&gt;1)</text><text class="n" x="208.0" y="424" text-anchor="middle" >λ=1</text><text class="n" x="185" y="454" text-anchor="middle" style="font-weight:700">농후 → 전압 높음, 희박 → 전압 낮음</text><rect x="370" y="176" width="330" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="196" text-anchor="middle" style="font-weight:700;fill:#222">티타니아(TiO₂) 형식</text><rect x="388.0" y="209.0" width="100.0" height="58.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="386" y="206" width="100" height="58" fill="url(#mat_e4e2dam)" rx="6"/><rect x="386.0" y="206.0" width="100.0" height="58.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="387.5" y="207.5" width="97.0" height="24.36" rx="6" fill="url(#mat_gl)" pointer-events="none"/><rect x="408.0" y="223.0" width="60.0" height="30.0" rx="3" fill="#000" opacity=".09"/><rect class="o" x="406" y="220" width="60" height="30" fill="url(#mat_f3dcc3p)" rx="3"/><rect x="407.5" y="221.5" width="57.0" height="12.6" rx="3" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="436" y="240" text-anchor="middle" style="font-weight:700">저항 R</text><text class="n" x="436" y="280" text-anchor="middle" >5V 기준 전원 인가</text><text x="500" y="220" text-anchor="start" >산소 농도 → ‘저항’이 변함</text><text x="500" y="240" text-anchor="start" >전압이 아니라 저항 변화형</text><text x="500" y="260" text-anchor="start" >5V를 가해 전압으로 읽음</text><path d="M440,310V408H670" fill="none" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/><path d="M555.0,310V408" stroke="#bbb" stroke-dasharray="3 3"/><path d="M446,400H515.0C549.0,400 561.0,318 595.0,318H664" fill="none" stroke="#c1121f" stroke-width="3"/><text class="n" x="434" y="322" text-anchor="end" style="font-weight:700">5V</text><text class="n" x="434" y="404" text-anchor="end" style="font-weight:700">0V</text><text class="n" x="444" y="424" text-anchor="start" >농후(λ&lt;1)</text><text class="n" x="670" y="424" text-anchor="end" >희박(λ&gt;1)</text><text class="n" x="555.0" y="424" text-anchor="middle" >λ=1</text><text class="n" x="535" y="454" text-anchor="middle" style="font-weight:700">농후 → 0V (저항 작음), 희박 → 5V</text><text class="n" x="18" y="510">지르코니아: 대기와 배기의 산소 농도 차로 전압 발생, 이론공연비에서 급변 (답: 지르코니아 형식).</text><text class="n" x="18" y="528">티타니아: 이론공연비 부근에서 저항이 급변, 농후 0V·희박 5V (답: 티타니아 산소센서). 후단 센서 타입은 ‘바이너리’.</text><g pointer-events="none" transform="translate(0,20)"><path d="M304,196 q-30,-10 -30,-30" fill="none" stroke="#222" stroke-width="5"/><path d="M304,196 q-30,-10 -30,-30" fill="none" stroke="#2b2f33" stroke-width="3"/><rect class="o" x="290" y="196" width="28" height="34" rx="3" fill="#8a8f93" /><rect class="o" x="286" y="230" width="36" height="14" rx="2" fill="#c3c7ca" /><path d="M292,230v14" stroke="#555" stroke-width="1"/><path d="M298,230v14" stroke="#555" stroke-width="1"/><path d="M304,230v14" stroke="#555" stroke-width="1"/><path d="M310,230v14" stroke="#555" stroke-width="1"/><path d="M316,230v14" stroke="#555" stroke-width="1"/><rect class="o" x="294" y="244" width="20" height="26" rx="3" fill="#9ea3a7" /><path class="o" d="M294,270 h20 v14 a10,12 0 0,1 -20,0z" fill="#d8e0e8"/><path d="M298,276 v8" stroke="#222" stroke-width="1.2"/><path d="M302,276 v8" stroke="#222" stroke-width="1.2"/><path d="M306,276 v8" stroke="#222" stroke-width="1.2"/><path d="M310,276 v8" stroke="#222" stroke-width="1.2"/><path d="M654,196 q-30,-10 -30,-30" fill="none" stroke="#222" stroke-width="5"/><path d="M654,196 q-30,-10 -30,-30" fill="none" stroke="#2b2f33" stroke-width="3"/><rect class="o" x="640" y="196" width="28" height="34" rx="3" fill="#8a8f93" /><rect class="o" x="636" y="230" width="36" height="14" rx="2" fill="#c3c7ca" /><path d="M642,230v14" stroke="#555" stroke-width="1"/><path d="M648,230v14" stroke="#555" stroke-width="1"/><path d="M654,230v14" stroke="#555" stroke-width="1"/><path d="M660,230v14" stroke="#555" stroke-width="1"/><path d="M666,230v14" stroke="#555" stroke-width="1"/><rect class="o" x="644" y="244" width="20" height="26" rx="3" fill="#9ea3a7" /><path class="o" d="M644,270 h20 v14 a10,12 0 0,1 -20,0z" fill="#e8d9b0"/><path d="M648,276 v8" stroke="#222" stroke-width="1.2"/><path d="M652,276 v8" stroke="#222" stroke-width="1.2"/><path d="M656,276 v8" stroke="#222" stroke-width="1.2"/><path d="M660,276 v8" stroke="#222" stroke-width="1.2"/></g></svg>