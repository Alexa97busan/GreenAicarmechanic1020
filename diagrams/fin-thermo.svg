<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="핀서모 센서가 증발기 온도를 감지해 압축기를 정지시키는 흐름"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}.b{font-weight:700}
.l{stroke:#444;stroke-width:1;fill:none}.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">핀서모 센서와 증발기 빙결 방지</text><rect class="o" x="40" y="80" width="180" height="70" rx="8" fill="#e3edf8"/><text x="130" y="100" text-anchor="middle" class="b">증발기</text><text x="130" y="117" text-anchor="middle" class="n">냉매가 증발하며 열을 빼앗음</text><rect class="o" x="40" y="200" width="180" height="70" rx="8" fill="#fff"/><text x="130" y="220" text-anchor="middle" class="b">핀서모 센서</text><text x="130" y="237" text-anchor="middle" class="n">증발기 핀 온도 감지 (NTC 서미스터)</text><path d="M130,200L130,152" class="l" marker-end="url(#a)"/><rect class="o" x="300" y="200" width="170" height="70" rx="8" fill="#fff"/><text x="385" y="220" text-anchor="middle" class="b">에어컨 ECU</text><text x="385" y="237" text-anchor="middle" class="n">출구 약 0~0.5℃ 이하 → 판단</text><path d="M220,235L298,235" class="l" marker-end="url(#a)"/><rect class="o" x="540" y="200" width="150" height="70" rx="8" fill="#fbe5e7"/><text x="615" y="220" text-anchor="middle" class="b">에어컨 릴레이 OFF</text><text x="615" y="237" text-anchor="middle" class="n">압축기 정지</text><path d="M470,235L538,235" class="l" marker-end="url(#a)"/><rect class="o" x="540" y="80" width="150" height="70" rx="8" fill="#e3edf8"/><text x="615" y="100" text-anchor="middle" class="b">증발기 빙결 방지</text><text x="615" y="117" text-anchor="middle" class="n">공기 흐름 막힘 방지</text><path d="M615,198L615,152" class="l" marker-end="url(#a)"/><rect x="300" y="60" width="170" height="110" fill="#fff" class="o" rx="4"/><path d="M315,75C340,130 380,150 455,158" fill="none" stroke="#1d5fa8" stroke-width="3"/><text x="385" y="185" text-anchor="middle" class="n">온도 ↑ → 저항 ↓</text><text x="315" y="73" class="n" style="font-size:10px">저항</text><text class="n" x="18" y="352" style="font-size:12.5px;fill:#222">핀서모 센서 = 증발기 온도를 감지해 일정 이하(출구 약 0~0.5℃)가 되면 압축기를 정지시켜 빙결을 막는 센서</text><text class="n" x="18" y="371" style="font-size:12.5px;fill:#222">서미스터 특성: 온도가 오르면 저항이 줄어드는 부특성(NTC) 서미스터</text><text class="n" x="18" y="390" style="font-size:12.5px;fill:#222">핀서모만 쓰면 오답 — "핀서모 센서"로 씁니다</text></svg>