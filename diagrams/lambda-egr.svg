<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="이론공연비 14.7:1과 람다 값의 의미, EGR 계통"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">공연비·람다와 EGR</text><rect x="20" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">공연비와 람다(λ)</text><path d="M60,160H310" stroke="#222" stroke-width="3"/><path d="M185,160L185,180" stroke="#222" stroke-width="3"/><rect class="o" x="80" y="120" width="70" height="40" fill="#d4e4f1" /><rect class="o" x="220" y="140" width="40" height="20" fill="#f3dcc3" /><text class="n" x="115" y="114" text-anchor="middle" >공기 14.7</text><text class="n" x="240" y="134" text-anchor="middle" >연료 1</text><text class="n" x="185" y="200" text-anchor="middle" >14.7 : 1 = 공기 질량 : 가솔린 질량</text><rect class="o" x="40" y="220" width="90" height="60" fill="#f4e1dd" rx="6"/><text x="85" y="244" text-anchor="middle" style="font-weight:700">λ &lt; 1</text><text class="n" x="85" y="262" text-anchor="middle" >농후</text><rect class="o" x="140" y="220" width="90" height="60" fill="#e8f0d8" rx="6"/><text x="185" y="244" text-anchor="middle" style="font-weight:700">λ = 1</text><text class="n" x="185" y="262" text-anchor="middle" >이론공연비</text><rect class="o" x="240" y="220" width="90" height="60" fill="#d4e4f1" rx="6"/><text x="285" y="244" text-anchor="middle" style="font-weight:700">λ &gt; 1</text><text class="n" x="285" y="262" text-anchor="middle" >희박(공기 多)</text><text class="n" x="185" y="310" text-anchor="middle" >λ&gt;1: 혼합비가 희박하다</text><rect x="370" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">EGR (배기가스 재순환)</text><rect class="o" x="390" y="100" width="120" height="44" fill="#e6e4da" rx="6"/><text x="450.0" y="126.0" text-anchor="middle" style="font-weight:700">배기 매니폴드</text><rect class="o" x="570" y="100" width="110" height="44" fill="#d4e4f1" rx="6"/><text x="625.0" y="126.0" text-anchor="middle" style="font-weight:700">흡기</text><rect class="o" x="450" y="190" width="130" height="44" fill="#f3dcc3" rx="6"/><text x="515.0" y="210.0" text-anchor="middle" style="font-weight:700">EGR 밸브</text><text class="n" x="515.0" y="225.0" text-anchor="middle" >(액추에이터)</text><path d="M450,144L450,190" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M450,144L450,190" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round"/><path d="M580,212L625,212L625,144" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M580,212L625,212L625,144" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round"/><text class="n" x="386" y="262" text-anchor="start" >목적: 연소 온도를 낮춰 NOx 감소</text><text class="n" x="386" y="280" text-anchor="start" >EGR 액추에이터: 엔진 워밍업 후 작동</text><text class="n" x="386" y="298" text-anchor="start" >디젤 PM은 NOx와 반대(농후·저온에서↑)</text><text class="n" x="18" y="380">산소센서(람다 센서)는 배기 중 산소 농도를 검출해 EGR 정밀 제어와 연료량 보정에 쓰인다.</text><text class="n" x="18" y="398">디젤 EGR 밸브 제어로 줄이려는 배기가스는 질소산화물(NOx)이다.</text></svg>