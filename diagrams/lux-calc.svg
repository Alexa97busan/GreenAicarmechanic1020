<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="광도 18000cd, 거리 3m일 때 조도 2000럭스 계산"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e8f0d8m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f8ed"/><stop offset="0.28" stop-color="#e8f0d8"/><stop offset="0.5" stop-color="#d8dfc9"/><stop offset="0.74" stop-color="#eff4e4"/><stop offset="1" stop-color="#bac0ad"/></linearGradient><radialGradient id="mat_f6e7a1r" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fbf5d9"/><stop offset=".55" stop-color="#f6e7a1"/><stop offset="1" stop-color="#b8ad79"/></radialGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="420" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">전조등 조도 계산</text><rect x="20" y="50" width="680" height="200" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">조도 E(lx) = 광도 I(cd) ÷ 거리² (m²)</text><circle class="o" cx="80" cy="150" r="22" fill="url(#mat_f6e7a1r)"/><path d="M110,136H126" stroke="#e0a800" stroke-width="2"/><path d="M110,150H126" stroke="#e0a800" stroke-width="2"/><path d="M110,164H126" stroke="#e0a800" stroke-width="2"/><text class="n" x="80" y="196" text-anchor="middle" >전조등</text><text class="n" x="80" y="212" text-anchor="middle" style="font-weight:700">18,000 cd</text><rect class="o" x="420" y="100" width="16" height="100" fill="#d8d6cc" /><text class="n" x="428" y="218" text-anchor="middle" >측정 스크린</text><path d="M110,150H420" fill="none" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/><path d="M110,230H420" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><path d="M110,224V236M420,224V236" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="265" y="246" text-anchor="middle" >측정 거리 3 m</text><text x="470" y="130" text-anchor="start" >E = 18,000 ÷ 3²</text><text x="470" y="156" text-anchor="start" >  = 18,000 ÷ 9</text><text x="470" y="182" text-anchor="start" >  = 2,000 lx</text><rect x="20" y="266" width="680" height="100" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="286" text-anchor="middle" style="font-weight:700;fill:#222">거리가 멀어지면 (역제곱 법칙)</text><rect class="o" x="40" y="298" width="150" height="52" fill="#fff" rx="5"/><text x="115.0" y="328.0" text-anchor="middle" >1 m → 18,000 lx</text><rect class="o" x="204" y="298" width="150" height="52" fill="#fff" rx="5"/><text x="279.0" y="328.0" text-anchor="middle" >2 m → 4,500 lx</text><rect x="370.0" y="301.0" width="150.0" height="52.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="368" y="298" width="150" height="52" fill="url(#mat_e8f0d8m)" rx="5"/><rect x="368.0" y="298.0" width="150.0" height="52.0" rx="5" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="369.5" y="299.5" width="147.0" height="21.84" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text x="443.0" y="328.0" text-anchor="middle" style="font-weight:700">3 m → 2,000 lx</text><rect class="o" x="532" y="298" width="150" height="52" fill="#fff" rx="5"/><text x="607.0" y="328.0" text-anchor="middle" >6 m → 500 lx</text><text class="n" x="18" y="390">거리를 2배로 하면 조도는 1/4. 거리 값을 제곱해서 나누는 것을 잊지 않는다.</text><text class="n" x="18" y="408">계산 과정 칸이 있어도 답은 ‘2000 Lux’ 형태로 간결하게 쓴다.</text></svg>