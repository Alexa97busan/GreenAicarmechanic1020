<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="삼원촉매에서 NOx 환원과 HC, CO 산화 반응"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
.fa{stroke-dasharray:6 5;animation:fa 1s linear infinite}@keyframes fa{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fl,.fa{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">삼원촉매의 정화 작용</text><rect class="o" x="20" y="176" width="680" height="28" fill="#d8d6cc" /><path class="o" d="M210,176L250,138V242L210,204Z" fill="#b9bec4" /><path class="o" d="M510,176L470,138V242L510,204Z" fill="#b9bec4" /><rect class="o" x="250" y="120" width="220" height="140" fill="#b9bec4" rx="14"/><rect class="o" x="264" y="134" width="192" height="112" fill="#e6dcc8" /><path d="M276,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M288,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M300,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M312,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M324,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M336,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M348,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M360,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M372,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M384,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M396,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M408,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M420,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M432,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M444,134V246" stroke="#9a8f74" stroke-width="1"/><path d="M264,146H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,158H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,170H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,182H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,194H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,206H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,218H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,230H456" stroke="#9a8f74" stroke-width="1"/><path d="M264,242H456" stroke="#9a8f74" stroke-width="1"/><text x="360" y="110" text-anchor="middle" >삼원촉매 (허니콤 담체 + Pt·Pd·Rh)</text><path class="o" d="M151,176L155,158H165L169,176Z" fill="#8d949c" /><path d="M160,158V146" stroke="#222" stroke-width="2"/><path class="o" d="M551,176L555,158H565L569,176Z" fill="#8d949c" /><path d="M560,158V146" stroke="#222" stroke-width="2"/><text class="n" x="148" y="128" text-anchor="middle" >전방 산소센서</text><text class="n" x="148" y="142" text-anchor="middle" >(공연비 피드백)</text><text class="n" x="560" y="128" text-anchor="middle" >후방 산소센서</text><text class="n" x="560" y="142" text-anchor="middle" >(촉매 정화 감시)</text><text x="20" y="168" text-anchor="start" style="font-weight:700;fill:#c1121f">HC · CO · NOx</text><text x="700" y="168" text-anchor="end" style="font-weight:700;fill:#2f7f3f">CO₂ · H₂O · N₂</text><polygon points="54,184 67,190 54,196" fill="#c1121f" stroke="#222" stroke-width="1"/><polygon points="634,184 647,190 634,196" fill="#2f7f3f" stroke="#222" stroke-width="1"/><text class="n" x="360" y="282" text-anchor="middle" >활성 개시(LOT) 약 300℃ · 적정 작동 400~800℃ · 공연비 14.7:1(λ=1) 부근에서 최고 효율</text><rect class="o" x="30" y="298" width="200" height="54" fill="#f0d6d6" rx="6"/><text x="130" y="318" text-anchor="middle" style="font-weight:700">환원</text><text x="130" y="340" text-anchor="middle" >NOx → N₂ + O₂</text><rect class="o" x="260" y="298" width="200" height="54" fill="#d4e4f1" rx="6"/><text x="360" y="318" text-anchor="middle" style="font-weight:700">산화</text><text x="360" y="340" text-anchor="middle" >2CO + O₂ → 2CO₂</text><rect class="o" x="490" y="298" width="200" height="54" fill="#d4e4f1" rx="6"/><text x="590" y="318" text-anchor="middle" style="font-weight:700">산화</text><text x="590" y="340" text-anchor="middle" >HC + O₂ → H₂O + CO₂</text><path class="fa" d="M230,325H258" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><path class="fa" d="M460,325H488" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><text class="n" x="244" y="316" text-anchor="middle" >O₂</text><text class="n" x="474" y="316" text-anchor="middle" >O₂</text><text class="n" x="18" y="380">NOx가 환원되어 N₂와 O₂로 분리되고, 이 O₂가 CO와 HC를 산화시켜 CO₂·H₂O로 정화한다.</text><text class="n" x="18" y="398">정화 대상은 HC·CO·NOx이다(입자상 물질 PM은 정화하지 못하며 디젤은 DPF로 포집한다).</text></svg>