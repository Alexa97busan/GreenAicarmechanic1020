<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="공기량 측정 방식 분류: 직접계측과 간접계측"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}.b{font-weight:700}
.l{stroke:#444;stroke-width:1;fill:none}.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">공기량 측정 방식 (직접 vs 간접)</text><rect class="o" x="40" y="70" width="300" height="60" rx="8" fill="#d9ead3"/><text x="190" y="90" text-anchor="middle" class="b">직접계측 (질량 유량을 직접 잼)</text><text x="190" y="107" text-anchor="middle" class="n">AFS(공기유량센서)</text><rect class="o" x="40" y="160" width="92" height="70" rx="8" fill="#fff"/><text x="86" y="180" text-anchor="middle" class="b">핫와이어</text><text x="86" y="197" text-anchor="middle" class="n">가열선이</text><text x="86" y="214" text-anchor="middle" class="n">식는 정도</text><rect class="o" x="140" y="160" width="92" height="70" rx="8" fill="#fff"/><text x="186" y="180" text-anchor="middle" class="b">핫필름</text><text x="186" y="197" text-anchor="middle" class="n">필름 저항이</text><text x="186" y="214" text-anchor="middle" class="n"> 식는 정도</text><rect class="o" x="240" y="160" width="92" height="70" rx="8" fill="#fff"/><text x="286" y="180" text-anchor="middle" class="b">칼만와류</text><text x="286" y="197" text-anchor="middle" class="n">와류 발생 </text><text x="286" y="214" text-anchor="middle" class="n">주파수</text><rect class="o" x="400" y="70" width="290" height="60" rx="8" fill="#fbe5e7"/><text x="545" y="90" text-anchor="middle" class="b">간접계측 (흡기압력으로 추정)</text><text x="545" y="107" text-anchor="middle" class="n">MAP 센서 방식</text><rect class="o" x="420" y="160" width="250" height="70" rx="8" fill="#fff"/><text x="545" y="180" text-anchor="middle" class="b">맵 센서 · 스피드덴시티</text><text x="545" y="197" text-anchor="middle" class="n">흡기 매니폴드 압력과 rpm으로</text><text x="545" y="214" text-anchor="middle" class="n">공기량을 계산</text><text class="n" x="18" y="332" style="font-size:12.5px;fill:#222">"AFS 직접계측 방식이 아닌 것은?" → 맵 센서 방식</text><text class="n" x="18" y="351" style="font-size:12.5px;fill:#222">AFS는 핫와이어·핫필름·칼만와류 방식 (홀센서 방식을 쓰지 않는 센서는 AFS, CKPS·CMPS·TPS는 홀 방식 사용)</text><text class="n" x="18" y="370" style="font-size:12.5px;fill:#222">직접계측 = 공기 질량을 바로 측정, 간접계측 = 압력과 회전수로 계산</text></svg>