<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="저압·고압 게이지와 센터 호스, 진공 펌프 연결 및 충전 주의점"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">에어컨 매니폴드 게이지: 진공 작업과 냉매 충전</text><rect class="o" x="250" y="90" width="220" height="46" fill="#d8d6cc" rx="8"/><circle class="o" cx="300" cy="86" r="30" fill="#fff"/><path d="M300,86L316,70" stroke="#1d4e89" stroke-width="2.4"/><text x="300" y="134" text-anchor="middle" style="font-weight:700;fill:#1d4e89">저압</text><circle class="o" cx="420" cy="86" r="30" fill="#fff"/><path d="M420,86L436,72" stroke="#c1121f" stroke-width="2.4"/><text x="420" y="134" text-anchor="middle" style="font-weight:700;fill:#c1121f">고압</text><rect class="o" x="284" y="136" width="20" height="22" fill="#1d4e89" /><rect class="o" x="416" y="136" width="20" height="22" fill="#c1121f" /><rect class="o" x="350" y="136" width="20" height="22" fill="#e0b25a" /><path d="M294,158L294,220L150,220" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/><path d="M294,158L294,220L150,220" fill="none" stroke="#1d4e89" stroke-width="5" stroke-linejoin="round"/><path d="M426,158L426,220L570,220" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/><path d="M426,158L426,220L570,220" fill="none" stroke="#c1121f" stroke-width="5" stroke-linejoin="round"/><path d="M360,158L360,300" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/><path d="M360,158L360,300" fill="none" stroke="#e0b25a" stroke-width="5" stroke-linejoin="round"/><rect class="o" x="40" y="190" width="110" height="60" fill="#d4e4f1" rx="6"/><text x="95.0" y="224.0" text-anchor="middle" style="font-weight:700">저압 서비스 포트</text><rect class="o" x="570" y="190" width="120" height="60" fill="#f0d6d6" rx="6"/><text x="630.0" y="224.0" text-anchor="middle" style="font-weight:700">고압 서비스 포트</text><rect class="o" x="290" y="300" width="140" height="46" fill="#e6e4da" rx="6"/><text x="360.0" y="321.0" text-anchor="middle" style="font-weight:700">진공 펌프</text><text class="n" x="360.0" y="336.0" text-anchor="middle" >(센터 호스 연결)</text><rect class="o" x="20" y="70" width="200" height="100" fill="#fff" rx="8"/><text x="34" y="92" text-anchor="start" style="font-weight:700;fill:#e07a1f">진공 작업</text><text class="n" x="34" y="112" text-anchor="start" >1. 냉매가 계통에서 모두</text><text class="n" x="34" y="126" text-anchor="start" >   배출되었는지 확인</text><text class="n" x="34" y="140" text-anchor="start" >2. 센터 호스 → 진공 펌프</text><text class="n" x="34" y="154" text-anchor="start" >3. 고·저압 밸브 열고 작동</text><rect class="o" x="500" y="70" width="200" height="100" fill="#fff" rx="8"/><text x="514" y="92" text-anchor="start" style="font-weight:700;fill:#e07a1f">냉매 충전</text><text class="n" x="514" y="112" text-anchor="start" >고압측 충전: 엔진 정지</text><text class="n" x="514" y="126" text-anchor="start" >액체 냉매를 저압 밸브로</text><text class="n" x="514" y="140" text-anchor="start" >넣으면 압축기 손상</text><text class="n" x="514" y="154" text-anchor="start" >(액 압축 · Liquid Hammer)</text><rect class="o" x="20" y="360" width="680" height="36" fill="#fff" rx="8"/><text class="n" x="36" y="383" text-anchor="start" >라인 압력은 외기 온도에 따라 달라진다(온도↑ → 압력↑). 같은 냉매량이어도 일정하지 않다.</text><text class="n" x="18" y="410">진공 작업을 하려면 먼저 매니폴드 게이지를 고압·저압 서비스 포트에 모두 연결한다.</text><text class="n" x="18" y="428">‘고압측에만 연결’, ‘센터 호스를 공기압축기에 연결’은 진공 작업 방법으로 틀리다.</text></svg>