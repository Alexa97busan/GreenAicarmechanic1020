 opacity=".5"/><path d="M332,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M342,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M352,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M362,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M372,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M382,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M392,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M402,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><path d="M412,304V342" stroke="#8b887c" stroke-width="1.4" opacity=".5"/><rect class="o" x="428" y="312" width="22" height="22" rx="4" fill="url(#mat_4a4e52p)"/><rect x="429.5" y="313.5" width="19.0" height="9.24" rx="4" fill="url(#mat_gl)" pointer-events="none"/></g><text x="360.0" y="321.0" text-anchor="middle" style="font-weight:700">진공 펌프</text><text class="n" x="360.0" y="336.0" text-anchor="middle" >(센터 호스 연결)</text><rect class="o" x="20" y="70" width="200" height="100" fill="#fff" rx="8"/><text x="34" y="92" text-anchor="start" style="font-weight:700;fill:#e07a1f">진공 작업</text><text class="n" x="34" y="112" text-anchor="start" >1. 냉매가 계통에서 모두</text><text class="n" x="34" y="126" text-anchor="start" >   배출되었는지 확인</text><text class="n" x="34" y="140" text-anchor="start" >2. 센터 호스 → 진공 펌프</text><text class="n" x="34" y="154" text-anchor="start" >3. 고·저압 밸브 열고 작동</text><rect class="o" x="500" y="70" width="200" height="100" fill="#fff" rx="8"/><text x="514" y="92" text-anchor="start" style="font-weight:700;fill:#e07a1f">냉매 충전</text><text class="n" x="514" y="112" text-anchor="start" >고압측 충전: 엔진 정지</text><text class="n" x="514" y="126" text-anchor="start" >액체 냉매를 저압 밸브로</text><text class="n" x="514" y="140" text-anchor="start" >넣으면 압축기 손상</text><text class="n" x="514" y="154" text-anchor="start" >(액 압축 · Liquid Hammer)</text><rect class="o" x="20" y="360" width="680" height="36" fill="#fff" rx="8"/><text class="n" x="36" y="383" text-anchor="start" >라인 압력은 외기 온도에 따라 달라진다(온도↑ → 압력↑). 같은 냉매량이어도 일정하지 않다.</text><text class="n" x="18" y="410">진공 작업을 하려면 먼저 매니폴드 게이지를 고압·저압 서비스 포트에 모두 연결한다.</text><text class="n" x="18" y="428">‘고압측에만 연결’, ‘센터 호스를 공기압축기에 연결’은 진공 작업 방법으로 틀리다.</text></svg>