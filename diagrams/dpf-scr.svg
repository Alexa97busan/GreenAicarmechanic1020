 물질 포집)</text><rect class="o" x="380" y="150" width="150" height="88" fill="#d4e4f1" rx="8"/><path d="M392,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M401,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M410,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M419,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M428,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M437,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M446,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M455,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M464,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M473,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M482,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M491,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M500,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M509,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M518,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M527,158V230" stroke="#6f93b0" stroke-width="1.3"/><text x="455" y="140" text-anchor="middle" style="font-weight:700">SCR 촉매 (NOx 환원)</text><rect class="o" x="330" y="40" width="110" height="44" fill="#e8f0d8" rx="6"/><text x="385.0" y="60.0" text-anchor="middle" style="font-weight:700">요소수 탱크</text><text class="n" x="385.0" y="75.0" text-anchor="middle" >요소 약 32.5% + 물</text><rect class="o" x="340" y="120" width="16" height="26" fill="#e07a1f" rx="3"/><text class="n" x="348" y="162" text-anchor="middle" >도징 인젝터</text><path d="M385,84V104H348V120" fill="none" stroke="#6f9a3a" stroke-width="3"/><path class="o" d="M132,186L136,170H144L148,186Z" fill="#8d949c" /><path d="M140,170V150" stroke="#222" stroke-width="2"/><text class="n" x="140" y="144" text-anchor="middle" >EGTS</text><rect class="o" x="205" y="96" width="40" height="22" fill="#fff" stroke-width="1.2"/><text class="n" x="225" y="90" text-anchor="middle" >차압 센서</text><path d="M212,118V150" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><path d="M238,118V150" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><circle cx="212" cy="150" r="2.5" fill="#222"/><circle cx="238" cy="150" r="2.5" fill="#222"/><text class="n" x="340" y="262" text-anchor="middle" >※ 배기쪽 센서: 람다 센서·EGTS·차압 센서 / 부스트 압력 센서(BPS)는 흡기쪽</text><polygon points="129,188 142,194 129,200" fill="#555" stroke="#222" stroke-width="1"/><polygon points="329,188 342,194 329,200" fill="#555" stroke="#222" stroke-width="1"/><polygon points="574,188 587,194 574,200" fill="#555" stroke="#222" stroke-width="1"/><text class="n" x="640" y="226" text-anchor="middle" >정화된 배기가스</text><rect class="o" x="30" y="290" width="300" height="52" fill="#f3dcc3" rx="6"/><text x="180.0" y="314.0" text-anchor="middle" style="font-weight:700">DPF 재생</text><text class="n" x="180.0" y="329.0" text-anchor="middle" >사후 분사로 배기온도 상승 · 스캔툴 강제 재생</text><rect class="o" x="390" y="290" width="300" height="52" fill="#e8f0d8" rx="6"/><text x="540.0" y="314.0" text-anchor="middle" style="font-weight:700">SCR 반응</text><text class="n" x="540.0" y="329.0" text-anchor="middle" >요소수 → 암모니아(NH₃) → NOx를 N₂·H₂O로 환원</text><text class="n" x="18" y="370">차압 센서: 하나의 센서로 DPF 전·후방 압력 차이를 검출해 매연 포집량과 재생 시기를 판단한다.</text><text class="n" x="18" y="388">SCR은 NOx를 줄이는 장치이며, 도징 인젝터가 SCR 촉매 전단에 요소수를 분사한다. 요소수의 어는점은 약 −11℃.</text></svg>