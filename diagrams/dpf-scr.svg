54V168" stroke="#555" stroke-width="1.4" opacity="0.6"/><path d="M74,154V168" stroke="#555" stroke-width="1.4" opacity="0.6"/><path d="M82,154V168" stroke="#555" stroke-width="1.4" opacity="0.6"/><path d="M90,154V168" stroke="#555" stroke-width="1.4" opacity="0.6"/><path d="M98,154V168" stroke="#555" stroke-width="1.4" opacity="0.6"/><text x="65.0" y="198.0" text-anchor="middle" style="font-weight:700">디젤 엔진</text><path class="o" d="M150,176L160,160V228L150,212Z" fill="#9ea3a7"/><path class="o" d="M300,176L290,160V228L300,212Z" fill="#9ea3a7"/><rect class="o" x="160" y="150" width="130" height="88" rx="14" fill="#d8d3bf" /><rect class="o" x="156" y="146" width="6" height="96" rx="2" fill="#7b8084" /><rect class="o" x="288" y="146" width="6" height="96" rx="2" fill="#7b8084" /><path d="M172,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M181,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M190,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M199,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M208,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M217,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M226,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M235,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M244,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M253,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M262,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M271,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M280,158V230" stroke="#8b7a55" stroke-width="1.3"/><path d="M289,158V230" stroke="#8b7a55" stroke-width="1.3"/><text x="225" y="140" text-anchor="middle" style="font-weight:700">DPF (입자상 물질 포집)</text><path class="o" d="M370,176L380,160V228L370,212Z" fill="#9ea3a7"/><path class="o" d="M540,176L530,160V228L540,212Z" fill="#9ea3a7"/><rect class="o" x="380" y="150" width="150" height="88" rx="14" fill="#d6e5f2" /><rect class="o" x="376" y="146" width="6" height="96" rx="2" fill="#7b8084" /><rect class="o" x="528" y="146" width="6" height="96" rx="2" fill="#7b8084" /><path d="M392,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M401,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M410,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M419,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M428,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M437,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M446,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M455,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M464,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M473,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M482,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M491,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M500,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M509,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M518,158V230" stroke="#6f93b0" stroke-width="1.3"/><path d="M527,158V230" stroke="#6f93b0" stroke-width="1.3"/><text x="455" y="140" text-anchor="middle" style="font-weight:700">SCR 촉매 (NOx 환원)</text><rect class="o" x="330" y="40" width="110" height="44" rx="10" fill="#e3eed2" /><rect class="o" x="346" y="30" width="26" height="12" rx="3" fill="#3d78b8" /><path d="M340,52H430" stroke="#9bb383" stroke-width="1.2" opacity=".6"/><text x="385.0" y="60.0" text-anchor="middle" style="font-weight:700">요소수 탱크</text><text class="n" x="385.0" y="75.0" text-anchor="middle" >요소 약 32.5% + 물</text><rect class="o" x="340" y="120" width="16" height="26" rx="3" fill="#e07a1f" /><rect class="o" x="343" y="108" width="10" height="12" rx="2" fill="#2f3438" /><path d="M342,134h12" stroke="#7a3d08" stroke-width="1.4"/><text class="n" x="348" y="162" text-anchor="middle" >도징 인젝터</text><path d="M385,84V104H348V120" fill="none" stroke="#6f9a3a" stroke-width="3"/><path class="o" d="M132,186L136,170H144L148,186Z" fill="#8d949c" /><path d="M140,170V150" stroke="#222" stroke-width="2"/><text class="n" x="140" y="144" text-anchor="middle" >EGTS</text><rect class="o" x="205" y="96" width="40" height="22" rx="4" fill="#2f3438" /><text x="225" y="111" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">ΔP</text><text class="n" x="225" y="90" text-anchor="middle" >차압 센서</text><path d="M212,118V150" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><path d="M238,118V150" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><circle cx="212" cy="150" r="2.5" fill="#222"/><circle cx="238" cy="150" r="2.5" fill="#222"/><text class="n" x="340" y="262" text-anchor="middle" >※ 배기쪽 센서: 람다 센서·EGTS·차압 센서 / 부스트 압력 센서(BPS)는 흡기쪽</text><polygon points="129,188 142,194 129,200" fill="#555" stroke="#222" stroke-width="1"/><polygon points="329,188 342,194 329,200" fill="#555" stroke="#222" stroke-width="1"/><polygon points="574,188 587,194 574,200" fill="#555" stroke="#222" stroke-width="1"/><text class="n" x="640" y="226" text-anchor="middle" >정화된 배기가스</text><rect class="o" x="30" y="290" width="300" height="52" fill="#f3dcc3" rx="6"/><text x="180.0" y="314.0" text-anchor="middle" style="font-weight:700">DPF 재생</text><text class="n" x="180.0" y="329.0" text-anchor="middle" >사후 분사로 배기온도 상승 · 스캔툴 강제 재생</text><rect class="o" x="390" y="290" width="300" height="52" fill="#e8f0d8" rx="6"/><text x="540.0" y="314.0" text-anchor="middle" style="font-weight:700">SCR 반응</text><text class="n" x="540.0" y="329.0" text-anchor="middle" >요소수 → 암모니아(NH₃) → NOx를 N₂·H₂O로 환원</text><text class="n" x="18" y="370">차압 센서: 하나의 센서로 DPF 전·후방 압력 차이를 검출해 매연 포집량과 재생 시기를 판단한다.</text><text class="n" x="18" y="388">SCR은 NOx를 줄이는 장치이며, 도징 인젝터가 SCR 촉매 전단에 요소수를 분사한다. 요소수의 어는점은 약 −11℃.</text></svg>