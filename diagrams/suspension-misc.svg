<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="스테빌라이저, 평행 리프 스프링, 시미 현상, AGCS"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="480" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">현가장치 보조 장치와 현상</text><rect x="20" y="50" width="330" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">스테빌라이저 (롤링 억제)</text><rect x="370" y="50" width="330" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">평행 리프 스프링</text><rect x="20" y="250" width="330" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="270" text-anchor="middle" style="font-weight:700;fill:#222">시미 현상</text><rect x="370" y="250" width="330" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="270" text-anchor="middle" style="font-weight:700;fill:#222">AGCS (후륜 토 제어)</text><rect class="o" x="70" y="96" width="14" height="40" fill="#6e747b" rx="3"/><rect class="o" x="266" y="96" width="14" height="40" fill="#6e747b" rx="3"/><path d="M77,130H273" stroke="#222" stroke-width="3"/><path d="M92,104V150H258V104" fill="none" stroke="#e07a1f" stroke-width="5" stroke-linejoin="round"/><text class="n" x="175" y="168" text-anchor="middle" >스테빌라이저 바 (비틀림 스프링)</text><text class="n" x="36" y="188" text-anchor="start" >좌우 바퀴 높이 차이를 줄여 롤링 억제</text><text class="n" x="36" y="204" text-anchor="start" >한쪽 충격을 분산 · 차대 바운싱 방지 ✗</text><path d="M400,120Q500,100 600,120M400,112Q500,94 600,112M400,104Q500,88 600,104" fill="none" stroke="#222" stroke-width="3"/><rect class="o" x="486" y="130" width="28" height="14" fill="#9aa0a6" /><circle class="o" cx="400" cy="108" r="6" fill="#fff"/><circle class="o" cx="600" cy="108" r="6" fill="#fff"/><text class="n" x="400" y="96" text-anchor="middle" >스프링 아이</text><text class="n" x="500" y="160" text-anchor="middle" >U볼트·차축</text><text class="n" x="600" y="96" text-anchor="middle" >섀클</text><text class="n" x="386" y="184" text-anchor="start" >‘차축과 스프링이 일체형’ 설명은 틀림</text><text class="n" x="386" y="200" text-anchor="start" >(리프 스프링을 U볼트로 차축에 고정)</text><rect class="o" x="90" y="290" width="18" height="50" fill="#6e747b" rx="4"/><rect class="o" x="240" y="290" width="18" height="50" fill="#6e747b" rx="4"/><path d="M72,316L66,306M72,316L66,326M276,316L282,306M276,316L282,326" stroke="#c1121f" stroke-width="2.4" fill="none"/><text class="n" x="36" y="360" text-anchor="start" >바퀴 불균형·요철 → 바퀴가 좌우로 흔들려</text><text class="n" x="36" y="376" text-anchor="start" >스티어링 휠이 회전축 따라 진동 = 시미</text><rect class="o" x="450" y="290" width="150" height="40" rx="8" fill="#e6e4da"/><rect class="o" x="430" y="286" width="14" height="28" fill="#6e747b" /><rect class="o" x="606" y="286" width="14" height="28" fill="#6e747b" /><path d="M437,330L446,346M613,330L604,346" stroke="#c1121f" stroke-width="2.4"/><rect class="o" x="430" y="332" width="14" height="28" fill="#6e747b" /><rect class="o" x="606" y="332" width="14" height="28" fill="#6e747b" /><text class="n" x="386" y="372" text-anchor="start" >효과: 급선회 안정성·횡가속도 감소</text><text class="n" x="386" y="388" text-anchor="start" >‘반발력이 커서 조작성 증대’는 아님</text><text class="n" x="18" y="450">차고 유지가 불가능할 때 현가장치 점검 항목에 ‘타이로드 엔드 점검’은 해당하지 않는다(조향 부품).</text><text class="n" x="18" y="468">선회 중 독립 현가장치의 차대 균형을 제어하는 별도 부품은 스테빌라이저이다.</text></svg>