<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="파워 트랜지스터와 파워 MOSFET 비교, 밝기에 따라 저항이 줄어드는 광전도소자"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">반도체 소자: 파워 MOSFET · 광전도소자</text><rect x="20" y="50" width="330" height="200" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">파워 TR → 파워 MOSFET</text><rect class="o" x="40" y="86" width="130" height="30" fill="#fff" rx="5"/><text x="105.0" y="105.0" text-anchor="middle" style="font-weight:700">파워 TR</text><path d="M170,101H205" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="210" y="86" width="120" height="30" fill="#e8f0d8" rx="5"/><text x="270.0" y="105.0" text-anchor="middle" style="font-weight:700">파워 MOSFET</text><text x="40" y="140" text-anchor="start" >· 파워 TR보다 한 단계 진보한 소자</text><text x="40" y="160" text-anchor="start" >· 내부저항이 작아 전력 손실이 적다</text><text x="40" y="180" text-anchor="start" >· 큰 전류를 효율적으로 제어</text><text x="40" y="200" text-anchor="start" >· 답안은 ‘파워 MOSFET’ (FET만 쓰면 오답)</text><rect x="370" y="50" width="330" height="200" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">광전도소자 (조도센서)</text><path d="M400,220V100M400,220H660" fill="none" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><text class="n" x="402" y="94" text-anchor="start" >저항</text><text class="n" x="660" y="236" text-anchor="end" >밝기 →</text><path d="M410,112C440,170 500,205 650,212" fill="none" stroke="#1d4e89" stroke-width="3"/><text x="500" y="130" text-anchor="start" >밝을수록 저항 ↓</text><text x="500" y="150" text-anchor="start" >어두울수록 저항 ↑</text><rect class="o" x="20" y="266" width="680" height="70" fill="#fff" rx="8"/><text class="n" x="36" y="290" text-anchor="start" >오토 라이트·자동 방현 등의 조도센서에 쓰이는 소자는 광전도소자 (‘광도전 셀’로 쓰면 오답).</text><text class="n" x="36" y="312" text-anchor="start" >빛 → 저항 변화형 소자. 빛 → 전류 발생형인 포토다이오드와 구분한다.</text><text class="n" x="18" y="350">파워 MOSFET: 파워 TR보다 내부저항이 작고 큰 전류 제어에 유리하다.</text><text class="n" x="18" y="368">광전도소자: 빛이 밝으면 저항이 줄어드는 소자(조도센서).</text></svg>