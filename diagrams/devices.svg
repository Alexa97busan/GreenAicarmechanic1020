<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" width="720" height="398" role="img" aria-label="파워 트랜지스터와 파워 MOSFET 비교, 밝기에 따라 저항이 줄어드는 광전도소자"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="398" rx="12" fill="#F4F3EF"/><defs><linearGradient id="mt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ebec"/><stop offset=".5" stop-color="#c3c7ca"/><stop offset="1" stop-color="#9ea3a7"/></linearGradient><linearGradient id="mv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eceeef"/><stop offset="1" stop-color="#b4b9bd"/></linearGradient><linearGradient id="bk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a4f54"/><stop offset=".5" stop-color="#2b2f33"/><stop offset="1" stop-color="#1b1e21"/></linearGradient></defs><rect class="o" x="85" y="116" width="40" height="28" rx="3" fill="url(#mt)"/><circle cx="105" cy="126" r="5" fill="#f7f6f2" stroke="#222" stroke-width="1"/><rect class="o" x="85" y="144" width="40" height="34" rx="2" fill="url(#bk)"/><rect class="o" x="91" y="178" width="6" height="24" fill="#c9cdd0"/><rect class="o" x="105" y="178" width="6" height="24" fill="#c9cdd0"/><rect class="o" x="119" y="178" width="6" height="24" fill="#c9cdd0"/><rect class="o" x="236" y="112" width="58" height="34" rx="4" fill="url(#mt)"/><circle cx="265" cy="124" r="6" fill="#f7f6f2" stroke="#222"/><rect class="o" x="236" y="146" width="58" height="40" rx="3" fill="url(#bk)"/><rect class="o" x="243" y="186" width="7" height="26" fill="#c9cdd0"/><rect class="o" x="263" y="186" width="7" height="26" fill="#c9cdd0"/><rect class="o" x="283" y="186" width="7" height="26" fill="#c9cdd0"/><path d="M155,150H212" stroke="#555" stroke-width="2.4" marker-end="url(#a)"/><circle class="o" cx="630" cy="130" r="30" fill="#8a5a3a"/><circle cx="630" cy="130" r="26" fill="#d9b44a"/><path d="M608,118h44l-44,10h44l-44,10h44l-44,10h40" fill="none" stroke="#8a5a3a" stroke-width="3"/><path d="M620,160V200" fill="none" stroke="#222" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M620,160V200" fill="none" stroke="#9ea3a7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M640,160V200" fill="none" stroke="#222" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M640,160V200" fill="none" stroke="#9ea3a7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M560,86L574,98" stroke="#e8a317" stroke-width="2.6" marker-end="url(#a)"/><path d="M574,98L588,110" stroke="#e8a317" stroke-width="2.6" marker-end="url(#a)"/><path d="M588,110L602,122" stroke="#e8a317" stroke-width="2.6" marker-end="url(#a)"/><circle cx="552" cy="80" r="9" fill="#f6c85f" stroke="#222"/><path d="M410,92V232H690" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/><path d="M416,100C440,200 470,224 520,228C580,231 640,231 686,231" fill="none" stroke="#1d5fa8" stroke-width="3"/><text class="t" x="18" y="30">반도체 소자: 파워 MOSFET · 광전도소자</text><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">파워 TR → 파워 MOSFET</text><text x="105.0" y="105.0" text-anchor="middle" style="font-weight:700">파워 TR</text><text x="270.0" y="105.0" text-anchor="middle" style="font-weight:700">파워 MOSFET</text><text x="40" y="212" text-anchor="start" >· 파워 TR보다 한 단계 진보한 소자</text><text x="40" y="232" text-anchor="start" >· 내부저항이 작아 전력 손실이 적다</text><text x="40" y="252" text-anchor="start" >· 큰 전류를 효율적으로 제어</text><text x="40" y="272" text-anchor="start" >· 답안은 ‘파워 MOSFET’ (FET만 쓰면 오답)</text><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">광전도소자 (조도센서)</text><text class="n" x="402" y="94" text-anchor="start" >저항</text><text class="n" x="660" y="236" text-anchor="end" >밝기 →</text><text x="500" y="130" text-anchor="start" >밝을수록 저항 ↓</text><text x="500" y="150" text-anchor="start" >어두울수록 저항 ↑</text><text class="n" x="36" y="308" text-anchor="start" >오토 라이트·자동 방현 등의 조도센서에 쓰이는 소자는 광전도소자 (‘광도전 셀’로 쓰면 오답).</text><text class="n" x="36" y="330" text-anchor="start" >빛 → 저항 변화형 소자. 빛 → 전류 발생형인 포토다이오드와 구분한다.</text><text class="n" x="18" y="368">파워 MOSFET: 파워 TR보다 내부저항이 작고 큰 전류 제어에 유리하다.</text><text class="n" x="18" y="386">광전도소자: 빛이 밝으면 저항이 줄어드는 소자(조도센서).</text></svg>