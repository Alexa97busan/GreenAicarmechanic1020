<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="0에서 5볼트 범위의 MAP 센서 전압 파형 예시"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">MAP 센서 파형 측정</text><path d="M80,270H420M80,70V270" stroke="#222" stroke-width="1.6"/><text class="n" x="420" y="288" text-anchor="end" >시간 →</text><text class="n" x="84" y="56" text-anchor="start" >전압(V)</text><path d="M76,270.0H80" stroke="#222"/><path d="M80,270.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="274.0" text-anchor="end" >0V</text><path d="M76,230.0H80" stroke="#222"/><path d="M80,230.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="234.0" text-anchor="end" >1V</text><path d="M76,190.0H80" stroke="#222"/><path d="M80,190.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="194.0" text-anchor="end" >2V</text><path d="M76,150.0H80" stroke="#222"/><path d="M80,150.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="154.0" text-anchor="end" >3V</text><path d="M76,110.0H80" stroke="#222"/><path d="M80,110.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="114.0" text-anchor="end" >4V</text><path d="M76,70.0H80" stroke="#222"/><path d="M80,70.0H420" stroke="#ddd" stroke-dasharray="3 3"/><text class="n" x="72" y="74.0" text-anchor="end" >5V</text><path d="M80,210C150,210 160,150 200,150S250,220 290,220S340,130 420,130" fill="none" stroke="#1d4e89" stroke-width="3"/><text class="n" x="250" y="300" text-anchor="middle" >예시 파형: MAP 센서(아날로그, 5V 기준 전원)</text><rect x="450" y="70" width="250" height="200" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="575.0" y="90" text-anchor="middle" style="font-weight:700;fill:#222">측정 설정</text><text class="n" x="462" y="112" text-anchor="start" >· MAP 센서 파형 측정 시</text><text class="n" x="462" y="130" text-anchor="start" >  전압 축은 5V로 조정</text><text class="n" x="462" y="148" text-anchor="start" >· 5V 기준 전원을 쓰는</text><text class="n" x="462" y="166" text-anchor="start" >  아날로그 센서이므로</text><text class="n" x="462" y="184" text-anchor="start" >  0~5V 범위가 한 화면에</text><text class="n" x="462" y="202" text-anchor="start" >  들어오도록 설정</text><text class="n" x="18" y="388">MAP 센서는 흡기 매니폴드 압력(진공)을 전압으로 바꿔 ECU에 보내는 아날로그 센서이다.</text></svg>