<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="안티 스쿼트, 안티 다이브, 안티 롤링 제어"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">전자제어 현가장치(ECS)의 자세 제어</text><rect x="20" y="50" width="220" height="240" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="130" y="72" text-anchor="middle" style="font-weight:700">안티 스쿼트 제어</text><text class="n" x="130" y="90" text-anchor="middle" >급출발 → 노즈 업 방지</text><rect x="250" y="50" width="220" height="240" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360" y="72" text-anchor="middle" style="font-weight:700">안티 다이브 제어</text><text class="n" x="360" y="90" text-anchor="middle" >제동 → 앞쪽 내려앉음 방지</text><rect x="480" y="50" width="220" height="240" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="590" y="72" text-anchor="middle" style="font-weight:700">안티 롤링 제어</text><text class="n" x="590" y="90" text-anchor="middle" >급선회 → 차체 기울어짐 억제</text><g transform="translate(130,190) rotate(-6)"><rect class="o" x="-55" y="-34" width="110" height="26" rx="6" fill="#e6e4da"/><path class="o" d="M-28,-34L-14,-54H24L40,-34Z" fill="#d8d6cc"/><circle class="o" cx="-32" cy="0" r="11" fill="#6e747b"/><circle class="o" cx="32" cy="0" r="11" fill="#6e747b"/><rect x="50" y="-28" width="5" height="8" fill="#e0b25a"/></g><path d="M40,120L82,120" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="40" y="112" text-anchor="start" >가속</text><path d="M190,130L190,108" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="196" y="128" text-anchor="start" >앞 들림</text><path d="M60,205L60,232" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="34" y="250" text-anchor="start" >뒤 내려앉음</text><g transform="translate(360,190) rotate(6)"><rect class="o" x="-55" y="-34" width="110" height="26" rx="6" fill="#e6e4da"/><path class="o" d="M-28,-34L-14,-54H24L40,-34Z" fill="#d8d6cc"/><circle class="o" cx="-32" cy="0" r="11" fill="#6e747b"/><circle class="o" cx="32" cy="0" r="11" fill="#6e747b"/><rect x="50" y="-28" width="5" height="8" fill="#e0b25a"/></g><path d="M312,120L270,120" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="270" y="112" text-anchor="start" >제동</text><path d="M426,190L426,224" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="380" y="252" text-anchor="start" >앞 내려앉음</text><path d="M290,168L290,146" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><text class="n" x="264" y="184" text-anchor="start" >뒤 들림</text><g transform="translate(590,196) rotate(7)"><rect class="o" x="-32" y="-40" width="64" height="28" rx="5" fill="#e6e4da"/><rect class="o" x="-22" y="-60" width="44" height="22" rx="4" fill="#d8d6cc"/><rect class="o" x="-42" y="-14" width="11" height="26" rx="3" fill="#6e747b"/><rect class="o" x="31" y="-14" width="11" height="26" rx="3" fill="#6e747b"/></g><path d="M549.8,112.7A70,70 0 0 1 630.2,112.7" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><text class="n" x="590" y="258" text-anchor="middle" >선회 원심력 → 바깥쪽이 눌림</text><text x="130" y="280" text-anchor="middle" style="font-size:11px;fill:#e07a1f;font-weight:700">감쇠력을 높여(Hard) 자세 변화 억제</text><text x="360" y="280" text-anchor="middle" style="font-size:11px;fill:#e07a1f;font-weight:700">감쇠력을 높여(Hard) 자세 변화 억제</text><text x="590" y="280" text-anchor="middle" style="font-size:11px;fill:#e07a1f;font-weight:700">감쇠력을 높여(Hard) 자세 변화 억제</text><rect class="o" x="20" y="304" width="680" height="76" fill="#fff" rx="8"/><text x="36" y="326" text-anchor="start" style="font-weight:700">제어 원리</text><text class="n" x="36" y="346" text-anchor="start" >센서(스로틀·브레이크 스위치·조향각·G센서·차속) 신호 → ECS ECU → 액추에이터로 감쇠력(쇽업소버)·스프링 상수 제어</text><text class="n" x="36" y="364" text-anchor="start" >G센서(가속도 센서)는 차체의 롤을 감지한다. 안티 요잉 제어는 ECS의 제어 요소가 아니다(VDC 영역).</text><text class="n" x="18" y="410">안티 스쿼트 = 급출발 시 노즈 업 방지, 안티 다이브 = 제동 시 차체 앞쪽 내려앉음 방지(노즈 다이브는 '다이브'로 답한다).</text><text class="n" x="18" y="428">ECS의 제어: 안티 롤링·안티 다이브·안티 스쿼트·차속 감응·차고 조절 등.</text></svg>