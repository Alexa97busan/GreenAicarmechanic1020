<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="직렬 회로 전류 0.5A, 병렬과 직렬이 섞인 회로의 A점 전압강하 9.6V"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">직렬·병렬 회로 계산</text><rect x="20" y="50" width="680" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">① 직렬 회로 (12 V, 4 Ω · 8 Ω · 12 Ω)</text><path d="M50,106V134" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M60,112V128" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text class="n" x="42" y="124" text-anchor="end" style="font-weight:700">12V</text><path d="M60,120H80M80,120V100H100" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="100" y="89" width="60" height="22" fill="#f3dcc3" rx="3"/><text class="n" x="130.0" y="104" text-anchor="middle" style="font-weight:700">4 Ω</text><path d="M160,100H180" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="180" y="89" width="60" height="22" fill="#f3dcc3" rx="3"/><text class="n" x="210.0" y="104" text-anchor="middle" style="font-weight:700">8 Ω</text><path d="M240,100H260" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="260" y="89" width="60" height="22" fill="#f3dcc3" rx="3"/><text class="n" x="290.0" y="104" text-anchor="middle" style="font-weight:700">12 Ω</text><path d="M320,100H340V140H80V120" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="380" y="100" text-anchor="start" >합성 R = 4 + 8 + 12 = 24 Ω</text><text x="380" y="120" text-anchor="start" >I = V ÷ R = 12 ÷ 24 = 0.5 A</text><text x="380" y="140" text-anchor="start" >(직렬은 어디서나 전류가 같다)</text><rect x="20" y="204" width="680" height="160" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="224" text-anchor="middle" style="font-weight:700;fill:#222">② 병렬 + 직렬 (12 V, A점 병렬 4.8 Ω, B점 직렬 1.2 Ω)</text><path d="M50,276V304" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M60,282V298" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text class="n" x="42" y="294" text-anchor="end" style="font-weight:700">12V</text><path d="M60,290H80V270H100" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="100" y="256" width="110" height="28" fill="#d4e4f1" rx="4"/><text class="n" x="155" y="275" text-anchor="middle" style="font-weight:700">A : 병렬 4.8 Ω</text><path d="M210,270H230" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="230" y="259" width="70" height="22" fill="#f3dcc3" rx="3"/><text class="n" x="265.0" y="274" text-anchor="middle" style="font-weight:700">B 1.2 Ω</text><path d="M300,270H320V320H80V290" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="350" y="270" text-anchor="start" >합성 R = 4.8 + 1.2 = 6 Ω</text><text x="350" y="290" text-anchor="start" >I = 12 ÷ 6 = 2 A</text><text x="350" y="310" text-anchor="start" >A점 전압강하 = I × R_A = 2 × 4.8 = 9.6 V</text><text class="n" x="18" y="410">직렬: R = R₁ + R₂ + …  (전류 일정, 전압이 나뉨).  병렬: 전압이 같고 1/R = 1/R₁ + 1/R₂.</text><text class="n" x="18" y="428">전압강하 = 그 구간의 저항 × 회로 전류. 구간별 전압강하의 합은 전원 전압과 같다(9.6 + 2.4 = 12 V).</text></svg>