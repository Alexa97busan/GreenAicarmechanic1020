<path d="M121.0,290H219.0" fill="none" stroke="#222" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M121.0,290H219.0" fill="none" stroke="#9ea3a7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect class="o" x="135.0" y="280.0" width="70" height="20" rx="9" fill="#e6d4a2"/><rect x="145.0" y="280.0" width="4" height="20" fill="#8b4a1c"/><rect x="152.0" y="280.0" width="4" height="20" fill="#000"/><rect x="159.0" y="280.0" width="4" height="20" fill="#c1121f"/><rect x="166.0" y="280.0" width="4" height="20" fill="#d9b44a"/><path d="M121.0,326H219.0" fill="none" stroke="#222" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M121.0,326H219.0" fill="none" stroke="#9ea3a7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect class="o" x="135.0" y="316.0" width="70" height="20" rx="9" fill="#e6d4a2"/><rect x="145.0" y="316.0" width="4" height="20" fill="#8b4a1c"/><rect x="152.0" y="316.0" width="4" height="20" fill="#000"/><rect x="159.0" y="316.0" width="4" height="20" fill="#c1121f"/><rect x="166.0" y="316.0" width="4" height="20" fill="#d9b44a"/><path d="M236.0,270H324.0" fill="none" stroke="#222" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round"/><path d="M236.0,270H324.0" fill="none" stroke="#9ea3a7" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect class="o" x="250.0" y="260.0" width="60" height="20" rx="9" fill="#e6d4a2"/><rect x="260.0" y="260.0" width="4" height="20" fill="#8b4a1c"/><rect x="267.0" y="260.0" width="4" height="20" fill="#000"/><rect x="274.0" y="260.0" width="4" height="20" fill="#c1121f"/><rect x="281.0" y="260.0" width="4" height="20" fill="#d9b44a"/><path d="M230,270H250" fill="none" stroke="#222" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M230,270H250" fill="none" stroke="#444" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/><text class="t" x="18" y="30">직렬·병렬 회로 계산</text><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">① 직렬 회로 (12 V, 4 Ω · 8 Ω · 12 Ω)</text><text class="n" x="42" y="128" text-anchor="end" style="font-weight:700">12V</text><text class="n" x="130.0" y="84" text-anchor="middle" style="font-weight:700">4 Ω</text><text class="n" x="210.0" y="84" text-anchor="middle" style="font-weight:700">8 Ω</text><text class="n" x="290.0" y="84" text-anchor="middle" style="font-weight:700">12 Ω</text><text x="380" y="100" text-anchor="start" >합성 R = 4 + 8 + 12 = 24 Ω</text><text x="380" y="120" text-anchor="start" >I = V ÷ R = 12 ÷ 24 = 0.5 A</text><text x="380" y="140" text-anchor="start" >(직렬은 어디서나 전류가 같다)</text><text x="360.0" y="224" text-anchor="middle" style="font-weight:700;fill:#222">② 병렬 + 직렬 (12 V, A점 병렬 4.8 Ω, B점 직렬 1.2 Ω)</text><text class="n" x="42" y="296" text-anchor="end" style="font-weight:700">12V</text><text class="n" x="170" y="254" text-anchor="middle" style="font-weight:700">A : 병렬 4.8 Ω</text><text class="n" x="280" y="248" text-anchor="middle" style="font-weight:700">B 1.2 Ω</text><text x="350" y="270" text-anchor="start" >합성 R = 4.8 + 1.2 = 6 Ω</text><text x="350" y="290" text-anchor="start" >I = 12 ÷ 6 = 2 A</text><text x="350" y="310" text-anchor="start" >A점 전압강하 = I × R_A = 2 × 4.8 = 9.6 V</text><text class="n" x="18" y="410">직렬: R = R₁ + R₂ + …  (전류 일정, 전압이 나뉨).  병렬: 전압이 같고 1/R = 1/R₁ + 1/R₂.</text><text class="n" x="18" y="428">전압강하 = 그 구간의 저항 × 회로 전류. 구간별 전압강하의 합은 전원 전압과 같다(9.6 + 2.4 = 12 V).</text></svg>