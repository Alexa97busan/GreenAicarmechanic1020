<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="맥퍼슨 스트럿형과 더블 위시본형 앞 현가장치의 구조 비교"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="480" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">맥퍼슨형과 위시본형 현가장치 구조</text><rect x="20" y="50" width="330" height="310" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185" y="72" text-anchor="middle" style="font-weight:700">맥퍼슨 스트럿형</text><rect class="o" x="34" y="90" width="34" height="250" fill="#d8d6cc" /><text class="n" x="51" y="352" text-anchor="middle" >차체</text><rect x="370" y="50" width="330" height="310" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535" y="72" text-anchor="middle" style="font-weight:700">위시본형 (더블 위시본)</text><rect class="o" x="384" y="90" width="34" height="250" fill="#d8d6cc" /><text class="n" x="401" y="352" text-anchor="middle" >차체</text><rect class="o" x="68" y="112" width="52" height="8" fill="#8d949c" /><text class="n" x="94" y="106" text-anchor="middle" >스트럿 마운트</text><rect class="o" x="132" y="130" width="10" height="130" fill="#c2c6cc" rx="3"/><rect class="o" x="127" y="120" width="20" height="14" fill="#8d949c" /><path d="M137,140L143,142.5L131,147.5L143,152.5L131,157.5L143,162.5L131,167.5L143,172.5L131,177.5L143,182.5L131,187.5L143,192.5L131,197.5L137,200" fill="none" stroke="#222" stroke-width="1.3"/><path d="M149,140L155,142.5L143,147.5L155,152.5L143,157.5L155,162.5L143,167.5L155,172.5L143,177.5L155,182.5L143,187.5L155,192.5L143,197.5L149,200" fill="none" stroke="#222" stroke-width="1.3"/><rect class="o" x="128" y="200" width="18" height="80" fill="#9aa0a6" rx="3"/><rect class="o" x="120" y="276" width="36" height="40" fill="#c9c6bd" rx="3"/><text class="n" x="138" y="332" text-anchor="middle" >너클</text><rect class="o" x="168" y="210" width="30" height="150" rx="8" fill="#6e747b"/><path class="o" d="M68,300L68,320L132,312L132,298Z" fill="#b9bec4" /><text class="n" x="100" y="340" text-anchor="middle" >로어 암 (1개)</text><text class="n" x="216" y="150" text-anchor="start" >스트럿 =</text><text class="n" x="216" y="166" text-anchor="start" >쇽업소버 + 코일 스프링</text><text class="n" x="216" y="182" text-anchor="start" >일체형</text><path class="l" d="M214,156L150,170"/><text class="n" x="216" y="250" text-anchor="start" style="fill:#c1121f;font-weight:700">어퍼 암 없음</text><path class="o" d="M418,168L418,188L498,180Z" fill="#b9bec4" /><text class="n" x="458" y="160" text-anchor="middle" >어퍼 암 (V자)</text><path class="o" d="M418,290L418,312L498,300Z" fill="#b9bec4" /><text class="n" x="458" y="336" text-anchor="middle" >로어 암 (V자)</text><rect class="o" x="494" y="168" width="18" height="140" fill="#c9c6bd" rx="3"/><text class="n" x="503" y="322" text-anchor="middle" >너클</text><rect class="o" x="518" y="170" width="30" height="150" rx="8" fill="#6e747b"/><rect class="o" x="446" y="190" width="8" height="100" fill="#c2c6cc" rx="2"/><path d="M440,190L446,193.57142857142856L434,200.7142857142857L446,207.85714285714286L434,215.0L446,222.14285714285714L434,229.28571428571428L446,236.42857142857142L434,243.57142857142856L446,250.7142857142857L434,257.8571428571429L446,265.0L434,272.14285714285717L446,279.28571428571433L434,286.42857142857144L440,290" fill="none" stroke="#222" stroke-width="1.3"/><rect class="o" x="432" y="110" width="34" height="18" fill="#8d949c" /><text class="n" x="449" y="104" text-anchor="middle" >차체 마운트</text><path d="M449,128L449,190" stroke="#222" stroke-width="2"/><text class="n" x="566" y="150" text-anchor="start" >상·하단에 V자형</text><text class="n" x="566" y="166" text-anchor="start" >탄성 암을 조립</text><text class="n" x="566" y="250" text-anchor="start" >앞 현가장치에 널리 사용</text><rect class="o" x="20" y="372" width="330" height="52" fill="#fff" rx="6"/><text class="n" x="34" y="392" text-anchor="start" >위시본형 대비 부품 수가 적고 구조가 간단</text><text class="n" x="34" y="410" text-anchor="start" >엔진룸 공간 확보에 유리(비교적 넓다)</text><rect class="o" x="370" y="372" width="330" height="52" fill="#fff" rx="6"/><text class="n" x="384" y="392" text-anchor="start" >상하 암으로 휠 정렬(캠버 등) 설계 자유도가 크다</text><text class="n" x="384" y="410" text-anchor="start" >(맥퍼슨보다 부품이 많고 복잡)</text><text class="n" x="18" y="450">트레일링 암형은 앞바퀴 구동 형식의 ‘뒤’ 현가장치에 많이 사용한다(앞 현가장치가 아니다).</text><text class="n" x="18" y="468">독립 현가장치: 좌우 바퀴가 따로 움직여 스프링 아래 질량이 작고 접지력·승차감이 좋다.</text></svg>