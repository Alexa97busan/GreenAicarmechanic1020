<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="릴레이 코일 85-86 단자와 12V 0.125A로 코일 저항 96옴 계산"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">릴레이 코일 저항 (85–86)</text><rect x="20" y="50" width="400" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="220.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">릴레이의 구조와 단자</text><rect class="o" x="60" y="96" width="150" height="90" fill="#fff" rx="6"/><rect class="o" x="80" y="124" width="110" height="32" fill="#f3dcc3" rx="4"/><text x="135" y="145" text-anchor="middle" style="font-weight:700">코일</text><path d="M60,140H46" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="40" y="144" text-anchor="end" style="font-weight:700">85</text><path d="M210,140H224" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="230" y="144" text-anchor="start" style="font-weight:700">86</text><rect class="o" x="60" y="226" width="150" height="80" fill="#fff" rx="6"/><path d="M80,290V266L130,246" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><path d="M130,290V256" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><path d="M180,290V266" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text x="80" y="322" text-anchor="middle" style="font-weight:700">30</text><text x="130" y="322" text-anchor="middle" style="font-weight:700">87</text><text x="180" y="322" text-anchor="middle" style="font-weight:700">87a</text><text x="250" y="226" text-anchor="start" >85 · 86  : 코일 단자</text><text x="250" y="246" text-anchor="start" >30  : 공통(전원)</text><text x="250" y="266" text-anchor="start" >87  : 코일 ON 시 연결(부하)</text><text x="250" y="286" text-anchor="start" >87a : 코일 OFF 시 연결</text><rect x="440" y="50" width="260" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="570.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">코일 저항 구하기</text><path d="M480,126V154" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M490,132V148" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><text class="n" x="472" y="144" text-anchor="end" style="font-weight:700">12V</text><path d="M490,140H520V110H600V150H520V140" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect class="o" x="556" y="120" width="40" height="24" fill="#f3dcc3" rx="3"/><text class="n" x="586" y="108" text-anchor="middle" style="font-weight:700">0.125 A</text><text x="456" y="200" text-anchor="start" >R = V ÷ I</text><text x="456" y="224" text-anchor="start" >R = 12 ÷ 0.125 = 96 Ω</text><text x="456" y="248" text-anchor="start" ></text><text x="456" y="272" text-anchor="start" >(코일에 걸린 전압 12 V,</text><text x="456" y="296" text-anchor="start" > 흐르는 전류 0.125 A)</text><text class="n" x="18" y="370">85–86 사이 저항 = 코일 저항. 옴의 법칙 R = V ÷ I 로 구한다 → 96 Ω.</text><text class="n" x="18" y="388">코일 전류(작은 전류)로 접점(30–87)을 닫아 큰 전류를 스위칭한다.</text></svg>