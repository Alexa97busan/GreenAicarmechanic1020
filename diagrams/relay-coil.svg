0">코일</text><text x="40" y="144" text-anchor="end" style="font-weight:700">85</text><text x="230" y="144" text-anchor="start" style="font-weight:700">86</text><text x="80" y="322" text-anchor="middle" style="font-weight:700">30</text><text x="130" y="322" text-anchor="middle" style="font-weight:700">87</text><text x="180" y="322" text-anchor="middle" style="font-weight:700">87a</text><text x="250" y="226" text-anchor="start" >85 · 86  : 코일 단자</text><text x="250" y="246" text-anchor="start" >30  : 공통(전원)</text><text x="250" y="266" text-anchor="start" >87  : 코일 ON 시 연결(부하)</text><text x="250" y="286" text-anchor="start" >87a : 코일 OFF 시 연결</text><text x="570.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">코일 저항 구하기</text><text class="n" x="586" y="108" text-anchor="middle" style="font-weight:700">0.125 A</text><text x="456" y="200" text-anchor="start" >R = V ÷ I</text><text x="456" y="224" text-anchor="start" >R = 12 ÷ 0.125 = 96 Ω</text><text x="456" y="248" text-anchor="start" ></text><text x="456" y="272" text-anchor="start" >(코일에 걸린 전압 12 V,</text><text x="456" y="296" text-anchor="start" > 흐르는 전류 0.125 A)</text><text class="n" x="18" y="370">85–86 사이 저항 = 코일 저항. 옴의 법칙 R = V ÷ I 로 구한다 → 96 Ω.</text><text class="n" x="18" y="388">코일 전류(작은 전류)로 접점(30–87)을 닫아 큰 전류를 스위칭한다.</text></svg>