<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-label="크랭크각 캠각 스로틀 센서는 홀 방식 에어플로 센서는 핫필름 또는 칼만와류"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e8f0d8m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f8ed"/><stop offset="0.28" stop-color="#e8f0d8"/><stop offset="0.5" stop-color="#d8dfc9"/><stop offset="0.74" stop-color="#eff4e4"/><stop offset="1" stop-color="#bac0ad"/></linearGradient><linearGradient id="mat_f4e1ddm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf2f0"/><stop offset="0.28" stop-color="#f4e1dd"/><stop offset="0.5" stop-color="#e3d1ce"/><stop offset="0.74" stop-color="#f7eae7"/><stop offset="1" stop-color="#c3b4b1"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="390" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">홀 센서 방식과 AFS 구분</text><rect x="20" y="50" width="330" height="280" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">홀 센서 방식을 쓰는 센서</text><rect x="36.0" y="85.0" width="302.0" height="52.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="34" y="82" width="302" height="52" fill="url(#mat_e8f0d8m)" rx="6"/><rect x="34.0" y="82.0" width="302.0" height="52.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="35.5" y="83.5" width="299.0" height="21.84" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="46" y="104" text-anchor="start" style="font-weight:700">CKPS</text><text class="n" x="46" y="124" text-anchor="start" >크랭크각 센서(디지털 신호)</text><rect x="36.0" y="147.0" width="302.0" height="52.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="34" y="144" width="302" height="52" fill="url(#mat_e8f0d8m)" rx="6"/><rect x="34.0" y="144.0" width="302.0" height="52.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="35.5" y="145.5" width="299.0" height="21.84" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="46" y="166" text-anchor="start" style="font-weight:700">CMPS</text><text class="n" x="46" y="186" text-anchor="start" >캠각 센서 (1번 실린더 판별)</text><rect x="36.0" y="209.0" width="302.0" height="52.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="34" y="206" width="302" height="52" fill="url(#mat_e8f0d8m)" rx="6"/><rect x="34.0" y="206.0" width="302.0" height="52.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="35.5" y="207.5" width="299.0" height="21.84" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="46" y="228" text-anchor="start" style="font-weight:700">TPS</text><text class="n" x="46" y="248" text-anchor="start" >스로틀 포지션 센서(접점식 → 홀 방식)</text><text class="n" x="36" y="290" text-anchor="start" >홀 효과: 전류가 흐르는 반도체에 수직 자기장을</text><text class="n" x="36" y="308" text-anchor="start" >가하면 전류·자기장에 수직한 전위차가 생김</text><rect x="370" y="50" width="330" height="280" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">홀 센서 방식이 아닌 센서</text><rect x="386.0" y="85.0" width="302.0" height="74.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="384" y="82" width="302" height="74" fill="url(#mat_f4e1ddm)" rx="6"/><rect x="384.0" y="82.0" width="302.0" height="74.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="385.5" y="83.5" width="299.0" height="26" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="396" y="106" text-anchor="start" style="font-weight:700">AFS (공기 유량 센서)</text><text class="n" x="396" y="126" text-anchor="start" >핫 필름 방식 또는 칼만 와류 방식</text><text class="n" x="396" y="144" text-anchor="start" >(직접 계측 방식이며 맵 센서 방식은 간접)</text><rect class="o" x="384" y="170" width="302" height="74" fill="#fff" rx="6"/><text x="396" y="194" text-anchor="start" style="font-weight:700">크랭크각 센서의 다른 방식</text><text class="n" x="396" y="214" text-anchor="start" >인덕티브 방식, 광학식</text><text class="n" x="396" y="232" text-anchor="start" >(‘스피드덴시티 방식’은 없음)</text><text class="n" x="18" y="360">홀 센서를 쓰지 않는 것은 AFS. CKPS·CMPS·TPS는 홀 방식이 쓰인다.</text><text class="n" x="18" y="378">TPS는 접점식 가변저항에서 홀센서 방식으로 발전해 고장률이 줄었다.</text></svg>