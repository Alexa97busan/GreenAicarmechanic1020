<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">피드백 제어와 EMS</text><rect x="20" y="50" width="680" height="130" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">공연비 피드백 제어 루프</text><rect x="42.0" y="93.0" width="130.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="40" y="90" width="130" height="50" fill="url(#mat_d4e4f1m)" rx="6"/><rect x="40.0" y="90.0" width="130.0" height="50.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="41.5" y="91.5" width="127.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="105.0" y="113.0" text-anchor="middle" style="font-weight:700">산소센서</text><text class="n" x="105.0" y="128.0" text-anchor="middle" >(배기 산소 농도)</text><path d="M170,115H240" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="242.0" y="93.0" width="130.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="240" y="90" width="130" height="50" fill="url(#mat_f3dcc3p)" rx="6"/><rect x="241.5" y="91.5" width="127.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="305.0" y="113.0" text-anchor="middle" style="font-weight:700">ECU</text><text class="n" x="305.0" y="128.0" text-anchor="middle" >(분사량 보정)</text><path d="M370,115H440" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="442.0" y="93.0" width="130.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="440" y="90" width="130" height="50" fill="url(#mat_e6e4dam)" rx="6"/><rect x="440.0" y="90.0" width="130.0" height="50.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="441.5" y="91.5" width="127.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="505.0" y="113.0" text-anchor="middle" style="font-weight:700">인젝터</text><text class="n" x="505.0" y="128.0" text-anchor="middle" >(분사량 가감)</text><path d="M505,140V162H105V142" fill="none" stroke="#444" stroke-width="1.5" stroke-linejoin="round"/><text class="n" x="300" y="160" text-anchor="middle" >엔진 → 배기가스 → 다시 산소센서</text><rect x="20" y="196" width="440" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="240.0" y="216" text-anchor="middle" style="font-weight:700;fill:#222">피드백 제어를 정지하는 조건</text><rect class="o" x="36" y="226" width="408" height="30" fill="#fff" rx="5"/><text class="n" x="48" y="246" text-anchor="start" >· 냉각수 온도가 낮은 냉간 시동 시</text><rect class="o" x="36" y="264" width="408" height="30" fill="#fff" rx="5"/><text class="n" x="48" y="284" text-anchor="start" >· 엔진 시동 직후 분사량을 증량할 때</text><rect class="o" x="36" y="302" width="408" height="30" fill="#fff" rx="5"/><text class="n" x="48" y="322" text-anchor="start" >· 엔진의 출력을 증가시킬 때(고부하)</text><rect x="38.0" y="343.0" width="408.0" height="30.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="36" y="340" width="408" height="30" fill="url(#mat_e8f0d8m)" rx="5"/><rect x="36.0" y="340.0" width="408.0" height="30.0" rx="5" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="37.5" y="341.5" width="405.0" height="12.6" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="48" y="360" text-anchor="start" style="font-weight:700">✓ 연료 공급을 일시 차단할 때 (Fuel cut)</text><rect x="480" y="196" width="220" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="590.0" y="216" text-anchor="middle" style="font-weight:700;fill:#222">EMS의 장점</text><text x="494" y="240" text-anchor="start" >· 연비 향상</text><text x="494" y="261" text-anchor="start" >· 출력·운전 성능 향상</text><text x="494" y="282" text-anchor="start" >· 유해 배기가스 감소</text><text x="494" y="303" text-anchor="start" >· 에너지 효율 상승</text><text x="494" y="324" text-anchor="start" ></text><text x="494" y="345" text-anchor="start" >✗ 황사 억제 (관계 없음)</text><text class="n" x="18" y="410">피드백 정지 조건으로 ‘연료 공급을 일시 차단할 때’가 정답. 그 외 냉간·시동 직후·고출력도 정지 조건이다.</text><text class="n" x="18" y="428">EMS(엔진 관리 시스템)의 장점이 아닌 것: 황사 억제(보기에 따라 ‘연료 소비 향상’).</text></svg>