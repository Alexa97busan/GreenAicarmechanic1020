<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="온수식, PTC, 프리히터, 히트펌프 난방과 AQS의 내기 모드 전환"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
.fa{stroke-dasharray:6 5;animation:fa 1s linear infinite}@keyframes fa{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fl,.fa{animation:none}}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_f4e1ddm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf2f0"/><stop offset="0.28" stop-color="#f4e1dd"/><stop offset="0.5" stop-color="#e3d1ce"/><stop offset="0.74" stop-color="#f7eae7"/><stop offset="1" stop-color="#c3b4b1"/></linearGradient><linearGradient id="mat_e6e4dam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f3ee"/><stop offset="0.28" stop-color="#e6e4da"/><stop offset="0.5" stop-color="#d6d4cb"/><stop offset="0.74" stop-color="#eeece5"/><stop offset="1" stop-color="#b8b6ae"/></linearGradient><linearGradient id="mat_e07a1fp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edb27d"/><stop offset="0.5" stop-color="#e07a1f"/><stop offset="1" stop-color="#c1691b"/></linearGradient><linearGradient id="mat_f3dcc3p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8ebdc"/><stop offset="0.5" stop-color="#f3dcc3"/><stop offset="1" stop-color="#d1bda8"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">난방장치의 종류와 AQS</text><rect x="20" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">난방장치의 종류</text><rect class="o" x="34" y="82" width="302" height="42" fill="#fff" rx="5"/><text x="44" y="100" text-anchor="start" style="font-weight:700">온수식</text><text class="n" x="44" y="117" text-anchor="start" >엔진 냉각수를 히터 코어로</text><rect class="o" x="34" y="132" width="302" height="42" fill="#fff" rx="5"/><text x="44" y="150" text-anchor="start" style="font-weight:700">PTC 난방</text><text class="n" x="44" y="167" text-anchor="start" >PTC 소자로 공기를 가열</text><rect class="o" x="34" y="182" width="302" height="42" fill="#fff" rx="5"/><text x="44" y="200" text-anchor="start" style="font-weight:700">프리히터(가열플러그식)</text><text class="n" x="44" y="217" text-anchor="start" >냉각수 라인 내 설치, 히터코어로 가는 냉각수 온도를 높임</text><rect class="o" x="34" y="232" width="302" height="42" fill="#fff" rx="5"/><text x="44" y="250" text-anchor="start" style="font-weight:700">히트펌프</text><text class="n" x="44" y="267" text-anchor="start" >냉방 사이클을 역으로</text><rect x="36.0" y="285.0" width="302.0" height="42.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="34" y="282" width="302" height="42" fill="url(#mat_f4e1ddm)" rx="5"/><rect x="34.0" y="282.0" width="302.0" height="42.0" rx="5" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="35.5" y="283.5" width="299.0" height="17.64" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text x="44" y="300" text-anchor="start" style="font-weight:700">히터유닛 난방장치</text><text class="n" x="44" y="317" text-anchor="start" >난방 종류가 아님(틀린 보기)</text><rect x="370" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">AQS (공기 질 센서)</text><rect x="392.0" y="103.0" width="100.0" height="56.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="390" y="100" width="100" height="56" fill="url(#mat_e6e4dam)" rx="6"/><rect x="390.0" y="100.0" width="100.0" height="56.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="391.5" y="101.5" width="97.0" height="23.52" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="440" y="124" text-anchor="middle" >범퍼 안쪽</text><text class="n" x="440" y="140" text-anchor="middle" >응축기 부근</text><rect x="502.0" y="115.0" width="40.0" height="32.0" rx="4" fill="#000" opacity=".09"/><rect class="o" x="500" y="112" width="40" height="32" fill="url(#mat_e07a1fp)" rx="4"/><rect x="501.5" y="113.5" width="37.0" height="13.44" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="520" y="132" text-anchor="middle" style="fill:#fff;font-weight:700">AQS</text><path class="fa" d="M540,128H600" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="602.0" y="103.0" width="90.0" height="56.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="600" y="100" width="90" height="56" fill="url(#mat_f3dcc3p)" rx="6"/><rect x="601.5" y="101.5" width="87.0" height="23.52" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="645.0" y="126.0" text-anchor="middle" style="font-weight:700">내기 모드</text><text class="n" x="645.0" y="141.0" text-anchor="middle" >전환</text><text class="n" x="386" y="190" text-anchor="start" >감지 가스: NO·NOx·SO₂·CxHy·CO</text><text class="n" x="386" y="208" text-anchor="start" >유해가스 감지 → 내기 모드</text><text class="n" x="386" y="226" text-anchor="start" >외기가 청정하면 → 외기 모드</text><text class="n" x="386" y="244" text-anchor="start" >※ 유해물질을 ‘필터링’하는 장치가</text><text class="n" x="386" y="262" text-anchor="start" >   아니다(‘필터링한다’ = X)</text><text class="n" x="18" y="380">AQS가 오염 공기를 감지하면 외기 유입을 막기 위해 내기 순환 모드로 바꾼다.</text><text class="n" x="18" y="398">프리히터는 가열플러그식 난방장치로 냉각수 온도를 높여 히터 코어로 보낸다.</text></svg>