<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="공기 압축기, 언로더 밸브, 공기 탱크, 브레이크 밸브, 브레이크 챔버의 연결"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">공기 브레이크 계통</text><rect class="o" x="20" y="150" width="110" height="70" fill="#e6e4da" rx="6"/><text x="75.0" y="183.0" text-anchor="middle" style="font-weight:700">공기 압축기</text><text class="n" x="75.0" y="198.0" text-anchor="middle" >(엔진 구동)</text><rect class="o" x="180" y="150" width="120" height="70" fill="#d4e4f1" rx="6"/><text x="240.0" y="183.0" text-anchor="middle" style="font-weight:700">공기 탱크</text><text class="n" x="240.0" y="198.0" text-anchor="middle" >(압축공기 저장)</text><rect class="o" x="350" y="150" width="120" height="70" fill="#e6e4da" rx="6"/><text x="410.0" y="183.0" text-anchor="middle" style="font-weight:700">브레이크 밸브</text><text class="n" x="410.0" y="198.0" text-anchor="middle" >페달 밟은 양에 비례</text><rect class="o" x="520" y="150" width="130" height="70" fill="#e6e4da" rx="6"/><text x="585" y="176" text-anchor="middle" style="font-weight:700">브레이크 챔버</text><text class="n" x="585" y="194" text-anchor="middle" >(바퀴마다 1개)</text><rect class="o" x="640" y="177" width="56" height="8" fill="#9aa0a6" /><text class="n" x="668" y="200" text-anchor="middle" >푸시로드</text><path d="M130,185L180,185" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M130,185L180,185" fill="none" stroke="#7fb8e0" stroke-width="6" stroke-linejoin="round"/><path d="M300,185L350,185" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M300,185L350,185" fill="none" stroke="#7fb8e0" stroke-width="6" stroke-linejoin="round"/><path d="M470,185L520,185" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M470,185L520,185" fill="none" stroke="#7fb8e0" stroke-width="6" stroke-linejoin="round"/><polygon points="149,179 162,185 149,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><polygon points="319,179 332,185 319,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><polygon points="489,179 502,185 489,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><rect class="o" x="60" y="250" width="74" height="34" fill="#f3dcc3" rx="5"/><text class="n" x="97" y="272" text-anchor="middle" >언로더 밸브</text><path d="M97,250V220" stroke="#222" stroke-width="3"/><path d="M134,267H196V220" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3"/><text class="n" x="97" y="304" text-anchor="middle" >탱크 압력이 규정치에 달하면</text><text class="n" x="97" y="318" text-anchor="middle" >압축공기를 대기로 방출</text><rect class="o" x="396" y="60" width="30" height="70" fill="#c9c6bd" rx="3"/><text class="n" x="411" y="52" text-anchor="middle" >브레이크 페달</text><path d="M411,130V150" stroke="#222" stroke-width="3"/><text class="n" x="585" y="250" text-anchor="middle" >압축공기 압력 → 기계적 왕복운동</text><path d="M585,226V240" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text class="n" x="585" y="266" text-anchor="middle" >→ 캠을 돌려 브레이크 슈 확장</text><text class="n" x="18" y="350">언로더 밸브의 역할: 공기 압축기 및 기관의 과부하 방지(탱크 압력이 규정치에 도달하면 압축공기를 방출해 컴프레서 부하를 줄인다).</text><text class="n" x="18" y="368">공기 브레이크는 대형 차량의 주 제동장치이다(보조 브레이크는 엔진·배기·와전류 브레이크). 압력을 높이면 더 큰 제동력을 얻는다.</text></svg>