85" stroke-width="4"/><path d="M470,185L520,185" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M470,185L520,185" fill="none" stroke="#7fb8e0" stroke-width="6" stroke-linejoin="round"/><path class="fl" d="M470,185L520,185" stroke-width="4"/><polygon points="149,179 162,185 149,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><polygon points="319,179 332,185 319,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><polygon points="489,179 502,185 489,191" fill="#7fb8e0" stroke="#222" stroke-width="1"/><rect x="62.0" y="253.0" width="74.0" height="34.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="60" y="250" width="74" height="34" fill="url(#mat_f3dcc3p)" rx="5"/><rect x="61.5" y="251.5" width="71.0" height="14.28" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="97" y="272" text-anchor="middle" >언로더 밸브</text><path d="M97,250V220" stroke="#222" stroke-width="3"/><path d="M134,267H196V220" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3"/><text class="n" x="97" y="304" text-anchor="middle" >탱크 압력이 규정치에 달하면</text><text class="n" x="97" y="318" text-anchor="middle" >압축공기를 대기로 방출</text><rect class="o" x="396" y="60" width="30" height="70" fill="url(#mat_c9c6bdp)" rx="3"/><rect x="397.5" y="61.5" width="27.0" height="26" rx="3" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="411" y="52" text-anchor="middle" >브레이크 페달</text><path d="M411,130V150" stroke="#222" stroke-width="3"/><text class="n" x="585" y="250" text-anchor="middle" >압축공기 압력 → 기계적 왕복운동</text><path d="M585,226V240" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/><text class="n" x="585" y="266" text-anchor="middle" >→ 캠을 돌려 브레이크 슈 확장</text><text class="n" x="18" y="350">언로더 밸브의 역할: 공기 압축기 및 기관의 과부하 방지(탱크 압력이 규정치에 도달하면 압축공기를 방출해 컴프레서 부하를 줄인다).</text><text class="n" x="18" y="368">공기 브레이크는 대형 차량의 주 제동장치이다(보조 브레이크는 엔진·배기·와전류 브레이크). 압력을 높이면 더 큰 제동력을 얻는다.</text></svg>