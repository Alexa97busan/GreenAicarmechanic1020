<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 518" width="720" height="518" role="img" aria-label="임펠러, 터빈, 스테이터로 이루어진 토크 컨버터의 반단면도"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
.fa{stroke-dasharray:6 5;animation:fa 1s linear infinite}@keyframes fa{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fl,.fa{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="518" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">토크 컨버터 반단면 (3요소 1단 2상)</text><path d="M60,400H560" stroke="#888" stroke-dasharray="8 4 2 4" stroke-width="1" fill="none"/><text class="n" x="230" y="418">회전 중심선</text><circle cx="330" cy="260" r="88" fill="#e8f0f7"/><rect class="o" x="200" y="386" width="320" height="14" fill="#6e747b" /><rect class="o" x="300" y="372" width="220" height="14" fill="#c2c6cc" /><rect class="o" x="404" y="358" width="116" height="14" fill="#b5b9bf" /><rect class="o" x="150" y="372" width="47" height="28" fill="#8d949c" /><rect class="o" x="220" y="366" width="70" height="20" fill="#6e747b" /><rect class="o" x="306" y="352" width="48" height="20" fill="#d8d6cc" style="stroke:#e07a1f;stroke-width:2.6"/><path class="k" d="M312,372L317,352"/><path class="k" d="M320,372L325,352"/><path class="k" d="M328,372L333,352"/><path class="k" d="M336,372L341,352"/><path class="k" d="M344,372L349,352"/><rect class="o" x="306" y="326" width="48" height="26" fill="#e0b25a" /><path class="k" d="M306,352Q330,334 354,326"/><path class="k" d="M318,352Q336,340 354,336"/><path d="M330,172A88,88 0 0 0 302,343L276,366" fill="none" stroke="#6e747b" stroke-width="6"/><path d="M330,164A96,96 0 0 1 368,348L404,358" fill="none" stroke="#4a5057" stroke-width="7"/><path d="M330,164C262,164 197,186 197,250V372" fill="none" stroke="#4a5057" stroke-width="7"/><path class="k" d="M326.3,301.8L298.3,337.8" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M333.7,218.2L312.3,177.9" stroke="#4a5057" stroke-width="1.4"/><path class="k" d="M307.1,295.2L265.5,313.8" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M352.9,224.8L352.9,179.2" stroke="#4a5057" stroke-width="1.4"/><path class="k" d="M293.3,280.4L247.8,277.2" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M366.7,239.6L388.2,199.4" stroke="#4a5057" stroke-width="1.4"/><path class="k" d="M288.0,260.7L249.3,236.6" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M372.0,259.3L409.8,233.8" stroke="#4a5057" stroke-width="1.4"/><path class="k" d="M292.6,240.9L269.8,201.4" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M367.4,279.1L412.8,274.3" stroke="#4a5057" stroke-width="1.4"/><path class="k" d="M305.9,225.6L304.3,180.0" stroke="#6e747b" stroke-width="1.4"/><path class="k" d="M354.1,294.4L396.4,311.5" stroke="#4a5057" stroke-width="1.4"/><circle cx="330" cy="260" r="38" fill="none" stroke="#888" stroke-dasharray="4 3"/><rect class="o" x="178" y="196" width="8" height="104" fill="#aab" /><rect class="o" x="174" y="190" width="16" height="6" fill="#777" /><rect class="o" x="186" y="250" width="11" height="6" fill="#777" /><path class="fa" d="M352,198H308" stroke="#c1121f" stroke-width="1.8" fill="none" marker-end="url(#r)"/><path class="fa" d="M268,230V290" stroke="#c1121f" stroke-width="1.8" fill="none" marker-end="url(#r)"/><path class="fa" d="M308,316H352" stroke="#c1121f" stroke-width="1.8" fill="none" marker-end="url(#r)"/><path class="fa" d="M392,290V230" stroke="#c1121f" stroke-width="1.8" fill="none" marker-end="url(#r)"/><text x="18" y="150">드라이브 플레이트</text><path class="l" d="M176,146L182,215"/><circle class="d" cx="182" cy="215" r="2"/><text x="18" y="190">프런트 커버</text><path class="l" d="M176,186L197,232"/><circle class="d" cx="197" cy="232" r="2"/><text x="18" y="290">터빈 허브(스플라인)</text><path class="l" d="M176,286L255,376"/><circle class="d" cx="255" cy="376" r="2"/><text x="18" y="372">입력축(터빈 샤프트)</text><path class="l" d="M176,368L210,393"/><circle class="d" cx="210" cy="393" r="2"/><text x="18" y="410">파일럿 부</text><path class="l" d="M176,406L170,392"/><circle class="d" cx="170" cy="392" r="2"/><text x="540" y="236">오일 순환 방향</text><path class="l" d="M534,232L392,260"/><circle class="d" cx="392" cy="260" r="2"/><text x="540" y="288">스테이터</text><path class="l" d="M534,284L354,338"/><circle class="d" cx="354" cy="338" r="2"/><text x="540" y="330">원웨이 클러치</text><path class="l" d="M534,326L352,362"/><circle class="d" cx="352" cy="362" r="2"/><text x="540" y="372">펌프 허브(오일펌프 구동)</text><path class="l" d="M534,368L520,365"/><circle class="d" cx="520" cy="365" r="2"/><text x="540" y="410">스테이터 샤프트(고정)</text><path class="l" d="M534,406L540,379"/><circle class="d" cx="540" cy="379" r="2"/><text x="262" y="140">터빈(러너)</text><path class="l" d="M290,144L290,180"/><circle class="d" cx="290" cy="180" r="2"/><text x="340" y="140">임펠러(펌프)</text><path class="l" d="M372,144L396,200"/><circle class="d" cx="396" cy="200" r="2"/><rect class="o" x="442" y="40" width="270" height="90" rx="6" fill="#fff"/><text x="452" y="58" style="font-weight:700">스톨 테스트 판정 (은행 정답 기준)</text><text x="452" y="76" style="font-size:10.5px;">D·R 모두 낮다 → 엔진 출력 부족·토크컨버터 불량</text><text x="452" y="92" style="font-size:10.5px;">D·R 모두 높다 → 오일 부족·라인압 저하</text><text x="452" y="108" style="font-size:10.5px;fill:#e07a1f;font-weight:700">D만 높다 → 원웨이 클러치 이상</text><text x="452" y="124" style="font-size:10.5px;">R만 높다 → 프런트 클러치 이상</text><text class="n" x="540" y="346" style="fill:#e07a1f;font-weight:700">★ D 스톨 높으면 이상</text><text class="n" x="18" y="470">엔진 → 프런트 커버·임펠러 회전 → 오일이 터빈을 밀어 입력축으로 동력 전달. 터빈에서 돌아오는 오일을 스테이터가 방향 전환해 토크 증대(최대 약 2~2.5배).</text><text class="n" x="18" y="488">스테이터가 회전을 시작하는 클러치 포인트 이후에는 원웨이 클러치가 공회전해 유체 커플링으로 작동한다.</text><text class="n" x="18" y="506">스테이터는 원웨이 클러치로 지지된다(주황 테두리). 은행의 스톨 테스트 선긋기에서 D 레인지만 스톨 회전수가 높으면 원웨이 클러치 이상이다.</text></svg>