<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="오리피스 튜브와 어큐뮬레이터를 쓰는 CCOT, 냉매 흐름을 바꾸는 히트펌프"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
.fl{fill:none;stroke:#fff;stroke-opacity:.85;stroke-linecap:round;stroke-dasharray:.1 12;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12.1}}.fa{stroke-dasharray:6 5;animation:fa 1s linear infinite}@keyframes fa{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fl,.fa{animation:none}}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">CCOT 방식과 히트펌프</text><rect x="20" y="50" width="330" height="270" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">CCOT 방식 (오리피스 튜브)</text><rect class="o" x="40" y="90" width="80" height="36" fill="#f0d6d6" rx="6"/><text x="80.0" y="112.0" text-anchor="middle" style="font-weight:700">압축기</text><rect class="o" x="240" y="90" width="90" height="36" fill="#f3dcc3" rx="6"/><text x="285.0" y="112.0" text-anchor="middle" style="font-weight:700">응축기</text><rect class="o" x="240" y="200" width="90" height="36" fill="#e6e4da" rx="6"/><text x="285.0" y="222.0" text-anchor="middle" style="font-weight:700">오리피스 튜브</text><rect class="o" x="130" y="200" width="90" height="36" fill="#d4e4f1" rx="6"/><text x="175.0" y="222.0" text-anchor="middle" style="font-weight:700">증발기</text><rect class="o" x="40" y="200" width="80" height="36" fill="#d4e4f1" rx="6"/><text x="80.0" y="216.0" text-anchor="middle" style="font-weight:700">어큐뮬</text><text class="n" x="80.0" y="231.0" text-anchor="middle" >레이터</text><path d="M120,108L240,108" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M120,108L240,108" fill="none" stroke="#c1121f" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M120,108L240,108" stroke-width="2"/><path d="M285,126L285,200" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M285,126L285,200" fill="none" stroke="#e07a1f" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M285,126L285,200" stroke-width="2"/><path d="M240,218L220,218" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M240,218L220,218" fill="none" stroke="#7fb8e0" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M240,218L220,218" stroke-width="2"/><path d="M130,218L120,218" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M130,218L120,218" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M130,218L120,218" stroke-width="2"/><path d="M80,200L80,126" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M80,200L80,126" fill="none" stroke="#1d4e89" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M80,200L80,126" stroke-width="2"/><text class="n" x="34" y="260" text-anchor="start" >어큐뮬레이터: 증발기와 압축기 사이에서</text><text class="n" x="34" y="276" text-anchor="start" >압력을 저장하고 액체를 기체로 만든다</text><text class="n" x="34" y="292" text-anchor="start" >(TXV 방식의 리시버 드라이어는 고압측)</text><rect x="370" y="50" width="330" height="270" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">히트펌프 난방 (역사이클)</text><rect class="o" x="390" y="90" width="120" height="40" fill="#f3dcc3" rx="6"/><text x="450.0" y="114.0" text-anchor="middle" style="font-weight:700">실외 열교환기</text><rect class="o" x="560" y="90" width="120" height="40" fill="#d4e4f1" rx="6"/><text x="620.0" y="114.0" text-anchor="middle" style="font-weight:700">실내 열교환기</text><path class="fa" d="M510,100H560" stroke="#1d4e89" stroke-width="3" marker-end="url(#a)"/><path class="fa" d="M560,122H510" stroke="#c1121f" stroke-width="3" marker-end="url(#r)"/><text class="n" x="535" y="92" text-anchor="middle" style="fill:#1d4e89">냉방</text><text class="n" x="535" y="142" text-anchor="middle" style="fill:#c1121f">난방</text><text class="n" x="386" y="190" text-anchor="start" >냉방 사이클을 역으로 해 냉매 흐름을</text><text class="n" x="386" y="208" text-anchor="start" >전환하여 난방하는 방식 = 히트펌프 난방</text><text class="n" x="386" y="226" text-anchor="start" >외부 열을 흡수해 실내에 공급 →</text><text class="n" x="386" y="244" text-anchor="start" >전기 히터(PTC)보다 에너지 사용이 적다</text><text class="n" x="18" y="370">히트펌프: 전기 에너지 사용을 최소화하기 위해 냉매 흐름을 전환해 난방한다.</text><text class="n" x="18" y="388">CCOT 방식은 팽창밸브 대신 오리피스 튜브를 쓰고 증발기 뒤에 어큐뮬레이터를 둔다.</text></svg>