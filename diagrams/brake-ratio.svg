<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="네 바퀴 제동력의 합을 차량 중량으로 나눠 비율을 구하는 방법과 네 가지 계산 예"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e8e6ddm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f4f0"/><stop offset="0.28" stop-color="#e8e6dd"/><stop offset="0.5" stop-color="#d8d6ce"/><stop offset="0.74" stop-color="#efeee7"/><stop offset="1" stop-color="#bab8b1"/></linearGradient><linearGradient id="mat_444p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#939393"/><stop offset="0.5" stop-color="#444444"/><stop offset="1" stop-color="#3a3a3a"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">주차·전체 제동력 비율 계산</text><rect x="20" y="50" width="300" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="170.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">제동력 비율 = 제동력 합 ÷ 축중 합 × 100</text><rect x="122.0" y="103.0" width="100.0" height="200.0" rx="14" fill="#000" opacity=".09"/><rect class="o" x="120" y="100" width="100" height="200" fill="url(#mat_e8e6ddm)" rx="14"/><rect x="120.0" y="100.0" width="100.0" height="200.0" rx="14" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="121.5" y="101.5" width="97.0" height="26" rx="14" fill="url(#mat_gl)" pointer-events="none"/><rect class="o" x="80" y="110" width="24" height="56" fill="url(#mat_444p)" rx="4"/><rect x="81.5" y="111.5" width="21.0" height="23.52" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="92" y="184" text-anchor="middle" >앞좌</text><rect class="o" x="230" y="110" width="24" height="56" fill="url(#mat_444p)" rx="4"/><rect x="231.5" y="111.5" width="21.0" height="23.52" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="242" y="184" text-anchor="middle" >앞우</text><rect class="o" x="80" y="240" width="24" height="56" fill="url(#mat_444p)" rx="4"/><rect x="81.5" y="241.5" width="21.0" height="23.52" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="92" y="314" text-anchor="middle" >뒤좌</text><rect class="o" x="230" y="240" width="24" height="56" fill="url(#mat_444p)" rx="4"/><rect x="231.5" y="241.5" width="21.0" height="23.52" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="242" y="314" text-anchor="middle" >뒤우</text><text class="n" x="36" y="332" text-anchor="start" >주차 제동력은 보통 뒤 두 바퀴 값만 합한다</text><rect x="340" y="50" width="360" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="520.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">계산 예 (소수점 버림)</text><rect class="o" x="354" y="76" width="332" height="58" fill="#fff" rx="6"/><text class="n" x="364" y="96" text-anchor="start" >뒤좌 150, 뒤우 120 / 전축중 700, 후축중 450</text><text x="364" y="118" text-anchor="start" style="font-weight:700">(150+120) ÷ (700+450) × 100 = 23.47 → 23.4%</text><rect class="o" x="354" y="142" width="332" height="58" fill="#fff" rx="6"/><text class="n" x="364" y="162" text-anchor="start" >좌 130, 우 170 / 전축중 900, 후축중 600</text><text x="364" y="184" text-anchor="start" style="font-weight:700">(130+170) ÷ (900+600) × 100 = 20%</text><rect class="o" x="354" y="208" width="332" height="58" fill="#fff" rx="6"/><text class="n" x="364" y="228" text-anchor="start" >뒤좌 150, 뒤우 190 / 차량중량 950</text><text x="364" y="250" text-anchor="start" style="font-weight:700">(150+190) ÷ 950 × 100 = 35.78 → 35.7%</text><rect class="o" x="354" y="274" width="332" height="58" fill="#fff" rx="6"/><text class="n" x="364" y="294" text-anchor="start" >앞 130·170, 뒤 100·90 / 900 + 600</text><text x="364" y="316" text-anchor="start" style="font-weight:700">(130+170+100+90) ÷ 1500 × 100 = 32.67 → 32%</text><text class="n" x="18" y="380">‘소수 둘째 자리 이하 버림’이면 23.47 → 23.4, ‘소수점 이하 버림’이면 32.67 → 32 처럼 버림(반올림 아님).</text><text class="n" x="18" y="398">분모는 (전축중 + 후축중) = 차량 중량. 분자는 문제에 주어진 제동력들의 합이다.</text></svg>