<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="APS와 차속에 따른 변속선과 킥다운, 리프트 풋업"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">변속 패턴: 킥다운과 리프트 풋업</text><path d="M80,300H460M80,300V60" stroke="#222" stroke-width="1.6"/><text class="n" x="460" y="320" text-anchor="end" >차속 →</text><text class="n" x="74" y="66" text-anchor="end" >APS ↑</text><path d="M110,290C200,260 250,160 420,110" fill="none" stroke="#1d4e89" stroke-width="3"/><text class="n" x="300" y="118" text-anchor="middle" style="fill:#1d4e89;font-weight:700">변속선 (저단 ↔ 고단)</text><text class="n" x="120" y="270" text-anchor="start" >저단 영역</text><text class="n" x="450" y="290" text-anchor="end" >고단 영역</text><circle cx="240" cy="230" r="5" fill="#222"/><path d="M240,230V120" stroke="#c1121f" stroke-width="2.4" marker-end="url(#r)"/><text x="232" y="170" text-anchor="end" style="font-weight:700;fill:#c1121f">킥다운</text><text class="n" x="232" y="186" text-anchor="end" >APS 급증 → 고단→저단</text><circle cx="400" cy="100" r="5" fill="#222"/><path d="M400,100V230" stroke="#2f7f3f" stroke-width="2.4" marker-end="url(#r)"/><text x="330" y="252" text-anchor="end" style="font-weight:700;fill:#2f7f3f">리프트 풋업</text><text class="n" x="394" y="268" text-anchor="end" >APS가 차속에 비해 현저히 작음 → 저단→고단</text><rect x="490" y="60" width="210" height="240" rx="8" fill="#fff" stroke="#ccc"/><text x="595.0" y="80" text-anchor="middle" style="font-weight:700;fill:#e07a1f">시험 포인트</text><text class="n" x="502" y="106" text-anchor="start" >· 킥다운: 엑셀을 순간적으로</text><text class="n" x="502" y="124" text-anchor="start" >  많이 밟아 고단 → 저단</text><text class="n" x="502" y="142" text-anchor="start" ></text><text class="n" x="502" y="160" text-anchor="start" >· 리프트 풋업: 차속에 비해</text><text class="n" x="502" y="178" text-anchor="start" >  APS가 아주 작을 때</text><text class="n" x="502" y="196" text-anchor="start" >  저단 → 고단 변속</text><text class="n" x="502" y="214" text-anchor="start" ></text><text class="n" x="502" y="232" text-anchor="start" >· 스톨 테스트 등 학습·점검은</text><text class="n" x="502" y="250" text-anchor="start" >  TCM 입·출력 도식 참고</text><text class="n" x="18" y="350">APS(가속 페달 위치)와 차속의 조합으로 변속 시점이 정해진다.</text><text class="n" x="18" y="368">킥다운은 답이 ‘킥다운’, 리프트 풋업은 ‘리프트 풋업’으로 정확히 표기해야 한다.</text></svg>