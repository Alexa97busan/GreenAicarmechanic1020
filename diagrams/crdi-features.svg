<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">피에조 인젝터와 CRDI의 장점</text><rect x="20" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">피에조 인젝터</text><rect x="162.0" y="83.0" width="60.0" height="200.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="160" y="80" width="60" height="200" fill="url(#mat_d8d6ccm)" rx="6"/><rect x="160.0" y="80.0" width="60.0" height="200.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="161.5" y="81.5" width="57.0" height="26" rx="6" fill="url(#mat_gl)" pointer-events="none"/><rect class="o" x="176" y="96" width="28" height="60" fill="url(#mat_e0b25ap)" /><rect x="177.5" y="97.5" width="25.0" height="25.2" rx="0" fill="url(#mat_gl)" pointer-events="none"/><path d="M176,104H204" stroke="#222" stroke-width="1"/><path d="M176,112H204" stroke="#222" stroke-width="1"/><path d="M176,120H204" stroke="#222" stroke-width="1"/><path d="M176,128H204" stroke="#222" stroke-width="1"/><path d="M176,136H204" stroke="#222" stroke-width="1"/><path d="M176,144H204" stroke="#222" stroke-width="1"/><path d="M176,152H204" stroke="#222" stroke-width="1"/><rect class="o" x="184" y="160" width="12" height="90" fill="#9aa0a6" /><path class="o" d="M184,250L190,274L196,250Z" fill="#6e747b" /><text class="n" x="110" y="126" text-anchor="middle" >피에조 소자</text><path class="l" d="M146,124L176,126"/><text class="n" x="232" y="262" text-anchor="start" >니들</text><text class="n" x="34" y="304" text-anchor="start" >코일 대신 피에조 소자 → 빠른 응답·다단 분사</text><text class="n" x="34" y="320" text-anchor="start" >최대 약 1,800bar 분사압, 매연 저감</text><rect x="370" y="50" width="330" height="290" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">커먼레일(CRDI)의 장점</text><text x="386" y="90" text-anchor="start" style="fill:#2f7f3f">✓ 엔진 성능 향상</text><text x="386" y="116" text-anchor="start" style="fill:#2f7f3f">✓ 유해 배기가스 배출 감소</text><text x="386" y="142" text-anchor="start" style="fill:#2f7f3f">✓ 연료 소비율 향상(연비↑)</text><text x="386" y="168" text-anchor="start" style="fill:#2f7f3f">✓ 운전 성능 향상</text><text x="386" y="194" text-anchor="start" style="fill:#2f7f3f">✓ 콤팩트한 설계와 경량화</text><text class="n" x="386" y="232" text-anchor="start" style="fill:#c1121f">✗ 연료 소비가 증가된다 / 연료 소비의 향상(틀린 보기)</text><text class="n" x="386" y="250" text-anchor="start" style="fill:#c1121f">✗ 콤팩트한 설계와 중량화(‘경량화’가 맞음)</text><rect class="o" x="386" y="266" width="298" height="56" fill="#fff" rx="6"/><text class="n" x="396" y="286" text-anchor="start" >저압 펌프 점검: 점화 스위치 ON, 저압 연료가</text><text class="n" x="396" y="302" text-anchor="start" >규정 압력 이상에서 연료탱크로 오버플로</text><text class="n" x="18" y="380">CRDI·커먼레일의 장점 문제에서는 ‘연료 소비 증가’, ‘중량화’처럼 반대로 쓴 보기가 정답(틀린 것)이다.</text><text class="n" x="18" y="398">고압 펌프는 캠축 구동 방식과 타이밍 체인 구동 방식으로 구동된다.</text><g pointer-events="none"><rect class="o" x="176" y="60" width="28" height="22" rx="4" fill="url(#bk)" /><path d="M184,70h12" stroke="#c9a227" stroke-width="1.6"/><path d="M178,100h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,106h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,112h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,118h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,124h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,130h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,136h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,142h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><path d="M178,148h24" stroke="#7b8084" stroke-width="1.4" opacity=".7"/><rect class="o" x="172" y="252" width="36" height="14" rx="3" fill="#c3c7ca" /><path class="o