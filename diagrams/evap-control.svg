 cx="376" cy="233" r="3" fill="#8b7a55"/><circle cx="376" cy="245" r="3" fill="#8b7a55"/><circle cx="376" cy="257" r="3" fill="#8b7a55"/><text x="325" y="152" text-anchor="middle" style="font-weight:700">캐니스터 (활성탄이 HC 흡착)</text><path d="M390,205L460,205" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M390,205L460,205" fill="none" stroke="#e07a1f" stroke-width="6" stroke-linejoin="round"/><path class="fl" d="M390,205L460,205" stroke-width="4"/><polygon points="419,199 432,205 419,211" fill="#e07a1f" stroke="#222" stroke-width="1"/><rect class="o" x="460" y="183" width="70" height="44" fill="#d4e4f1" rx="6"/><text x="495.0" y="203.0" text-anchor="middle" style="font-weight:700">PCSV</text><text class="n" x="495.0" y="218.0" text-anchor="middle" >듀티율 제어</text><path d="M530,205L590,205" fill="none" stroke="#222" stroke-width="8" stroke-linejoin="round"/><path d="M530,205L590,205" fill="none" stroke="#e07a1f" stroke-width="6" stroke-linejoin="round"/><path class="fl" d="M530,205L590,205" stroke-width="4"/><polygon points="554,199 567,205 554,211" fill="#e07a1f" stroke="#222" stroke-width="1"/><rect class="o" x="590" y="150" width="110" height="110" fill="#d8d6cc" rx="6"/><text x="645.0" y="203.0" text-anchor="middle" style="font-weight:700">흡기 매니폴드</text><text class="n" x="645.0" y="218.0" text-anchor="middle" >연소로 처리</text><path d="M325,280V330" stroke="#222" stroke-width="5"/><path d="M325,320V284" stroke="#9cc6e6" stroke-width="3" marker-end="url(#a)"/><text class="n" x="325" y="350" text-anchor="middle" >대기(신선한 공기) 유입</text><rect class="o" x="300" y="48" width="130" height="36" fill="#fff" rx="6"/><text x="365.0" y="70.0" text-anchor="middle" style="font-weight:700">ECU</text><path d="M85,152V66H300" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><path d="M430,66H495V183" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><text class="n" x="440" y="60" text-anchor="start" >듀티 제어</text><text class="n" x="18" y="370">연료 증발가스(HC)를 캐니스터 활성탄에 흡착·저장했다가 PCSV(듀티율 제어)로 흡기 매니폴드에 보내 연소시킨다. EGR 제어와는 관계가 없다.</text><text class="n" x="18" y="388">PCSV 비작동: 공회전·시동 직후 일정 시간·공연비 피드백 미실시. 가압식 누출 감시: 탱크를 가압한 뒤 압력센서로 유지 여부를 판단.</text></svg>