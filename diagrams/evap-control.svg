.fl{fill:none;stroke:#fff;stroke-opacity:.85;stroke-linecap:round;stroke-dasharray:.1 12;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12.1}}@media (prefers-reduced-motion:reduce){.fl{animation:none}}
