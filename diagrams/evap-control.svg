<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="연료탱크에서 캐니스터와 PCSV를 거쳐 흡기 매니폴드로 가는 증발가스 제어 계통"><style>
