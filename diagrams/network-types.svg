<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="고속 CAN, LIN, MOST 통신의 구성과 특징 비교"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="420" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">차량 통신 구성 (CAN · LIN · MOST)</text><rect x="20" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="130" y="72" text-anchor="middle" style="font-weight:700">고속 CAN</text><rect x="250" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360" y="72" text-anchor="middle" style="font-weight:700">LIN</text><rect x="480" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="590" y="72" text-anchor="middle" style="font-weight:700">MOST</text><path d="M40,150H220" stroke="#e07a1f" stroke-width="3"/><path d="M40,190H220" stroke="#1d4e89" stroke-width="3"/><rect class="o" x="48" y="90" width="44" height="26" fill="#e6e4da" rx="4"/><text class="n" x="70" y="108" text-anchor="middle" >ECU</text><path d="M62,116V150M78,116V190" stroke="#222"/><rect class="o" x="108" y="90" width="44" height="26" fill="#e6e4da" rx="4"/><text class="n" x="130" y="108" text-anchor="middle" >ECU</text><path d="M122,116V150M138,116V190" stroke="#222"/><rect class="o" x="168" y="90" width="44" height="26" fill="#e6e4da" rx="4"/><text class="n" x="190" y="108" text-anchor="middle" >ECU</text><path d="M182,116V150M198,116V190" stroke="#222"/><path d="M40,150V160l5,3l-10,6l10,6l-10,6l5,3V190" fill="none" stroke="#222" stroke-width="1.4"/><path d="M220,150V160l5,3l-10,6l10,6l-10,6l5,3V190" fill="none" stroke="#222" stroke-width="1.4"/><text class="n" x="130" y="222" text-anchor="middle" >2선(High·Low) · 종단저항 120Ω</text><text class="n" x="130" y="240" text-anchor="middle" >다중 마스터 · ID 작을수록 우선</text><text class="n" x="130" y="258" text-anchor="middle" >파워트레인·안전 제어(고속 CAN)</text><text class="n" x="130" y="276" text-anchor="middle" >에어백 ECU·VDC·변속기 등</text><rect class="o" x="325" y="88" width="70" height="28" fill="#f3dcc3" rx="4"/><text class="n" x="360" y="107" text-anchor="middle" >마스터</text><path d="M360,116V150M270,150H450" stroke="#222" stroke-width="3" fill="none"/><path d="M290,150V170" stroke="#222" stroke-width="2"/><rect class="o" x="264" y="170" width="52" height="26" fill="#e6e4da" rx="4"/><text class="n" x="290" y="188" text-anchor="middle" >슬레이브</text><path d="M360,150V170" stroke="#222" stroke-width="2"/><rect class="o" x="334" y="170" width="52" height="26" fill="#e6e4da" rx="4"/><text class="n" x="360" y="188" text-anchor="middle" >슬레이브</text><path d="M430,150V170" stroke="#222" stroke-width="2"/><rect class="o" x="404" y="170" width="52" height="26" fill="#e6e4da" rx="4"/><text class="n" x="430" y="188" text-anchor="middle" >슬레이브</text><text class="n" x="360" y="222" text-anchor="middle" >1선(12V 기준) · 약 20kbps</text><text class="n" x="360" y="240" text-anchor="middle" >Single Master / Multi Slave</text><text class="n" x="360" y="258" text-anchor="middle" >저비용 · 바디 전장(윈도우·와이퍼 등)</text><text class="n" x="360" y="276" text-anchor="middle" >분기된 시스템에 사용</text><path d="M590,100L660,150L590,200L520,150Z" fill="none" stroke="#2f7f3f" stroke-width="3"/><rect class="o" x="562" y="88" width="56" height="24" fill="#e6e4da" rx="4"/><text class="n" x="590" y="104" text-anchor="middle" >헤드유닛</text><rect class="o" x="632" y="138" width="56" height="24" fill="#e6e4da" rx="4"/><text class="n" x="660" y="154" text-anchor="middle" >앰프</text><rect class="o" x="562" y="188" width="56" height="24" fill="#e6e4da" rx="4"/><text class="n" x="590" y="204" text-anchor="middle" >내비</text><rect class="o" x="492" y="138" width="56" height="24" fill="#e6e4da" rx="4"/><text class="n" x="520" y="154" text-anchor="middle" >모니터</text><text class="n" x="590" y="222" text-anchor="middle" >광섬유 링 구성 · 수십 Mbit/s</text><text class="n" x="590" y="240" text-anchor="middle" >고속 멀티미디어 통신</text><text class="n" x="590" y="258" text-anchor="middle" >MOST25·50·150 (Mbit/s 단위)</text><rect class="o" x="20" y="318" width="680" height="46" fill="#fff" rx="8"/><text class="n" x="36" y="338" text-anchor="start" >게이트웨이 모듈: 서로 다른 프로토콜·통신 속도의 네트워크를 연결해 데이터를 변환·교환한다.</text><text class="n" x="36" y="356" text-anchor="start" >차량 통신 장점: 배선의 경량화(중량화 ✗), 제어장치 간소화, 신뢰성·정비성 향상</text><text class="n" x="18" y="390">이모빌라이저·EMS 인증 통신은 K-line, 주행 안전 제어기는 고속 CAN(C-CAN), 편의장치는 LIN을 주로 쓴다.</text><text class="n" x="18" y="408">LIN은 Single Master / Multi Slave이다(‘multi master / single slave’는 틀림).</text></svg>