none" stroke="#222" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M430,152V170" fill="none" stroke="#7d4fb0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect class="o" x="402" y="170" width="56" height="34" rx="6" fill="#e5e8ea"/><circle class="o" cx="276" cy="195" r="0"/><ellipse cx="590" cy="154" rx="70" ry="50" fill="none" stroke="#222" stroke-width="7"/><ellipse cx="590" cy="154" rx="70" ry="50" fill="none" stroke="#e8a317" stroke-width="4.5"/><path d="M630,115L644,126L628,128Z" fill="#222"/><rect class="o" x="557" y="91" width="66" height="26" rx="6" fill="#f2f3f4"/><rect class="o" x="637" y="141" width="46" height="26" rx="6" fill="#f2f3f4"/><rect class="o" x="567" y="191" width="46" height="26" rx="6" fill="#f2f3f4"/><rect class="o" x="491" y="141" width="58" height="26" rx="6" fill="#f2f3f4"/><text class="t" x="18" y="30">차량 통신 구성 (CAN · LIN · MOST)</text><text x="130" y="72" text-anchor="middle" style="font-weight:700">고속 CAN</text><text x="360" y="72" text-anchor="middle" style="font-weight:700">LIN</text><text x="590" y="72" text-anchor="middle" style="font-weight:700">MOST</text><text class="n" x="70" y="108" text-anchor="middle" >ECU</text><text class="n" x="130" y="108" text-anchor="middle" >ECU</text><text class="n" x="190" y="108" text-anchor="middle" >ECU</text><text class="n" x="130" y="222" text-anchor="middle" >2선(High·Low) · 종단저항 120Ω</text><text class="n" x="130" y="240" text-anchor="middle" >다중 마스터 · ID 작을수록 우선</text><text class="n" x="130" y="258" text-anchor="middle" >파워트레인·안전 제어(고속 CAN)</text><text class="n" x="130" y="276" text-anchor="middle" >에어백 ECU·VDC·변속기 등</text><text class="n" x="360" y="107" text-anchor="middle" >마스터</text><text class="n" x="290" y="188" text-anchor="middle" >슬레이브</text><text class="n" x="360" y="188" text-anchor="middle" >슬레이브</text><text class="n" x="430" y="188" text-anchor="middle" >슬레이브</text><text class="n" x="360" y="222" text-anchor="middle" >1선(12V 기준) · 약 20kbps</text><text class="n" x="360" y="240" text-anchor="middle" >Single Master / Multi Slave</text><text class="n" x="360" y="258" text-anchor="middle" >저비용 · 바디 전장(윈도우·와이퍼 등)</text><text class="n" x="360" y="276" text-anchor="middle" >분기된 시스템에 사용</text><text class="n" x="590" y="104" text-anchor="middle" >헤드유닛</text><text class="n" x="660" y="154" text-anchor="middle" >앰프</text><text class="n" x="590" y="204" text-anchor="middle" >내비</text><text class="n" x="520" y="154" text-anchor="middle" >모니터</text><text class="n" x="590" y="238" text-anchor="middle" >광섬유 링 구성 · 수십 Mbit/s</text><text class="n" x="590" y="256" text-anchor="middle" >고속 멀티미디어 통신</text><text class="n" x="590" y="274" text-anchor="middle" >MOST25·50·150 (Mbit/s 단위)</text><text class="n" x="36" y="338" text-anchor="start" >게이트웨이 모듈: 서로 다른 프로토콜·통신 속도의 네트워크를 연결해 데이터를 변환·교환한다.</text><text class="n" x="36" y="356" text-anchor="start" >차량 통신 장점: 배선의 경량화(중량화 ✗), 제어장치 간소화, 신뢰성·정비성 향상</text><text class="n" x="18" y="390">이모빌라이저·EMS 인증 통신은 K-line, 주행 안전 제어기는 고속 CAN(C-CAN), 편의장치는 LIN을 주로 쓴다.</text><text class="n" x="18" y="408">LIN은 Single Master / Multi Slave이다(‘multi master / single slave’는 틀림).</text></svg>