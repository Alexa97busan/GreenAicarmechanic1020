<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="블로우바이 가스가 크랭크케이스에서 PCV 밸브를 거쳐 흡기로 돌아가는 경로"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}.b{font-weight:700}
.l{stroke:#444;stroke-width:1;fill:none}.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">블로우바이 가스와 PCV</text><rect class="o" x="40" y="90" width="180" height="120" rx="8" fill="#e6e4da"/><text x="130" y="110" text-anchor="middle" class="b">실린더·피스톤</text><text x="130" y="127" text-anchor="middle" class="n">피스톤과 실린더 틈으로</text><text x="130" y="144" text-anchor="middle" class="n">미연소 가스가 샘 =</text><text x="130" y="161" text-anchor="middle" class="n">블로우바이 가스</text><rect class="o" x="40" y="250" width="180" height="60" rx="8" fill="#f3e3b3"/><text x="130" y="270" text-anchor="middle" class="b">크랭크케이스</text><text x="130" y="287" text-anchor="middle" class="n">가스가 모임</text><path d="M130,210L130,248" class="l" marker-end="url(#a)"/><rect class="o" x="300" y="250" width="140" height="60" rx="8" fill="#fff"/><text x="370" y="270" text-anchor="middle" class="b">PCV 밸브</text><text x="370" y="287" text-anchor="middle" class="n">유량 조절</text><path d="M220,280L298,280" class="l" marker-end="url(#a)"/><rect class="o" x="300" y="90" width="140" height="60" rx="8" fill="#fff"/><text x="370" y="110" text-anchor="middle" class="b">브리더 호스</text><text x="370" y="127" text-anchor="middle" class="n">신선한 공기 유입</text><path d="M370,150L370,248" class="l" marker-end="url(#a)"/><rect class="o" x="520" y="170" width="160" height="90" rx="8" fill="#d9ead3"/><text x="600" y="190" text-anchor="middle" class="b">흡기 매니폴드</text><text x="600" y="207" text-anchor="middle" class="n">가스를 다시 연소시킴</text><path d="M440,280L560,262" class="l" marker-end="url(#a)"/><text class="n" x="18" y="392" style="font-size:12.5px;fill:#222">블로우바이 가스 = 피스톤·실린더 틈으로 크랭크케이스에 샌 가스 → PCV로 흡기에 되돌려 태웁니다</text><text class="n" x="18" y="411" style="font-size:12.5px;fill:#222">구성: PCV 밸브 · 브리더 호스 등   |   롤오버 밸브는 연료탱크 쪽 부품(구성품 아님)</text><text class="n" x="18" y="430" style="font-size:12.5px;fill:#222">"배기 매니폴드로 배출되는 가스"라는 설명은 틀린 표현</text></svg>