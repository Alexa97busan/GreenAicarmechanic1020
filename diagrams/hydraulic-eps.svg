<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="유량 제어식, 실린더 바이패스, 유압 반력 제어 방식의 구성"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">유압식 전자제어 동력 조향의 3방식</text><rect x="20" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="130.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">유량 제어식 EPS</text><rect x="250" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">실린더 바이패스 제어</text><rect x="480" y="50" width="220" height="250" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="590.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">유압 반력 제어</text><rect class="o" x="40" y="80" width="80" height="26" fill="#fff" rx="5"/><text class="n" x="80.0" y="97.0" text-anchor="middle" >차속센서</text><rect class="o" x="140" y="80" width="80" height="26" fill="#fff" rx="5"/><text class="n" x="180.0" y="97.0" text-anchor="middle" >ECU</text><path d="M120,93H140" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><path d="M180,106V130" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="130" y="130" width="90" height="26" fill="#f3dcc3" rx="5"/><text class="n" x="175.0" y="147.0" text-anchor="middle" >솔레노이드</text><path d="M130,143H86" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="40" y="130" width="46" height="26" fill="#e6e4da" rx="5"/><text class="n" x="63.0" y="147.0" text-anchor="middle" >펌프</text><path d="M63,156V190" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="40" y="190" width="90" height="26" fill="#d4e4f1" rx="5"/><text class="n" x="85.0" y="207.0" text-anchor="middle" >기어박스</text><text class="n" x="32" y="240" text-anchor="start" >고속: 펌프→기어박스</text><text class="n" x="32" y="256" text-anchor="start" >유량을 줄여 조향을</text><text class="n" x="32" y="272" text-anchor="start" >무겁게(안정) 한다</text><rect class="o" x="280" y="130" width="160" height="34" fill="#d4e4f1" rx="6"/><rect class="o" x="350" y="134" width="10" height="26" fill="#e07a1f" /><path d="M300,130V100H420V130" fill="none" stroke="#222" stroke-width="3"/><rect class="o" x="348" y="92" width="24" height="16" fill="#f3dcc3" /><text class="n" x="360" y="86" text-anchor="middle" >바이패스 밸브</text><text class="n" x="360" y="184" text-anchor="middle" >동력 실린더(양쪽 연결)</text><text class="n" x="262" y="210" text-anchor="start" >차속↑ → 밸브 개폐 면적</text><text class="n" x="262" y="226" text-anchor="start" >확대 → 작용 압력</text><text class="n" x="262" y="242" text-anchor="start" >감소(조향력 무겁게)</text><rect class="o" x="510" y="110" width="160" height="40" fill="#e6e4da" rx="6"/><rect class="o" x="580" y="118" width="16" height="24" fill="#e07a1f" /><text class="n" x="588" y="168" text-anchor="middle" >반력 플런저</text><rect class="o" x="500" y="180" width="80" height="24" fill="#fff" rx="5"/><text class="n" x="540.0" y="196.0" text-anchor="middle" >차속센서</text><rect class="o" x="600" y="180" width="80" height="24" fill="#f3dcc3" rx="5"/><text class="n" x="640.0" y="196.0" text-anchor="middle" >솔레노이드</text><path d="M580,192H600" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><text class="n" x="492" y="226" text-anchor="start" >차속에 따라 반력유압을</text><text class="n" x="492" y="242" text-anchor="start" >조절해 핸들 무게(감각)</text><text class="n" x="492" y="258" text-anchor="start" >를 제어한다</text><rect class="o" x="20" y="316" width="680" height="70" fill="#fff" rx="8"/><text class="n" x="36" y="338" text-anchor="start" >주행속도에 따라 다른 감도로 조향 = 감응형 유량제어 방식</text><text class="n" x="36" y="356" text-anchor="start" >동력 조향장치(기어박스+동력 실린더)가 아닌 것: 타이로드 방식</text><text class="n" x="36" y="374" text-anchor="start" >유압식 전자제어 종류가 아닌 것: 피칭·바운싱 제어 방식</text><text class="n" x="18" y="410">유압식 전자제어 동력 조향장치: 유량 제어식 EPS · 실린더 바이패스 제어 방식 · 유압 반력 제어 방식.</text><text class="n" x="18" y="428">전동식 조향은 모터 위치에 따라 컬럼·피니언·랙 구동식으로 나뉜다(링기어 구동식은 없다).</text></svg>