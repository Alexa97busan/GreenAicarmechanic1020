<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="삼원촉매의 활성 개시 온도 300도와 최적 작동 온도 400에서 800도"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">삼원촉매 온도: LOT 300℃와 작동온도</text><rect x="20" y="50" width="680" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">삼원촉매의 온도 영역</text><rect class="o" x="60" y="150" width="120" height="46" fill="#ecd9a0" /><rect class="o" x="180" y="150" width="40" height="46" fill="#dfe9c4" /><rect class="o" x="220" y="150" width="260" height="46" fill="#e8f0d8" /><rect class="o" x="480" y="150" width="180" height="46" fill="#f4e1dd" /><path d="M60,196V206" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="60" y="224" text-anchor="middle" >0</text><path d="M180,196V206" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="180" y="224" text-anchor="middle" >300℃</text><path d="M220,196V206" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="220" y="224" text-anchor="middle" >400℃</text><path d="M480,196V206" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="480" y="224" text-anchor="middle" >800℃</text><text class="n" x="120" y="178" text-anchor="middle" >정화 안 됨</text><text x="350" y="178" text-anchor="middle" style="font-weight:700">정화율 높음 · 수명 연장</text><text class="n" x="570" y="178" text-anchor="middle" >너무 높으면 열화</text><rect class="o" x="120" y="100" width="200" height="34" fill="#fff" rx="5"/><text class="n" x="220" y="122" text-anchor="middle" style="font-weight:700">활성 개시 온도(LOT) 약 300℃</text><path d="M180,134V150" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><rect class="o" x="340" y="100" width="260" height="34" fill="#fff" rx="5"/><text class="n" x="470" y="122" text-anchor="middle" style="font-weight:700">최적 작동 온도 약 400~800℃</text><path d="M350,134V150" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text x="60" y="270" text-anchor="start" >· 약 300℃ 부근에서 정화를 시작한다(LOT).</text><text x="60" y="292" text-anchor="start" >· 400~800℃에서 정화율이 높고 오래 간다.</text><text x="60" y="314" text-anchor="start" >· 너무 높으면 촉매가 열화된다.</text><text class="n" x="18" y="380">‘활성 개시 온도 = 300℃’, ‘정화율을 높이고 수명을 연장하는 작동온도 = 400~800℃’를 구분한다.</text><text class="n" x="18" y="398">정화 대상: HC·CO·NOx (PM은 대상 아님).</text></svg>