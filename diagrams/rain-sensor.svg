<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="레인센서의 발광, 수광 다이오드와 커플링 패드, 빛·일조량·강우량 감지와 제어"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">통합형 레인센서의 원리와 제어</text><path class="o" d="M120,112H600V134H120Z" fill="#d4e8ee" /><text class="n" x="612" y="128" text-anchor="start" >앞 유리</text><rect class="o" x="180" y="134" width="360" height="14" fill="#c9c6bd" /><text class="n" x="612" y="146" text-anchor="start" >커플링 패드(유리 밀착)</text><rect class="o" x="180" y="148" width="360" height="100" fill="#8d949c" rx="4"/><text class="n" x="360" y="240" text-anchor="middle" style="fill:#fff">레인 센서 하우징</text><rect class="o" x="236" y="196" width="40" height="26" fill="#e07a1f" rx="3"/><text class="n" x="256" y="214" text-anchor="middle" style="fill:#fff;font-weight:700">LED</text><rect class="o" x="444" y="196" width="40" height="26" fill="#1d4e89" rx="3"/><text class="n" x="464" y="214" text-anchor="middle" style="fill:#fff;font-weight:700">PD</text><path d="M256,196L360,112L464,196" fill="none" stroke="#c1121f" stroke-width="2.2" marker-end="url(#r)"/><path d="M360,112L420,60" fill="none" stroke="#777" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/><ellipse cx="360" cy="106" rx="16" ry="8" fill="#9cc6e6" stroke="#222"/><text x="430" y="58" text-anchor="start" >물방울에서 빛이 밖으로 새어 나감</text><text class="n" x="150" y="190" text-anchor="end" >발광 다이오드</text><path class="l" d="M154,186L234,206"/><text class="n" x="570" y="190" text-anchor="start" >수광 다이오드</text><path class="l" d="M566,186L486,206"/><text x="100" y="86" text-anchor="start" style="fill:#1d4e89;font-weight:700">물방울 있음 → 수광량 감소 → 와이퍼 작동 (강우량 감지)</text><rect class="o" x="20" y="290" width="95" height="42" fill="#fff" rx="6"/><text x="67" y="316" text-anchor="middle" >빛 감지</text><path d="M117,311H145" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect class="o" x="147" y="290" width="85" height="42" fill="#f3dcc3" rx="6"/><text x="189" y="316" text-anchor="middle" style="font-weight:700">라이트 제어</text><rect class="o" x="250" y="290" width="95" height="42" fill="#fff" rx="6"/><text x="297" y="316" text-anchor="middle" >일조량 감지</text><path d="M347,311H375" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect class="o" x="377" y="290" width="85" height="42" fill="#f3dcc3" rx="6"/><text x="419" y="316" text-anchor="middle" style="font-weight:700">공조 제어</text><rect class="o" x="480" y="290" width="95" height="42" fill="#fff" rx="6"/><text x="527" y="316" text-anchor="middle" >강우량 감지</text><path d="M577,311H605" stroke="#222" stroke-width="1.4" marker-end="url(#a)"/><rect class="o" x="607" y="290" width="85" height="42" fill="#f3dcc3" rx="6"/><text x="649" y="316" text-anchor="middle" style="font-weight:700">와이퍼 제어</text><text class="n" x="18" y="380">통합형 레인센서 구성품: 발광 다이오드·수광 다이오드·커플링 패드. (반사판·제너 다이오드는 구성품이 아니다)</text><text class="n" x="18" y="398">특수 감지 조건: 흙탕물(Splash)·기름(Smearing)·쓰레기(Dirt) 오염, 밤/낮 자동 감도 전환, 주변 조도 보정, 워셔 기능.</text></svg>