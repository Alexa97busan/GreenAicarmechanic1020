"/><path d="M390,190L430,130H690" fill="none" stroke="#222" stroke-width="6.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M390,190L430,130H690" fill="none" stroke="#c1121f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M690,130 l-10,-7v14z" fill="#c1121f" stroke="#222"/><path d="M390,190L430,250H690" fill="none" stroke="#222" stroke-width="6.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M390,190L430,250H690" fill="none" stroke="#c1121f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M690,250 l-10,-7v14z" fill="#c1121f" stroke="#222"/><rect class="o" x="330" y="110" width="60" height="160" rx="8" fill="url(#mt)"/><rect class="o" x="342" y="118" width="36" height="144" rx="4" fill="#e6e4da" stroke="#555"/><circle class="o" cx="360" cy="130" r="7" fill="#9ea3a7"/><path d="M355,130h10" stroke="#222" stroke-width="1.6"/><circle class="o" cx="360" cy="190" r="7" fill="#9ea3a7"/><path d="M355,190h10" stroke="#222" stroke-width="1.6"/><circle class="o" cx="360" cy="250" r="7" fill="#9ea3a7"/><path d="M355,250h10" stroke="#222" stroke-width="1.6"/><rect class="o" x="120" y="284" width="480" height="30" rx="6" fill="#e8f0d8"/><text class="t" x="18" y="30">키르히호프 제1법칙 (전류 법칙)</text><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">키르히호프 제1법칙: 들어오는 전류의 합 = 나가는 전류의 합</text><text class="n" x="360" y="104" text-anchor="middle" style="font-weight:700">접속점</text><text x="150" y="98" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₁ = 1 A</text><text x="150" y="178" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₃ = 3 A</text><text x="150" y="258" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₄ = 4 A</text><text x="520" y="118" text-anchor="start" style="font-weight:700;fill:#c1121f">I₂ = 2 A</text><text x="520" y="238" text-anchor="start" style="font-weight:700;fill:#c1121f">I₅ = ?</text><text x="360" y="303" text-anchor="middle" style="font-weight:700">I₁ + I₃ + I₄ = I₂ + I₅  →  1 + 3 + 4 = 2 + I₅  →  I₅ = 6 A</text><text class="n" x="18" y="350">답안 표기: 사이트 키는 ‘1A+3A+4A=2A+6A’ 형태로도 출제된 적이 있다(값은 I₅ = 6 A).</text><text class="n" x="18" y="368">들어오는 전류는 파랑, 나가는 전류는 빨강으로 묶어 양변을 따로 더한다.</text></svg>