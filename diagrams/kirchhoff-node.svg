<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="한 접속점에서 1A 3A 4A가 들어오고 2A와 I5가 나가는 회로"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">키르히호프 제1법칙 (전류 법칙)</text><rect x="20" y="50" width="680" height="270" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">키르히호프 제1법칙: 들어오는 전류의 합 = 나가는 전류의 합</text><circle class="o" cx="360" cy="190" r="26" fill="#f3dcc3"/><text class="n" x="360" y="195" text-anchor="middle" style="font-weight:700">접속점</text><path d="M110,110H220L340,190" fill="none" stroke="#1d4e89" stroke-width="3" marker-end="url(#a)"/><text x="120" y="102" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₁ = 1 A</text><path d="M110,190H220L340,190" fill="none" stroke="#1d4e89" stroke-width="3" marker-end="url(#a)"/><text x="120" y="182" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₃ = 3 A</text><path d="M110,270H220L340,190" fill="none" stroke="#1d4e89" stroke-width="3" marker-end="url(#a)"/><text x="120" y="262" text-anchor="start" style="font-weight:700;fill:#1d4e89">I₄ = 4 A</text><path d="M380,190L500,130H610" fill="none" stroke="#c1121f" stroke-width="3" marker-end="url(#r)"/><text x="520" y="122" text-anchor="start" style="font-weight:700;fill:#c1121f">I₂ = 2 A</text><path d="M380,190L500,250H610" fill="none" stroke="#c1121f" stroke-width="3" marker-end="url(#r)"/><text x="520" y="242" text-anchor="start" style="font-weight:700;fill:#c1121f">I₅ = ?</text><rect class="o" x="120" y="282" width="480" height="32" fill="#e8f0d8" rx="6"/><text x="360" y="303" text-anchor="middle" style="font-weight:700">I₁ + I₃ + I₄ = I₂ + I₅  →  1 + 3 + 4 = 2 + I₅  →  I₅ = 6 A</text><text class="n" x="18" y="350">답안 표기: 사이트 키는 ‘1A+3A+4A=2A+6A’ 형태로도 출제된 적이 있다(값은 I₅ = 6 A).</text><text class="n" x="18" y="368">들어오는 전류는 파랑, 나가는 전류는 빨강으로 묶어 양변을 따로 더한다.</text></svg>