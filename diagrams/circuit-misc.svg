<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="선간 전압 점검, 압력 계산, 파워 MOSFET, 광전도 소자"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_f3dcc3p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8ebdc"/><stop offset="0.5" stop-color="#f3dcc3"/><stop offset="1" stop-color="#d1bda8"/></linearGradient><linearGradient id="mat_d4e4f1m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecf3f9"/><stop offset="0.28" stop-color="#d4e4f1"/><stop offset="0.5" stop-color="#c5d4e0"/><stop offset="0.74" stop-color="#e1ecf5"/><stop offset="1" stop-color="#aab6c1"/></linearGradient><radialGradient id="mat_f3dcc3r" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#faf1e7"/><stop offset=".55" stop-color="#f3dcc3"/><stop offset="1" stop-color="#b6a592"/></radialGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">회로 점검·압력 계산·반도체 소자</text><rect x="20" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">선간 전압(전압강하) 점검</text><rect x="370" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">압력 계산 P = F ÷ A</text><rect x="20" y="230" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="250" text-anchor="middle" style="font-weight:700;fill:#222">파워 MOSFET</text><rect x="370" y="230" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="250" text-anchor="middle" style="font-weight:700;fill:#222">광전도 소자(CdS)</text><path d="M50,110H110M190,110H300" stroke="#222" stroke-width="2"/><rect x="112.0" y="101.0" width="80.0" height="24.0" rx="3" fill="#000" opacity=".09"/><rect class="o" x="110" y="98" width="80" height="24" rx="3" fill="url(#mat_f3dcc3p)"/><rect x="111.5" y="99.5" width="77.0" height="10.08" rx="3" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="150" y="114" text-anchor="middle" >접촉저항</text><circle cx="110" cy="110" r="3" fill="#222"/><circle cx="190" cy="110" r="3" fill="#222"/><text class="n" x="150" y="150" text-anchor="middle" style="font-weight:700;fill:#e07a1f">a ↔ b 선간 전압 ≤ 0.2V</text><text class="n" x="36" y="176" text-anchor="start" >옴미터는 전원이 차단된 회로에서 사용</text><text class="n" x="36" y="192" text-anchor="start" >통전 중 불필요한 저항은 전압강하로 점검</text><text class="n" x="386" y="92" text-anchor="start" >100N, 직경 4cm: A = 3.14×2² = 12.56㎠</text><text class="n" x="386" y="110" text-anchor="start" >→ P = 100÷12.56 ≈ 7.96 N/㎠</text><text class="n" x="386" y="128" text-anchor="start" ></text><text class="n" x="386" y="146" text-anchor="start" >150N, 직경 6cm: A = 3.14×3² = 28.26㎠</text><text class="n" x="386" y="164" text-anchor="start" >→ P = 150÷28.26 ≈ 5.3 N/㎠</text><rect x="62.0" y="273.0" width="70.0" height="44.0" rx="4" fill="#000" opacity=".09"/><rect class="o" x="60" y="270" width="70" height="44" fill="url(#mat_d4e4f1m)" rx="4"/><rect x="60.0" y="270.0" width="70.0" height="44.0" rx="4" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="61.5" y="271.5" width="67.0" height="18.48" rx="4" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="95" y="297" text-anchor="middle" >MOSFET</text><path d="M130,292H190" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><text class="n" x="150" y="284" text-anchor="middle" >큰 전류</text><text class="n" x="200" y="276" text-anchor="start" >파워 TR보다 한 단계 진보</text><text class="n" x="200" y="292" text-anchor="start" >내부저항↓ → 전력 손실↓</text><text class="n" x="200" y="308" text-anchor="start" >큰 전류 제어 가능</text><circle class="o" cx="420" cy="300" r="22" fill="url(#mat_f3dcc3r)"/><path d="M406,300H434M420,286V314" stroke="#222" stroke-width="1"/><path d="M390,260L408,282M404,256L416,278" stroke="#e0b25a" stroke-width="3"/><text class="n" x="466" y="280" text-anchor="start" >밝으면 저항 ↓</text><text class="n" x="466" y="297" text-anchor="start" >어두우면 저항 ↑</text><text class="n" x="466" y="314" text-anchor="start" >→ 조도(광량) 센서</text><text class="n" x="386" y="346" text-anchor="start" >조도(lx) = 광도(cd) ÷ 거리²: 18000÷3² = 2000lx</text><text class="n" x="18" y="410">선간 전압이 규정(0.2V 이하)보다 크면 그 구간에 불필요한 저항이 있다는 뜻이다.</text><text class="n" x="18" y="428">압력 = 힘 ÷ 면적. 면적은 원의 면적 π×반지름²(π=3.14)로 구한다.</text><g pointer-events="none"><rect class="o" x="66" y="254" width="40" height="12" rx="2" fill="url(#mt)" /><rect class="o" x="66" y="268" width="0" height="0" rx="0" fill="#000" /><rect class="o" x="70" y="314" width="6" height="16" rx="1" fill="#c3c7ca" /><rect class="o" x="82" y="314" width="6" height="16" rx="1" fill="#c3c7ca" /><rect class="o" x="94" y="314" width="6" height="16" rx="1" fill="#c3c7ca" /><path d="M408,292l8,-6l8,12l8,-12l8,12" fill="none" stroke="#8a5a1c" stroke-width="1.6"/></g></svg>