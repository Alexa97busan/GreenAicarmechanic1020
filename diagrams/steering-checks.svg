<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="프리로드 점검, 스티어링각 점검, 스티어링 휠 탈거, 유압 라인 오일 수준 점검"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">조향장치 점검 요점 4가지</text><rect x="20" y="50" width="330" height="156" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">프리로드 점검</text><text x="34" y="96" text-anchor="start" >조향바퀴가 닿지 않게 들어 올린다</text><text x="34" y="118" text-anchor="start" >스프링 저울을 핸들에 묶는다</text><text x="34" y="140" text-anchor="start" >저울을 당겨 회전 직전의 값 확인</text><text x="34" y="162" text-anchor="start" >※ 중립에서 측정 (끝까지 돌림 ✗)</text><rect x="370" y="50" width="330" height="156" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">스티어링각 점검</text><text x="384" y="96" text-anchor="start" >앞바퀴를 회전 게이지 위에 올린다</text><text x="384" y="118" text-anchor="start" >공차 상태에서 보통 40° 이내</text><text x="384" y="140" text-anchor="start" >제조사별 표준치가 다르다</text><text x="384" y="162" text-anchor="start" >규정값과 다르면 토(toe) 조정 (캠버 ✗)</text><rect x="20" y="222" width="330" height="156" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="242" text-anchor="middle" style="font-weight:700;fill:#222">스티어링 휠 탈거</text><text x="34" y="268" text-anchor="start" >에어백 잠금 볼트·핀을 먼저 푼다</text><text x="34" y="290" text-anchor="start" >에어백·경음기 모듈을 가볍게 분리</text><text x="34" y="312" text-anchor="start" >커넥터를 탈거한 뒤 휠 너트 제거</text><text x="34" y="334" text-anchor="start" >※ 잠금 볼트를 그대로 두면 ✗</text><rect x="370" y="222" width="330" height="156" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="242" text-anchor="middle" style="font-weight:700;fill:#222">유압 라인 오일 수준</text><text x="384" y="268" text-anchor="start" >엔진 정지 시와 작동 시 레벨 비교</text><text x="384" y="290" text-anchor="start" >5 mm 이상 차이 → 공기 유입</text><text x="384" y="312" text-anchor="start" >에어 빼기를 실시한다</text><text x="384" y="334" text-anchor="start" >(공기는 압축되어 레벨이 변한다)</text><text class="n" x="18" y="410">프리로드는 중립 위치에서, 스티어링각 불일치는 토 이상, 휠 탈거는 에어백 잠금 볼트를 풀고 진행한다.</text><text class="n" x="18" y="428">각 항목에서 ‘옳지 않은 것’으로 출제되는 문장은 ※ 표시한 반대 설명이다.</text></svg>