<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-label="스톨 테스트 시험 방법과 결과별 대표 원인"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e6e4dam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f3ee"/><stop offset="0.28" stop-color="#e6e4da"/><stop offset="0.5" stop-color="#d6d4cb"/><stop offset="0.74" stop-color="#eeece5"/><stop offset="1" stop-color="#b8b6ae"/></linearGradient><linearGradient id="mat_f3dcc3p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8ebdc"/><stop offset="0.5" stop-color="#f3dcc3"/><stop offset="1" stop-color="#d1bda8"/></linearGradient><radialGradient id="mat_6e747br" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c5c7ca"/><stop offset=".55" stop-color="#6e747b"/><stop offset="1" stop-color="#52575c"/></radialGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="490" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">스톨 테스트 방법과 판정</text><rect x="20" y="50" width="330" height="330" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185" y="72" text-anchor="middle" style="font-weight:700">시험 방법</text><path d="M40,181H330" stroke="#888" stroke-width="2"/><g transform="translate(185,170) rotate(0)"><rect x="-53.0" y="-31.0" width="110.0" height="26.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="-55" y="-34" width="110" height="26" rx="6" fill="url(#mat_e6e4dam)"/><rect x="-55.0" y="-34.0" width="110.0" height="26.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="-53.5" y="-32.5" width="107.0" height="10.92" rx="6" fill="url(#mat_gl)" pointer-events="none"/><path class="o" d="M-28,-34L-14,-54H24L40,-34Z" fill="#d8d6cc"/><circle class="o" cx="-32" cy="0" r="11" fill="url(#mat_6e747br)"/><circle class="o" cx="32" cy="0" r="11" fill="url(#mat_6e747br)"/><rect x="50" y="-28" width="5" height="8" fill="#e0b25a"/></g><path class="o" d="M88,181H106V166Z" fill="#e0b25a" /><path class="o" d="M262,181H244V166Z" fill="#e0b25a" /><text class="n" x="60" y="198" text-anchor="start" >고임목</text><text class="n" x="262" y="198" text-anchor="start" >고임목</text><circle class="o" cx="285" cy="110" r="26" fill="#fff"/><path d="M285,110L304,92" stroke="#c1121f" stroke-width="2.4"/><circle cx="285" cy="110" r="3" fill="#222"/><text class="n" x="285" y="152" text-anchor="middle" >최대 rpm 측정</text><text x="36" y="226" text-anchor="start" style="font-size:12px">① 앞뒤 바퀴 양쪽에 고임목, 주차 브레이크 당김</text><text x="36" y="246" text-anchor="start" style="font-size:12px">② 브레이크 페달을 강하게 밟는다(살짝 ✗)</text><text x="36" y="266" text-anchor="start" style="font-size:12px">③ 변속 레버를 D (또는 R)에 놓는다</text><text x="36" y="286" text-anchor="start" style="font-size:12px">④ 가속 페달을 완전히 밟은 상태에서 엔진</text><text x="36" y="306" text-anchor="start" style="font-size:12px">    최대 회전수(rpm)를 측정한다</text><text class="n" x="36" y="326" text-anchor="start" >목적: 토크 컨버터 작동 및 클러치·브레이크 유지 성능 파악</text><text class="n" x="36" y="346" text-anchor="start" >(변속기 최고 회전수 측정이 목적이 아니다)</text><rect x="370" y="50" width="330" height="330" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535" y="72" text-anchor="middle" style="font-weight:700">결과 → 대표 원인</text><rect class="o" x="384" y="88" width="302" height="60" fill="#fff" rx="6"/><text x="396" y="112" text-anchor="start" style="font-weight:700">D·R 모두 낮다</text><text class="n" x="396" y="134" text-anchor="start" >→ 엔진 출력 부족 또는 토크 컨버터 불량</text><rect class="o" x="384" y="160" width="302" height="60" fill="#fff" rx="6"/><text x="396" y="184" text-anchor="start" style="font-weight:700">D·R 모두 높다</text><text class="n" x="396" y="206" text-anchor="start" >→ 변속기 오일 부족 또는 라인압 저하</text><rect x="386.0" y="235.0" width="302.0" height="60.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="384" y="232" width="302" height="60" fill="url(#mat_f3dcc3p)" rx="6"/><rect x="385.5" y="233.5" width="299.0" height="25.2" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="396" y="256" text-anchor="start" style="font-weight:700">D 레인지만 높다</text><text class="n" x="396" y="278" text-anchor="start" >→ 원웨이 클러치 이상</text><text x="676" y="256" text-anchor="end" style="fill:#e07a1f">★</text><rect class="o" x="384" y="304" width="302" height="60" fill="#fff" rx="6"/><text x="396" y="328" text-anchor="start" style="font-weight:700">R 레인지만 높다</text><text class="n" x="396" y="350" text-anchor="start" >→ 프런트 클러치 이상</text><rect class="o" x="20" y="396" width="680" height="36" fill="#fff" rx="6"/><text class="n" x="36" y="419" text-anchor="start" >‘D 레인지에서 높은 스톨 회전수’의 원인으로 틀린 것: 프런트 클러치 이상 (R 레인지의 원인)</text><text class="n" x="18" y="460">스톨 테스트: 변속 레버를 D·R에 놓고 가속 페달을 완전히 밟았을 때의 엔진 최대 회전수로 변속기 상태를 점검한다.</text><text class="n" x="18" y="478">선긋기 정답 기준: D·R 낮다=엔진·컨버터, D·R 높다=오일·라인압, D만 높다=원웨이 클러치, R만 높다=프런트 클러치.</text><g pointer-events="none"><circle class="o" cx="285" cy="110" r="22" fill="#f7f6f2"/><path d="M270.9,124.1L273.7,121.3" stroke="#444" stroke-width="1.2"/><path d="M266.5,117.7L270.2,116.1" stroke="#444" stroke-width="1.2"/><path d="M265.0,110.0L269.0,110.0" stroke="#444" stroke-width="1.2"/><path d="M266.5,102.3L270.2,103.9" stroke="#444" stroke-width="1.2"/><path d="M270.9,95.9L273.7,98.7" stroke="#444" stroke-width="1.2"/><path d="M277.3,91.5L278.9,95.2" stroke="#444" stroke-width="1.2"/><path d="M285.0,90.0L285.0,94.0" stroke="#444" stroke-width="1.2"/><path d="M292.7,91.5L291.1,95.2" stroke="#444" stroke-width="1.2"/><path d="M299.1,95.9L296.3,98.7" stroke="#444" stroke-width="1.2"/><path d="M303.5,102.3L299.8,103.9" stroke="#444" stroke-width="1.2"/><path d="M305.0,110.0L301.0,110.0" stroke="#444" stroke-width="1.2"/><path d="M303.5,117.7L299.8,116.1" stroke="#444" stroke-width="1.2"/><path d="M299.1,124.1L296.3,121.3" stroke="#444" stroke-width="1.2"/><path d="M285,110L298,98" stroke="#c1121f" stroke-width="2.2"/><circle class="o" cx="285" cy="110" r="3" fill="#444"/></g></svg>