82H200" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><text class="n" x="165" y="176" text-anchor="middle" >펄스</text><text x="36" y="236" text-anchor="start" >· 2개 홀 센서로 모터 회전수·방향 검출</text><text x="36" y="255" text-anchor="start" >· 회전수로 창문 위치를 기억</text><text x="36" y="274" text-anchor="start" >· 끼임을 감지하면 반대로 하강</text><text x="36" y="293" text-anchor="start" ></text><text x="36" y="312" text-anchor="start" >배터리가 방전·탈거되면 위치 데이터가</text><text x="36" y="331" text-anchor="start" >지워지므로 전원 연결 후 반드시 초기화</text><rect x="38.0" y="349.0" width="298.0" height="26.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="36" y="346" width="298" height="26" fill="url(#mat_f4e1ddm)" rx="5"/><rect x="36.0" y="346.0" width="298.0" height="26.0" rx="5" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="37.5" y="347.5" width="295.0" height="10.92" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="185" y="364" text-anchor="middle" style="font-weight:700;fill:#c1121f">✗ “초기화가 필요 없다” = 틀린 설명</text><rect x="370" y="50" width="330" height="160" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">와이퍼 파킹 스위치</text><circle class="o" cx="430" cy="130" r="22" fill="url(#mat_e6e4dar)"/><text class="n" x="430" y="134" text-anchor="middle" >모터</text><rect class="o" x="470" y="118" width="80" height="24" fill="#fff" rx="3"/><text class="n" x="510" y="134" text-anchor="middle" style="font-weight:700">파킹 스위치</text><text x="384" y="180" text-anchor="start" >와이퍼가 정위치에 오면 전원을 끊어</text><text x="384" y="198" text-anchor="start" >그 자리에 멈추게 한다 (오토 스톱 ✗)</text><rect x="370" y="226" width="330" height="154" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="246" text-anchor="middle" style="font-weight:700;fill:#222">리어 윈도우 열선</text><rect class="o" x="386" y="256" width="298" height="44" fill="#fff" rx="6"/><text x="535" y="284" text-anchor="middle" style="font-weight:700">IBU 제어 → 약 20분 ON 후 자동 OFF</text><text x="386" y="322" text-anchor="start" >서리·김을 제거하는 열선</text><text x="386" y="340" text-anchor="start" >타이머로 자동 차단해 과열·배터리 방전 방지</text><text class="n" x="18" y="410">홀 센서 방식도 배터리가 방전되면 데이터가 사라진다 → 초기화(리셋) 작업이 필요하다.</text><text class="n" x="18" y="428">와이퍼 정위치 정지 = 파킹 스위치, 리어 윈도우 열선 = 약 20분 후 자동 OFF.</text></svg>