<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="R-134a와 R-1234yf의 분류, 지구온난화지수, 가연성 비교"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">자동차 냉매 비교 (R-134a · R-1234yf)</text><rect x="20" y="50" width="330" height="190" rx="8" fill="#e6e4da" stroke="#bbb"/><text x="185" y="76" text-anchor="middle" style="font-weight:700;font-size:15px">R-134a (신냉매)</text><path d="M34,116H336" stroke="#ccc"/><text class="n" x="36" y="110" text-anchor="start" >분류</text><text x="336" y="110" text-anchor="end" style="font-weight:700">HFC (불화탄화수소)</text><path d="M34,150H336" stroke="#ccc"/><text class="n" x="36" y="144" text-anchor="start" >지구온난화지수(GWP)</text><text x="336" y="144" text-anchor="end" style="font-weight:700">1,430</text><path d="M34,184H336" stroke="#ccc"/><text class="n" x="36" y="178" text-anchor="start" >오존층파괴지수(ODP)</text><text x="336" y="178" text-anchor="end" style="font-weight:700">0</text><path d="M34,218H336" stroke="#ccc"/><text class="n" x="36" y="212" text-anchor="start" >가연성</text><text x="336" y="212" text-anchor="end" style="font-weight:700">불연성</text><rect x="370" y="50" width="330" height="190" rx="8" fill="#e8f0d8" stroke="#bbb"/><text x="535" y="76" text-anchor="middle" style="font-weight:700;font-size:15px">R-1234yf (친환경 냉매)</text><path d="M384,116H686" stroke="#ccc"/><text class="n" x="386" y="110" text-anchor="start" >분류</text><text x="686" y="110" text-anchor="end" style="font-weight:700">HFO (탄화불화올레핀)</text><path d="M384,150H686" stroke="#ccc"/><text class="n" x="386" y="144" text-anchor="start" >지구온난화지수(GWP)</text><text x="686" y="144" text-anchor="end" style="font-weight:700">4</text><path d="M384,184H686" stroke="#ccc"/><text class="n" x="386" y="178" text-anchor="start" >오존층파괴지수(ODP)</text><text x="686" y="178" text-anchor="end" style="font-weight:700">0</text><path d="M384,218H686" stroke="#ccc"/><text class="n" x="386" y="212" text-anchor="start" >가연성</text><text x="686" y="212" text-anchor="end" style="font-weight:700">약 가연성 · 폭발성·독성 없음</text><text x="20" y="268" text-anchor="start" style="font-weight:700">지구온난화지수(GWP) 비교</text><rect class="o" x="20" y="282" width="500" height="22" fill="#c1121f" /><text x="528" y="298" text-anchor="start" >R-134a: 1,430</text><rect class="o" x="20" y="316" width="4" height="22" fill="#2f7f3f" /><text x="32" y="332" text-anchor="start" >R-1234yf: 4</text><text class="n" x="20" y="356" text-anchor="start" >(막대 길이는 GWP에 비례)</text><rect class="o" x="370" y="330" width="330" height="44" fill="#fff" rx="6"/><text class="n" x="385" y="350" text-anchor="start" >누설 탐지: 냉동 오일과 함께 형광액 약 5ml 주입</text><text class="n" x="385" y="366" text-anchor="start" >→ 냉매 충전·시운전 후 자외선 램프로 누설 부위 확인</text><text class="n" x="18" y="410">R-134a는 R-12를 대체한 신냉매이며 GWP 1,430, R-1234yf는 GWP 4로 지구온난화 영향이 훨씬 작다(ODP는 둘 다 0).</text><text class="n" x="18" y="428">R-1234yf는 탄화불화올레핀(HFO) 계열의 약 가연성 물질이지만 폭발성과 독성이 없는 친환경 냉매이다.</text></svg>