<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">CAN 데이터 프레임과 중재</text><text x="20" y="56" text-anchor="start" style="font-weight:700">데이터 프레임 (제어기가 보낼 데이터를 이 형태로 변환해 bus에 전송)</text><rect x="22.0" y="69.0" width="40.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="20" y="66" width="40" height="36" fill="url(#mat_e6e4dam)" /><rect x="20.0" y="66.0" width="40.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="21.5" y="67.5" width="37.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="40.0" y="89" text-anchor="middle" >SOF</text><rect x="62.0" y="69.0" width="130.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="60" y="66" width="130" height="36" fill="url(#mat_d4e4f1m)" /><rect x="60.0" y="66.0" width="130.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="61.5" y="67.5" width="127.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="125.0" y="89" text-anchor="middle" >ID (중재 필드)</text><rect x="192.0" y="69.0" width="60.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="190" y="66" width="60" height="36" fill="url(#mat_e6e4dam)" /><rect x="190.0" y="66.0" width="60.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="191.5" y="67.5" width="57.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="220.0" y="89" text-anchor="middle" >제어</text><rect x="252.0" y="69.0" width="150.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="250" y="66" width="150" height="36" fill="url(#mat_e6e4dam)" /><rect x="250.0" y="66.0" width="150.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="251.5" y="67.5" width="147.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="325.0" y="89" text-anchor="middle" >데이터 (0~8바이트)</text><rect x="402.0" y="69.0" width="60.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="400" y="66" width="60" height="36" fill="url(#mat_e6e4dam)" /><rect x="400.0" y="66.0" width="60.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="401.5" y="67.5" width="57.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="430.0" y="89" text-anchor="middle" >CRC</text><rect x="462.0" y="69.0" width="50.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="460" y="66" width="50" height="36" fill="url(#mat_e6e4dam)" /><rect x="460.0" y="66.0" width="50.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="461.5" y="67.5" width="47.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="485.0" y="89" text-anchor="middle" >ACK</text><rect x="512.0" y="69.0" width="50.0" height="36.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="510" y="66" width="50" height="36" fill="url(#mat_e6e4dam)" /><rect x="510.0" y="66.0" width="50.0" height="36.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="511.5" y="67.5" width="47.0" height="15.12" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="535.0" y="89" text-anchor="middle" >EOF</text><text class="n" x="20" y="128" text-anchor="start" >중재(우선순위 결정): 동시에 보내면 ID를 한 비트씩 비교하며,</text><text class="n" x="20" y="144" text-anchor="start" >0(우성)이 1(열성)을 이긴다 → ID 값이 작을수록 우선</text><text x="20" y="184" text-anchor="start" style="font-weight:700">노드 A</text><rect class="o" x="120" y="160" width="52" height="34" fill="#fff" /><text x="146" y="183" text-anchor="middle" style="font-weight:700">0</text><rect class="o" x="180" y="160" width="52" height="34" fill="#fff" /><text x="206" y="183" text-anchor="middle" style="font-weight:700">1</text><rect class="o" x="240" y="160" width="52" height="34" fill="#fff" /><text x="266" y="183" text-anchor="middle" style="font-weight:700">1</text><rect class="o" x="300" y="160" width="52" height="34" fill="#fff" /><text x="326" y="183" text-anchor="middle" style="font-weight:700">0</text><rect class="o" x="360" y="160" width="52" height="34" fill="#fff" /><text x="386" y="183" text-anchor="middle" style="font-weight:700">0</text><rect class="o" x="420" y="160" width="52" height="34" fill="#fff" /><text x="446" y="183" text-anchor="middle" style="font-weight:700">1</text><text x="20" y="230" text-anchor="start" style="font-weight:700">노드 B</text><rect class="o" x="120" y="206" width="52" height="34" fill="#fff" /><text x="146" y="229" text-anchor="middle" style="font-weight:700">0</text><rect class="o" x="180" y="206" width="52" height="34" fill="#fff" /><text x="206" y="229" text-anchor="middle" style="font-weight:700">1</text><rect class="o" x="240" y="206" width="52" height="34" fill="#fff" /><text x="266" y="229" text-anchor="middle" style="font-weight:700">1</text><rect class="o" x="300" y="206" width="52" height="34" fill="#fff" /><text x="326" y="229" text-anchor="middle" style="font-weight:700">0</text><rect x="362.0" y="209.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="360" y="206" width="52" height="34" fill="url(#mat_f4e1ddm)" /><rect x="360.0" y="206.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="361.5" y="207.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="386" y="229" text-anchor="middle" style="font-weight:700">1</text><rect class="o" x="420" y="206" width="52" height="34" fill="#fff" /><text x="446" y="229" text-anchor="middle" style="font-weight:700">0</text><text x="20" y="270" text-anchor="start" style="font-weight:700;fill:#1d4e89">버스</text><rect x="122.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="120" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="120.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="121.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="146" y="269" text-anchor="middle" style="font-weight:700">0</text><rect x="182.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="180" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="180.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="181.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="206" y="269" text-anchor="middle" style="font-weight:700">1</text><rect x="242.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="240" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="240.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="241.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="266" y="269" text-anchor="middle" style="font-weight:700">1</text><rect x="302.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="300" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="300.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="301.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="326" y="269" text-anchor="middle" style="font-weight:700">0</text><rect x="362.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="360" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="360.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="361.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="386" y="269" text-anchor="middle" style="font-weight:700">0</text><rect x="422.0" y="249.0" width="52.0" height="34.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="420" y="246" width="52" height="34" fill="url(#mat_d4e4f1m)" /><rect x="420.0" y="246.0" width="52.0" height="34.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="421.5" y="247.5" width="49.0" height="14.28" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text x="446" y="269" text-anchor="middle" style="font-weight:700">0</text><path d="M386,240V196" stroke="#c1121f" stroke-width="1.6" stroke-dasharray="4 3"/><text class="n" x="496" y="196" text-anchor="start" >5번째 비트: B(1)≠버스(0)</text><text class="n" x="496" y="214" text-anchor="start" >→ B는 중재에서 져 송신 중단</text><rect class="o" x="20" y="300" width="680" height="44" fill="#fff" rx="8"/><text class="n" x="36" y="320" text-anchor="start" >A(ID 0110 01…)가 B(0110 10…)보다 ID가 작아 우선권을 얻는다. 높은 순위 메시지는 방해 없이 전송을 완료한다.</text><text class="n" x="36" y="336" text-anchor="start" >※ ‘큰 값의 ID가 우선순위가 높다’ 는 틀린 설명이다.</text><text class="n" x="18" y="370">모든 노드가 동시에 메시지를 보낼 수 있으며, 메시지 시작은 SOF(시작 비트)로 구분된다.</text><text class="n" x="18" y="388">CAN은 멀티 마스터 방식이고 LIN은 Single Master / Multi Slave 방식이다.</text></svg>