<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" role="img" aria-label="전자제어 동력 조향장치의 네 가지 기능"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}.b{font-weight:700}
.l{stroke:#444;stroke-width:1;fill:none}.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker></defs><rect width="720" height="390" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">전자제어 동력 조향 4대 기능</text><rect class="o" x="270" y="60" width="180" height="60" rx="8" fill="#d9ead3"/><text x="360" y="80" text-anchor="middle" class="b">전자제어 동력 조향장치</text><text x="360" y="97" text-anchor="middle" class="n">4가지 기능</text><rect class="o" x="30" y="170" width="160" height="90" rx="8" fill="#fff"/><text x="110" y="190" text-anchor="middle" class="b">차속감응</text><text x="110" y="207" text-anchor="middle" class="n">주행속도에 따라</text><text x="110" y="224" text-anchor="middle" class="n">조향 보조력 제어</text><path d="M360,120L110,168" class="l" marker-end="url(#a)"/><rect class="o" x="200" y="170" width="160" height="90" rx="8" fill="#fff"/><text x="280" y="190" text-anchor="middle" class="b">직진안정</text><text x="280" y="207" text-anchor="middle" class="n">복원력 증가</text><text x="280" y="224" text-anchor="middle" class="n">직진 안정성 향상</text><path d="M360,120L280,168" class="l" marker-end="url(#a)"/><rect class="o" x="370" y="170" width="160" height="90" rx="8" fill="#fff"/><text x="450" y="190" text-anchor="middle" class="b">롤링억제</text><text x="450" y="207" text-anchor="middle" class="n">급조향 시</text><text x="450" y="224" text-anchor="middle" class="n">롤링 억제</text><path d="M360,120L450,168" class="l" marker-end="url(#a)"/><rect class="o" x="540" y="170" width="160" height="90" rx="8" fill="#fff"/><text x="620" y="190" text-anchor="middle" class="b">페일세이프</text><text x="620" y="207" text-anchor="middle" class="n">시스템 이상 시</text><text x="620" y="224" text-anchor="middle" class="n">안전 제어</text><path d="M360,120L620,168" class="l" marker-end="url(#a)"/><text class="n" x="18" y="342" style="font-size:12.5px;fill:#222">차속감응: 저속일수록 가볍게, 고속일수록 무겁게(보조력 감소)</text><text class="n" x="18" y="361" style="font-size:12.5px;fill:#222">직진안정: 핸들이 제자리로 잘 돌아오고 직진이 안정</text><text class="n" x="18" y="380" style="font-size:12.5px;fill:#222">페일세이프: 센서·제어 이상이 생기면 수동 조향으로 안전하게 전환</text></svg>