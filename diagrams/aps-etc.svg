<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="APS1과 APS2 전압 관계, ETC 계통과 강제 구동 점검"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">가속 페달 센서(APS)와 전자식 스로틀(ETC)</text><path d="M70,280H330M70,280V70" stroke="#222" stroke-width="1.6"/><text class="n" x="330" y="298" text-anchor="end" >페달 밟는 양 →</text><text class="n" x="64" y="74" text-anchor="end" >전압 (V)</text><path d="M70,260L320,90" stroke="#c1121f" stroke-width="3"/><path d="M70,272L320,170" stroke="#1d4e89" stroke-width="3"/><text class="n" x="322" y="82" text-anchor="end" style="fill:#c1121f;font-weight:700">APS1 (3.86~4.36V)</text><text class="n" x="322" y="162" text-anchor="end" style="fill:#1d4e89;font-weight:700">APS2 (1.93~2.18V)</text><path d="M66,238H70" stroke="#222"/><text class="n" x="62" y="242" text-anchor="end" >1</text><path d="M66,196H70" stroke="#222"/><text class="n" x="62" y="200" text-anchor="end" >2</text><path d="M66,154H70" stroke="#222"/><text class="n" x="62" y="158" text-anchor="end" >3</text><path d="M66,112H70" stroke="#222"/><text class="n" x="62" y="116" text-anchor="end" >4</text><text class="n" x="200" y="328" text-anchor="middle" >APS2 = APS1의 약 1/2 (안전을 위한 2중 신호)</text><rect class="o" x="380" y="70" width="130" height="30" fill="#e6e4da" rx="5"/><text x="445.0" y="89.0" text-anchor="middle" style="font-weight:700">가속 페달(APS)</text><path d="M510,85H540" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="540" y="70" width="90" height="30" fill="#d4e4f1" rx="5"/><text x="585.0" y="89.0" text-anchor="middle" style="font-weight:700">ECU</text><path d="M585,100V130" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="530" y="130" width="110" height="30" fill="#f3dcc3" rx="5"/><text x="585.0" y="149.0" text-anchor="middle" style="font-weight:700">ETC 모터</text><path d="M585,160V190" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="530" y="190" width="110" height="30" fill="#e6e4da" rx="5"/><text x="585.0" y="209.0" text-anchor="middle" style="font-weight:700">스로틀 밸브</text><path d="M530,205H480" stroke="#c1121f" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="370" y="190" width="110" height="30" fill="#fff" rx="5"/><text x="425.0" y="209.0" text-anchor="middle" >TPS 1·2 피드백</text><rect x="380" y="236" width="320" height="100" rx="8" fill="#fff" stroke="#ccc"/><text x="540.0" y="256" text-anchor="middle" style="font-weight:700;fill:#e07a1f">점검 포인트</text><text class="n" x="392" y="280" text-anchor="start" >· 스캔툴 연결 → 강제 구동 → ETC 모터 선택</text><text class="n" x="392" y="298" text-anchor="start" >· 정비지침서 규정값과 비교, TPS 1·2 값 확인</text><text class="n" x="392" y="316" text-anchor="start" >· ETC에는 별도 ISA가 없다(스로틀 모터가 공회전 제어)</text><text class="n" x="18" y="370">전자식 스로틀 고장 시 급발진·시동 꺼짐이 생길 수 있어 림프 홈(페일세이프) 기능이 중요하다.</text><text class="n" x="18" y="388">‘아이들 스피드 액추에이터 1과 2의 변화값을 기록’은 ETC 점검 설명으로 틀린 문장이다.</text></svg>