<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="CAN 버스의 종단저항 120옴 두 개와 측정 방법"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="430" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">CAN 버스와 종단저항</text><path d="M100,170H620" stroke="#e07a1f" stroke-width="3" fill="none"/><path d="M100,240H620" stroke="#1d4e89" stroke-width="3" fill="none"/><text x="112" y="162" text-anchor="start" style="font-weight:700;fill:#e07a1f">CAN-H</text><text x="112" y="258" text-anchor="start" style="font-weight:700;fill:#1d4e89">CAN-L</text><path d="M100,170V186l8,4l-16,8l16,8l-16,8l8,4V240" fill="#F4F3EF" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><circle cx="100" cy="170" r="3" fill="#222"/><circle cx="100" cy="240" r="3" fill="#222"/><path d="M620,170V186l8,4l-16,8l16,8l-16,8l8,4V240" fill="#F4F3EF" stroke="#222" stroke-width="1.6" stroke-linejoin="round"/><circle cx="620" cy="170" r="3" fill="#222"/><circle cx="620" cy="240" r="3" fill="#222"/><text x="20" y="208" text-anchor="start" >종단저항</text><text x="20" y="224" text-anchor="start" style="font-weight:700">120Ω</text><text x="634" y="208" text-anchor="start" >종단저항</text><text x="634" y="224" text-anchor="start" style="font-weight:700">120Ω</text><rect class="o" x="190" y="60" width="90" height="46" fill="#e6e4da" rx="6"/><text x="235" y="88" text-anchor="middle" >엔진 ECU</text><path d="M215,106V170" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="215" cy="170" r="3" fill="#222"/><path d="M255,106V162A8,8 0 0 1 255,178V240" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="255" cy="240" r="3" fill="#222"/><rect class="o" x="320" y="60" width="90" height="46" fill="#e6e4da" rx="6"/><text x="365" y="88" text-anchor="middle" >변속기 TCM</text><path d="M345,106V170" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="345" cy="170" r="3" fill="#222"/><path d="M385,106V162A8,8 0 0 1 385,178V240" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="385" cy="240" r="3" fill="#222"/><rect class="o" x="450" y="60" width="90" height="46" fill="#e6e4da" rx="6"/><text x="495" y="88" text-anchor="middle" >VDC ECU</text><path d="M475,106V170" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="475" cy="170" r="3" fill="#222"/><path d="M515,106V162A8,8 0 0 1 515,178V240" stroke="#222" stroke-width="1.4" fill="none"/><circle cx="515" cy="240" r="3" fill="#222"/><rect class="o" x="300" y="300" width="120" height="64" fill="#fff" rx="8"/><text class="t" x="360" y="340" text-anchor="middle" style="font-size:20px">≈ 60 Ω</text><text class="n" x="360" y="318" text-anchor="middle" >멀티미터</text><path d="M305,300V248A8,8 0 0 1 305,232V170" fill="none" stroke="#c1121f" stroke-width="2"/><circle cx="305" cy="170" r="3.5" fill="#c1121f"/><path d="M415,300V240" fill="none" stroke="#222" stroke-width="2"/><circle cx="415" cy="240" r="3.5" fill="#222"/><text x="440" y="304" text-anchor="start" >측정: 다기능체크 커넥터 / 자기진단 점검 단자</text><text class="n" x="440" y="322" text-anchor="start" >(배터리 (-) 단자 탈거 후 전원 차단 상태에서)</text><text class="n" x="700" y="358" text-anchor="end" >우성 비트: CAN-H 약 3.5V / CAN-L 약 1.5V</text><text class="n" x="700" y="374" text-anchor="end" >열성 비트: 둘 다 약 2.5V</text><text class="n" x="18" y="400">정상: 120Ω 두 개가 병렬 → 합성 약 60Ω. 한쪽 종단저항 쪽 선이 끊기면 약 120Ω이 측정된다.</text><text class="n" x="18" y="418">종단저항은 bus 양 끝 신호 반사를 막고, High-Low 사이 회로를 구성해 통신 불량·지연을 막는다.</text></svg>