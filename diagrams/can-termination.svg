<circle cx="330" cy="291" r="3.5" fill="#c1121f"/><circle cx="390" cy="291" r="3.5" fill="#222"/><text class="t" x="18" y="30">CAN 버스와 종단저항</text><text x="112" y="162" text-anchor="start" style="font-weight:700;fill:#e07a1f">CAN-H</text><text x="112" y="258" text-anchor="start" style="font-weight:700;fill:#1d4e89">CAN-L</text><text x="20" y="208" text-anchor="start" >종단저항</text><text x="20" y="224" text-anchor="start" style="font-weight:700">120Ω</text><text x="634" y="208" text-anchor="start" >종단저항</text><text x="634" y="224" text-anchor="start" style="font-weight:700">120Ω</text><text x="235" y="88" text-anchor="middle" >엔진 ECU</text><text x="365" y="88" text-anchor="middle" >변속기 TCM</text><text x="495" y="88" text-anchor="middle" >VDC ECU</text><text class="t" x="360" y="340" text-anchor="middle" style="font-size:20px">≈ 60 Ω</text><text class="n" x="360" y="318" text-anchor="middle" >멀티미터</text><text x="440" y="304" text-anchor="start" >측정: 다기능체크 커넥터 / 자기진단 점검 단자</text><text class="n" x="440" y="322" text-anchor="start" >(배터리 (-) 단자 탈거 후 전원 차단 상태에서)</text><text class="n" x="700" y="358" text-anchor="end" >우성 비트: CAN-H 약 3.5V / CAN-L 약 1.5V</text><text class="n" x="700" y="374" text-anchor="end" >열성 비트: 둘 다 약 2.5V</text><text class="n" x="18" y="400">정상: 120Ω 두 개가 병렬 → 합성 약 60Ω. 한쪽 종단저항 쪽 선이 끊기면 약 120Ω이 측정된다.</text><text class="n" x="18" y="418">종단저항은 bus 양 끝 신호 반사를 막고, High-Low 사이 회로를 구성해 통신 불량·지연을 막는다.</text></svg>