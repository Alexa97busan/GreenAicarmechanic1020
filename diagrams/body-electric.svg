<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="오토 라이트, 세이프티 파워윈도우, 와이퍼 파킹 스위치, 리어 열선 타이머"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">바디 전장: 오토 라이트·파워윈도우·와이퍼·열선</text><rect x="20" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">오토 라이트</text><rect x="370" y="50" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">세이프티 파워윈도우</text><rect x="20" y="232" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="252" text-anchor="middle" style="font-weight:700;fill:#222">와이퍼 파킹 스위치</text><rect x="370" y="232" width="330" height="170" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="535.0" y="252" text-anchor="middle" style="font-weight:700;fill:#222">리어 윈도우 열선</text><circle class="o" cx="60" cy="100" r="16" fill="#f3dcc3"/><text class="n" x="60" y="130" text-anchor="middle" >조도 센서</text><text class="n" x="118" y="100" text-anchor="start" >· 앞유리 상단에 설치</text><text class="n" x="118" y="117" text-anchor="start" >· 터널·일몰 등 조도 변화를 감지해</text><text class="n" x="118" y="134" text-anchor="start" >  전조등 자동 제어</text><text class="n" x="118" y="151" text-anchor="start" >· 안개·우천·흐린 날은 수동 전환</text><text class="n" x="118" y="168" text-anchor="start" >· 광차단 코팅 시 오작동 가능</text><rect class="o" x="390" y="90" width="54" height="34" fill="#e6e4da" rx="4"/><text class="n" x="417" y="112" text-anchor="middle" >모터</text><rect class="o" x="394" y="130" width="46" height="22" fill="#fff" rx="5"/><text x="417.0" y="145.0" text-anchor="middle" >홀 센서 ×2</text><text class="n" x="458" y="98" text-anchor="start" >· 홀 센서 2개로 모터 회전수</text><text class="n" x="458" y="115" text-anchor="start" >  와 방향을 검출</text><text class="n" x="458" y="132" text-anchor="start" >· 배터리 방전 후엔 데이터가</text><text class="n" x="458" y="149" text-anchor="start" >  지워져 초기화가 필요</text><text class="n" x="458" y="166" text-anchor="start" >· 끼임 방지(세이프티) 기능</text><circle class="o" cx="70" cy="300" r="22" fill="#e6e4da"/><path d="M70,300L70,282" stroke="#222" stroke-width="3"/><circle cx="70" cy="282" r="4" fill="#e07a1f"/><text class="n" x="70" y="342" text-anchor="middle" >파킹 스위치(캠)</text><text class="n" x="110" y="280" text-anchor="start" >· 와이퍼 모터가 정위치(파킹)에</text><text class="n" x="110" y="297" text-anchor="start" >  도달하면 전원을 차단해</text><text class="n" x="110" y="314" text-anchor="start" >  정위치에 멈추게 하는 스위치</text><text class="n" x="110" y="331" text-anchor="start" >· 모터 회전 캠과 접점으로 동작</text><rect class="o" x="390" y="290" width="280" height="16" fill="#e6e4da" rx="4"/><rect class="o" x="390" y="290" width="280" height="16" fill="#f3dcc3" rx="4"/><text class="n" x="390" y="324" text-anchor="start" >ON</text><text class="n" x="670" y="324" text-anchor="end" >20분 후 자동 OFF</text><text class="n" x="386" y="280" text-anchor="start" >IBU 제어로 열선을 약 20분 ON 후</text><text class="n" x="386" y="297" text-anchor="start" >자동으로 OFF 한다</text><text class="n" x="18" y="410">오토 라이트는 일출·일몰처럼 조도가 변할 때 쓰도록 만든 장치이다(‘사용하지 않는다’는 틀림).</text><text class="n" x="18" y="428">홀 센서 방식 세이프티 윈도우는 배터리 방전 시 초기화가 필요하다(‘필요 없다’는 틀림).</text></svg>