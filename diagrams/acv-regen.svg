<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="흡기 계통의 공기 조절 밸브 위치와 DPF 강제 재생 방법"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
.fl{fill:none;stroke:#fff;stroke-opacity:.85;stroke-linecap:round;stroke-dasharray:.1 12;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12.1}}.fa{stroke-dasharray:6 5;animation:fa 1s linear infinite}@keyframes fa{to{stroke-dashoffset:-11}}@media (prefers-reduced-motion:reduce){.fl,.fa{animation:none}}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e6e4dam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f3ee"/><stop offset="0.28" stop-color="#e6e4da"/><stop offset="0.5" stop-color="#d6d4cb"/><stop offset="0.74" stop-color="#eeece5"/><stop offset="1" stop-color="#b8b6ae"/></linearGradient><linearGradient id="mat_e07a1fp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edb27d"/><stop offset="0.5" stop-color="#e07a1f"/><stop offset="1" stop-color="#c1691b"/></linearGradient><linearGradient id="mat_d4e4f1m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecf3f9"/><stop offset="0.28" stop-color="#d4e4f1"/><stop offset="0.5" stop-color="#c5d4e0"/><stop offset="0.74" stop-color="#e1ecf5"/><stop offset="1" stop-color="#aab6c1"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="380" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">공기 조절 밸브와 DPF 강제 재생</text><rect x="22.0" y="103.0" width="110.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="20" y="100" width="110" height="50" fill="url(#mat_e6e4dam)" rx="6"/><rect x="20.0" y="100.0" width="110.0" height="50.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="21.5" y="101.5" width="107.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="75.0" y="129.0" text-anchor="middle" style="font-weight:700">에어클리너</text><path d="M130,125L200,125" fill="none" stroke="#222" stroke-width="10" stroke-linejoin="round"/><path d="M130,125L200,125" fill="none" stroke="#7fb8e0" stroke-width="8" stroke-linejoin="round"/><path class="fl" d="M130,125L200,125" stroke-width="6"/><rect class="o" x="200" y="100" width="24" height="50" fill="url(#mat_e07a1fp)" rx="3"/><rect x="201.5" y="101.5" width="21.0" height="21.0" rx="3" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="212" y="92" text-anchor="middle" >공기 조절 밸브(ACV)</text><path d="M224,125L300,125" fill="none" stroke="#222" stroke-width="10" stroke-linejoin="round"/><path d="M224,125L300,125" fill="none" stroke="#7fb8e0" stroke-width="8" stroke-linejoin="round"/><path class="fl" d="M224,125L300,125" stroke-width="6"/><rect x="302.0" y="103.0" width="100.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="300" y="100" width="100" height="50" fill="url(#mat_d4e4f1m)" rx="6"/><rect x="300.0" y="100.0" width="100.0" height="50.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="301.5" y="101.5" width="97.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="350.0" y="129.0" text-anchor="middle" style="font-weight:700">흡기 매니폴드</text><path class="fa" d="M400,125H440" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="442.0" y="103.0" width="100.0" height="50.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="440" y="100" width="100" height="50" fill="url(#mat_e6e4dam)" rx="6"/><rect x="440.0" y="100.0" width="100.0" height="50.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="441.5" y="101.5" width="97.0" height="21.0" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="490.0" y="129.0" text-anchor="middle" style="font-weight:700">엔진</text><rect class="o" x="20" y="190" width="330" height="130" fill="#fff" rx="8"/><text x="34" y="212" text-anchor="start" style="font-weight:700;fill:#e07a1f">ACV(전자식 스로틀 밸브)의 기능</text><text class="n" x="34" y="234" text-anchor="start" >· 흡입 공기량 제어(정확한 EGR 제어)</text><text class="n" x="34" y="251" text-anchor="start" >· 시동 정지 시 흡입통로를 차단</text><text class="n" x="34" y="268" text-anchor="start" >· 후처리 장치 재생 시 흡기를 줄여</text><text class="n" x="34" y="285" text-anchor="start" >  배기가스 온도를 상승</text><rect class="o" x="370" y="190" width="330" height="130" fill="#fff" rx="8"/><text x="384" y="212" text-anchor="start" style="font-weight:700;fill:#e07a1f">DPF 강제 재생</text><text class="n" x="384" y="234" text-anchor="start" >· 정비 시 스캔툴의 강제 재생 기능 사용</text><text class="n" x="384" y="251" text-anchor="start" >· 주행거리·엔진 구동 시간은 재생 판단에</text><text class="n" x="384" y="268" text-anchor="start" >  쓰일 수 있으나 강제 재생 방법은 아님</text><text class="n" x="384" y="285" text-anchor="start" >· 컴퓨터 시뮬레이션도 아님</text><text class="n" x="18" y="350">공기 조절 밸브(ACV)는 이름 그대로 흡입 공기량을 제어해 EGR 효율과 DPF 재생 온도를 맞춘다.</text><text class="n" x="18" y="368">DPF가 줄일 수 있는 것은 입자상 물질(PM)이며 질소산화물(NOx)은 줄이지 못한다.</text></svg>