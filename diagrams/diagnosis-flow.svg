<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="스캔툴 사용 순서, MIL, DTC 첫 자리, 강제 소거 조건"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">진단기 사용 순서와 고장코드(DTC)</text><rect class="o" x="20" y="70" width="150" height="40" fill="#d4e4f1" rx="5"/><text x="95.0" y="94.0" text-anchor="middle" style="font-weight:700">① 차량 제조사</text><path d="M170,90H195" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="195" y="70" width="150" height="40" fill="#d4e4f1" rx="5"/><text x="270.0" y="94.0" text-anchor="middle" style="font-weight:700">② 차량명</text><path d="M345,90H370" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="370" y="70" width="150" height="40" fill="#d4e4f1" rx="5"/><text x="445.0" y="94.0" text-anchor="middle" style="font-weight:700">③ 차량 연식</text><path d="M520,90H545" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="545" y="70" width="150" height="40" fill="#d4e4f1" rx="5"/><text x="620.0" y="94.0" text-anchor="middle" style="font-weight:700">④ 시스템</text><text x="20" y="56" text-anchor="start" style="font-weight:700">차량진단기(스캔툴) 사용 순서</text><rect x="20" y="140" width="220" height="160" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="130.0" y="160" text-anchor="middle" style="font-weight:700;fill:#222">MIL (엔진 경고등)</text><rect class="o" x="85" y="172" width="70" height="46" rx="8" fill="#f3dcc3"/><text x="120" y="202" text-anchor="middle" style="font-weight:700;fill:#c1121f">ENG</text><text class="n" x="34" y="242" text-anchor="start" >엔진 구동은 멈추지 않으나</text><text class="n" x="34" y="259" text-anchor="start" >점검이 필요함을 운전자에게</text><text class="n" x="34" y="276" text-anchor="start" >알리는 경고등</text><rect x="260" y="140" width="220" height="160" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="370.0" y="160" text-anchor="middle" style="font-weight:700;fill:#222">DTC 첫 자리</text><rect class="o" x="274" y="166" width="36" height="24" fill="#fff" rx="5"/><text x="292.0" y="182.0" text-anchor="middle" style="font-weight:700">P</text><text class="n" x="320" y="183" text-anchor="start" >파워트레인</text><rect class="o" x="274" y="196" width="36" height="24" fill="#fff" rx="5"/><text x="292.0" y="212.0" text-anchor="middle" style="font-weight:700">C</text><text class="n" x="320" y="213" text-anchor="start" >섀시</text><rect class="o" x="274" y="226" width="36" height="24" fill="#fff" rx="5"/><text x="292.0" y="242.0" text-anchor="middle" style="font-weight:700">B</text><text class="n" x="320" y="243" text-anchor="start" >바디</text><rect class="o" x="274" y="256" width="36" height="24" fill="#fff" rx="5"/><text x="292.0" y="272.0" text-anchor="middle" style="font-weight:700">U</text><text class="n" x="320" y="273" text-anchor="start" >네트워크</text><text class="n" x="470" y="190" text-anchor="start" ></text><rect x="500" y="140" width="200" height="160" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="600.0" y="160" text-anchor="middle" style="font-weight:700;fill:#222">고장코드 강제 소거</text><text class="n" x="512" y="190" text-anchor="start" >조건: IG key ON,</text><text class="n" x="512" y="208" text-anchor="start" >엔진 정지(시동 OFF) 상태</text><text class="n" x="512" y="226" text-anchor="start" ></text><text class="n" x="512" y="244" text-anchor="start" >‘시동 ON 및 차량 정지를</text><text class="n" x="512" y="262" text-anchor="start" >유지한다’는 틀린 설명</text><rect class="o" x="20" y="316" width="680" height="40" fill="#fff" rx="8"/><text class="n" x="36" y="340" text-anchor="start" >D 로 시작하는 고장코드는 표준에 없다(P·C·B·U 만 존재).</text><text class="n" x="18" y="380">진단기 메뉴 진입: 제조사 → 차량명 → 연식 → 시스템(엔진·변속기 등) 순서이다.</text><text class="n" x="18" y="398">고장코드(DTC)는 5자리 코드이며 첫 자리가 시스템 영역을 나타낸다.</text></svg>