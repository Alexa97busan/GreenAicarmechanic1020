" height="10.08" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="609" y="112" text-anchor="middle" >3</text><path d="M626,108H636" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="636" y="96" width="34" height="24" fill="url(#mat_e8f0d8p)" /><rect x="637.5" y="97.5" width="31.0" height="10.08" rx="0" fill="url(#mat_gl)" pointer-events="none"/><text class="n" x="653" y="112" text-anchor="middle" >4</text><text class="n" x="494" y="148" text-anchor="start" >여러 데이터가 동시에</text><text class="n" x="494" y="165" text-anchor="start" >출력되지 못하고 순차적</text><text class="n" x="494" y="182" text-anchor="start" >으로 나오는 방식(시리얼)</text><rect x="20" y="256" width="330" height="100" rx="8" fill="#fff" stroke="#ccc"/><text x="185.0" y="276" text-anchor="middle" style="font-weight:700;fill:#e07a1f">프로토콜</text><text class="n" x="34" y="304" text-anchor="start" >ECM(제어기) 상호간에 통신을 위해</text><text class="n" x="34" y="322" text-anchor="start" >정해 둔 규칙 = 프로토콜</text><rect x="370" y="256" width="330" height="100" rx="8" fill="#fff" stroke="#ccc"/><text x="535.0" y="276" text-anchor="middle" style="font-weight:700;fill:#e07a1f">시험 포인트</text><text class="n" x="384" y="304" text-anchor="start" >통신 방향에 따른 분류가 아닌 것:</text><text class="n" x="384" y="322" text-anchor="start" >사이클 통신 (단방향·양방향·직렬 등 ✓)</text><text class="n" x="18" y="380">서로 다른 프로토콜·속도의 네트워크를 연결해 주는 장치는 게이트웨이 모듈이다.</text><text class="n" x="18" y="398">통신 시스템의 장점은 배선의 경량화·제어장치 간소화 등이며 배선의 중량화가 아니다.</text></svg>