<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="단방향, 양방향, 직렬 통신과 프로토콜"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">통신의 기본 개념</text><rect x="20" y="50" width="220" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="130.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">단방향 통신</text><rect x="250" y="50" width="220" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">양방향 통신</text><rect x="480" y="50" width="220" height="190" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="590.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">직렬 통신</text><rect class="o" x="40" y="90" width="70" height="30" fill="#d4e4f1" rx="5"/><text class="n" x="75.0" y="109.0" text-anchor="middle" >ECU A</text><path d="M110,105H150" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="150" y="90" width="70" height="30" fill="#e6e4da" rx="5"/><text class="n" x="185.0" y="109.0" text-anchor="middle" >ECU B</text><text class="n" x="34" y="148" text-anchor="start" >정보를 주는 ECU와 받아</text><text class="n" x="34" y="165" text-anchor="start" >실행만 하는 ECU</text><text class="n" x="34" y="182" text-anchor="start" >(MUX·PWM 방식 등)</text><rect class="o" x="270" y="90" width="70" height="30" fill="#d4e4f1" rx="5"/><text class="n" x="305.0" y="109.0" text-anchor="middle" >ECU A</text><path d="M340,98H380" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><path d="M380,112H340" stroke="#222" stroke-width="1.6" marker-end="url(#a)"/><rect class="o" x="380" y="90" width="70" height="30" fill="#d4e4f1" rx="5"/><text class="n" x="415.0" y="109.0" text-anchor="middle" >ECU B</text><text class="n" x="264" y="148" text-anchor="start" >서로 주고받는 통신</text><text class="n" x="264" y="165" text-anchor="start" >(CAN·LIN 등)</text><rect class="o" x="504" y="96" width="34" height="24" fill="#e8f0d8" /><text class="n" x="521" y="112" text-anchor="middle" >1</text><path d="M538,108H548" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="548" y="96" width="34" height="24" fill="#e8f0d8" /><text class="n" x="565" y="112" text-anchor="middle" >2</text><path d="M582,108H592" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="592" y="96" width="34" height="24" fill="#e8f0d8" /><text class="n" x="609" y="112" text-anchor="middle" >3</text><path d="M626,108H636" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="636" y="96" width="34" height="24" fill="#e8f0d8" /><text class="n" x="653" y="112" text-anchor="middle" >4</text><text class="n" x="494" y="148" text-anchor="start" >여러 데이터가 동시에</text><text class="n" x="494" y="165" text-anchor="start" >출력되지 못하고 순차적</text><text class="n" x="494" y="182" text-anchor="start" >으로 나오는 방식(시리얼)</text><rect x="20" y="256" width="330" height="100" rx="8" fill="#fff" stroke="#ccc"/><text x="185.0" y="276" text-anchor="middle" style="font-weight:700;fill:#e07a1f">프로토콜</text><text class="n" x="34" y="304" text-anchor="start" >ECM(제어기) 상호간에 통신을 위해</text><text class="n" x="34" y="322" text-anchor="start" >정해 둔 규칙 = 프로토콜</text><rect x="370" y="256" width="330" height="100" rx="8" fill="#fff" stroke="#ccc"/><text x="535.0" y="276" text-anchor="middle" style="font-weight:700;fill:#e07a1f">시험 포인트</text><text class="n" x="384" y="304" text-anchor="start" >통신 방향에 따른 분류가 아닌 것:</text><text class="n" x="384" y="322" text-anchor="start" >사이클 통신 (단방향·양방향·직렬 등 ✓)</text><text class="n" x="18" y="380">서로 다른 프로토콜·속도의 네트워크를 연결해 주는 장치는 게이트웨이 모듈이다.</text><text class="n" x="18" y="398">통신 시스템의 장점은 배선의 경량화·제어장치 간소화 등이며 배선의 중량화가 아니다.</text></svg>