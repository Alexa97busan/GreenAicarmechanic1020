.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="500" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">차체 진동의 종류</text><text x="18" y="70" text-anchor="start" style="font-weight:700;fill:#1d4e89">스프링 위 질량 (차체) 의 진동</text><text x="18" y="262" text-anchor="start" style="font-weight:700;fill:#c1121f">스프링 아래 질량 (휠·차축) 의 진동</text><rect x="18" y="78" width="165" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="100" y="98" text-anchor="middle" style="font-weight:700">바운싱</text><text class="n" x="100" y="210" text-anchor="middle">Z축 방향 상하 진동</text><g transform="translate(90,168) rotate(0)"><rect class="o" x="-55" y="-34" width="110" height="26" rx="6" fill="#e6e4da"/><path class="o" d="M-28,-34L-14,-54H24L40,-34Z" fill="#d8d6cc"/><circle class="o" cx="-32" cy="0" r="11" fill="#6e747b"/><circle class="o" cx="32" cy="0" r="11" fill="#6e747b"/><rect x="50" y="-28" width="5" height="8" fill="#e0b25a"/></g><path d="M166,144L166,114" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><path d="M166,144L166,174" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><rect x="190" y="78" width="165" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="272" y="98" text-anchor="middle" style="font-weight:700">피칭</text><text class="n" x="272" y="210" text-anchor="middle">Y축 회전 (앞뒤 오르내림)</text><g transform="translate(272,172) rotate(-7)"><rect class="o" x="-55" y="-34" width="110" height="26" rx="6" fill="#e6e4da"/><path class="o" d="M-28,-34L-14,-54H24L40,-34Z" fill="#d8d6cc"/><circle class="o" cx="-32" cy="0" r="11" fill="#6e747b"/><circle class="o" cx="32" cy="0" r="11" fill="#6e747b"/><rect x="50" y="-28" width="5" height="8" fill="#e0b25a"/></g><path d="M272.0,102.0A52,52 0 0 1 304.0,113.0" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><path d="M272.0,102.0A52,52 0 0 0 240.0,113.0" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><rect x="362" y="78" width="165" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="444" y="98" text-anchor="middle" style="font-weight:700">롤링</text><text class="n" x="444" y="210" text-anchor="middle">X축 회전 (좌우 기울어짐)</text><g transform="translate(444,176) rotate(7)"><rect class="o" x="-32" y="-40" width="64" height="28" rx="5" fill="#e6e4da"/><rect class="o" x="-22" y="-60" width="44" height="22" rx="4" fill="#d8d6cc"/><rect class="o" x="-42" y="-14" width="11" height="26" rx="3" fill="#6e747b"/><rect class="o" x="31" y="-14" width="11" height="26" rx="3" fill="#6e747b"/></g><path d="M444.0,102.0A56,56 0 0 1 476.9,112.7" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><path d="M444.0,102.0A56,56 0 0 0 411.1,112.7" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><rect x="534" y="78" width="165" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="616" y="98" text-anchor="middle" style="font-weight:700">요잉</text><text class="n" x="616" y="210" text-anchor="middle">Z축 회전 (차체 방향 흔들림)</text><g transform="translate(616,156) rotate(-8)"><rect class="o" x="-52" y="-22" width="104" height="44" rx="10" fill="#e6e4da"/><rect class="o" x="-14" y="-16" width="38" height="32" rx="4" fill="#d8d6cc"/><rect class="o" x="-42" y="-29" width="18" height="7" rx="2" fill="#6e747b"/><rect class="o" x="-42" y="22" width="18" height="7" rx="2" fill="#6e747b"/><rect class="o" x="24" y="-29" width="18" height="7" rx="2" fill="#6e747b"/><rect class="o" x="24" y="22" width="18" height="7" rx="2" fill="#6e747b"/><rect x="50" y="-12" width="3" height="24" fill="#e0b25a"/></g><path d="M664.5,128.0A56,56 0 0 1 664.5,184.0" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><path d="M567.5,184.0A56,56 0 0 1 567.5,128.0" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><rect x="18" y="270" width="165" height="140" rx="8" fill="#faf9f5" stroke