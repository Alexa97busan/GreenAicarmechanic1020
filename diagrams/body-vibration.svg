/><rect class="o" x="40" y="-15" width="12" height="30" rx="3" fill="#6e747b"/></g><path d="M202,358L202,332" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><path d="M342,358L342,384" stroke="#c1121f" stroke-width="2" fill="none" marker-end="url(#r)"/><rect x="362" y="270" width="165" height="140" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="444" y="290" text-anchor="middle" style="font-weight:700">와인드 업</text><text class="n" x="444" y="402" text-anchor="middle">Y축 회전 (차축이 비틀림)</text><circle class="o" cx="438" cy="366" r="26" fill="#6e747b"/><circle cx="438" cy="366" r="4" fill="#222"/><path d="M384,342L494,320" stroke="#222" stroke-width="7"/><path d="M384,342L494,320" stroke="#9aa0a6" stroke-width="4.5"/><path d="M458.0,331.4A40,40 0 0 1 475.6,352.3" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><path d="M400.4,352.3A40,40 0 0 1 418.0,331.4" fill="none" stroke="#c1121f" stroke-width="2" marker-end="url(#r)"/><rect x="534" y="270" width="165" height="140" rx="8" fill="#fff" stroke="#e07a1f" stroke-width="1.6"/><text x="616" y="290" text-anchor="middle" style="font-weight:700;fill:#e07a1f">시험 포인트</text><text class="n" x="544" y="314" text-anchor="start" >위: 바운싱·피칭·롤링·요잉</text><text class="n" x="544" y="332" text-anchor="start" >아래: 휠 홉·휠 트램프·와인드 업</text><text class="n" x="544" y="350" text-anchor="start" >※ 와인드 업은 스프링 아래</text><text class="n" x="544" y="368" text-anchor="start" >아래 질량은 주파수가 높고</text><text class="n" x="544" y="386" text-anchor="start" >진동 발생·감쇄가 빠르다</text><text class="n" x="18" y="470">스프링 위 질량 = 차체(바운싱·피칭·롤링·요잉), 스프링 아래 질량 = 바퀴·차축(휠 홉·휠 트램프·와인드 업).</text><text class="n" x="18" y="488">롤링은 정면에서 볼 때 회전하는 진동, 피칭은 앞쪽이 내려앉고 치솟는 진동이다.</text></svg>