<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" role="img" aria-label="피스톤에 힘 F를 가할 때 면적과 압력 계산 순서와 두 가지 계산 예"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_e4e2dam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f2ee"/><stop offset="0.28" stop-color="#e4e2da"/><stop offset="0.5" stop-color="#d4d2cb"/><stop offset="0.74" stop-color="#ecebe5"/><stop offset="1" stop-color="#b6b5ae"/></linearGradient><linearGradient id="mat_9cc6e6p" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c6def0"/><stop offset="0.5" stop-color="#9cc6e6"/><stop offset="1" stop-color="#86aac6"/></linearGradient><linearGradient id="mat_c2c6ccm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e5e8"/><stop offset="0.28" stop-color="#c2c6cc"/><stop offset="0.5" stop-color="#b4b8be"/><stop offset="0.74" stop-color="#d4d7db"/><stop offset="1" stop-color="#9b9ea3"/></linearGradient><linearGradient id="mat_e8f0d8m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f8ed"/><stop offset="0.28" stop-color="#e8f0d8"/><stop offset="0.5" stop-color="#d8dfc9"/><stop offset="0.74" stop-color="#eff4e4"/><stop offset="1" stop-color="#bac0ad"/></linearGradient></defs>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="410" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">파스칼 원리와 압력 계산</text><rect x="20" y="50" width="300" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="170.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">압력 = 힘 ÷ 면적</text><rect x="92.0" y="153.0" width="120.0" height="150.0" rx="4" fill="#000" opacity=".09"/><rect class="o" x="90" y="150" width="120" height="150" fill="url(#mat_e4e2dam)" rx="4"/><rect x="90.0" y="150.0" width="120.0" height="150.0" rx="4" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="91.5" y="151.5" width="117.0" height="26" rx="4" fill="url(#mat_gl)" pointer-events="none"/><rect x="96.0" y="203.0" width="112.0" height="96.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="94" y="200" width="112" height="96" fill="url(#mat_9cc6e6p)" /><rect x="95.5" y="201.5" width="109.0" height="26" rx="0" fill="url(#mat_gl)" pointer-events="none"/><rect x="100.0" y="179.0" width="104.0" height="24.0" rx="0" fill="#000" opacity=".09"/><rect class="o" x="98" y="176" width="104" height="24" fill="url(#mat_c2c6ccm)" /><rect x="98.0" y="176.0" width="104.0" height="24.0" rx="0" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="99.5" y="177.5" width="101.0" height="10.08" rx="0" fill="url(#mat_gl)" pointer-events="none"/><rect class="o" x="144" y="110" width="12" height="66" fill="#9aa0a6" /><path d="M150,82V106" stroke="#c1121f" stroke-width="1.6" marker-end="url(#a)" fill="none"/><text x="162" y="98" text-anchor="start" style="font-weight:700;fill:#c1121f">F (N)</text><path d="M90,318H210" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><path d="M90,312V324M210,312V324" fill="none" stroke="#444" stroke-width="1.2" stroke-linejoin="round"/><text class="n" x="150" y="338" text-anchor="middle" >지름 d (cm)</text><text class="n" x="150" y="262" text-anchor="middle" style="font-weight:700">유압(P)</text><rect x="340" y="50" width="360" height="300" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="520.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">계산 순서</text><rect class="o" x="356" y="78" width="328" height="56" fill="#fff" rx="6"/><text x="368" y="100" text-anchor="start" style="font-weight:700">① 면적  A = π × d² ÷ 4  (π = 3.14)</text><text x="368" y="122" text-anchor="start" style="font-weight:700">② 압력  P = F ÷ A</text><rect x="358.0" y="149.0" width="328.0" height="90.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="356" y="146" width="328" height="90" fill="url(#mat_e8f0d8m)" rx="6"/><rect x="356.0" y="146.0" width="328.0" height="90.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="357.5" y="147.5" width="325.0" height="26" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="368" y="166" text-anchor="start" style="font-weight:700">예 1) F = 100 N, d = 4 cm</text><text class="n" x="368" y="186" text-anchor="start" >A = 3.14 × 4² ÷ 4 = 12.56 cm²</text><text class="n" x="368" y="206" text-anchor="start" >P = 100 ÷ 12.56 = 7.96 N/cm²</text><rect x="358.0" y="251.0" width="328.0" height="90.0" rx="6" fill="#000" opacity=".09"/><rect class="o" x="356" y="248" width="328" height="90" fill="url(#mat_e8f0d8m)" rx="6"/><rect x="356.0" y="248.0" width="328.0" height="90.0" rx="6" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="357.5" y="249.5" width="325.0" height="26" rx="6" fill="url(#mat_gl)" pointer-events="none"/><text x="368" y="268" text-anchor="start" style="font-weight:700">예 2) F = 150 N, d = 6 cm</text><text class="n" x="368" y="288" text-anchor="start" >A = 3.14 × 6² ÷ 4 = 28.26 cm²</text><text class="n" x="368" y="308" text-anchor="start" >P = 150 ÷ 28.26 = 5.31 → 답안은 5.3 N/cm²</text><text class="n" x="18" y="380">반지름을 쓰면 A = π × r² (d÷2). 지름이 주어지면 π d² ÷ 4 로 한 번에 계산한다.</text><text class="n" x="18" y="398">같은 압력이 면적에 비례한 힘을 만든다(파스칼 원리) → 브레이크 마스터 실린더·휠 실린더.</text></svg>