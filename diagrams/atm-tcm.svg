4" y="357" text-anchor="start" >(오일량 과다는 원인이 아님)</text><text class="n" x="34" y="374" text-anchor="start" >TCM 학습 시기: 솔레노이드 교환·변속 충격·변속기 수리 (소음 ✗)</text><text class="n" x="18" y="410">입력축 속도센서의 형식: 인덕티브·홀·액티브 센서 타입(‘네거티브 타입’은 없다).</text><text class="n" x="18" y="428">유온 센서의 서미스터는 온도가 오르면 저항이 낮아지는 부특성이며 댐퍼 클러치 작동 영역·유압 보정에 쓰인다.</text><g pointer-events="none"><rect class="o" x="26" y="68" width="24" height="24" rx="4" fill="#2f3438" /><path d="M32,86l12,-12" stroke="#c3c7ca" stroke-width="3"/><rect class="o" x="26" y="126" width="26" height="20" rx="3" fill="#8a8f93" /><rect class="o" x="20" y="129" width="8" height="14" rx="2" fill="#2f3438" /><path d="M52,136 h8"  stroke="#c3c7ca" stroke-width="5"/><rect class="o" x="26" y="176" width="26" height="20" rx="3" fill="#8a8f93" /><rect class="o" x="20" y="179" width="8" height="14" rx="2" fill="#2f3438" /><path d="M52,186 h8"  stroke="#c3c7ca" stroke-width="5"/><rect class="o" x="26" y="226" width="22" height="14" rx="3" fill="#9ea3a7" /><circle class="o" cx="52" cy="233" r="5" fill="#d9a441"/><path d="M26,233h-6" stroke="#222" stroke-width="2"/><circle class="o" cx="38" cy="280" r="12" fill="#5b6166"/><path d="M38,280L49.0,280.0" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L44.8,288.6" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L35.5,290.7" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L28.1,284.7" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L28.1,275.1" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L35.7,269.2" stroke="#c3c7ca" stroke-width="1.5"/><path d="M38,280L45.0,271.5" stroke="#c3c7ca" stroke-width="1.5"/><path d="M284,126H406" stroke="#7b8084" stroke-width="1.4" opacity=".6"/><path d="M284,130H406" stroke="#7b8084" stroke-width="1.4" opacity=".6"/><path d="M284,134H406" stroke="#7b8084" stroke-width="1.4" opacity=".6"/><rect class="o" x="420" y="150" width="14" height="40" rx="3" fill="url(#bk)" /><path d="M423,158h8" stroke="#c9a227" stroke-width="1.4"/><path d="M423,1