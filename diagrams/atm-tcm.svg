<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="TCM에 들어오는 센서 신호와 솔레노이드 출력"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">자동변속기 전자제어(TCM) 입·출력</text><rect class="o" x="20" y="62" width="190" height="36" fill="#e6e4da" rx="5"/><text x="115.0" y="84.0" text-anchor="middle" style="font-weight:700">APS (가속 페달)</text><path d="M210,80H270" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="112" width="190" height="36" fill="#e6e4da" rx="5"/><text x="115.0" y="134.0" text-anchor="middle" style="font-weight:700">차속·출력축 속도센서</text><path d="M210,130H270" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="162" width="190" height="36" fill="#e6e4da" rx="5"/><text x="115.0" y="184.0" text-anchor="middle" style="font-weight:700">입력축 속도센서</text><text class="n" x="115" y="204" text-anchor="start" ></text><path d="M210,180H270" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="212" width="190" height="36" fill="#e6e4da" rx="5"/><text x="115.0" y="234.0" text-anchor="middle" style="font-weight:700">유온 센서</text><text class="n" x="115" y="254" text-anchor="start" ></text><path d="M210,230H270" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="262" width="190" height="36" fill="#e6e4da" rx="5"/><text x="115.0" y="284.0" text-anchor="middle" style="font-weight:700">인히비터 스위치</text><text class="n" x="115" y="304" text-anchor="start" ></text><path d="M210,280H270" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="270" y="120" width="150" height="130" fill="#d4e4f1" rx="6"/><text x="345.0" y="183.0" text-anchor="middle" style="font-weight:700">TCM</text><text class="n" x="345.0" y="198.0" text-anchor="middle" >변속 제어 모듈</text><path d="M420,108H480" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="480" y="90" width="220" height="36" fill="#f3dcc3" rx="5"/><text x="590.0" y="112.0" text-anchor="middle" style="font-weight:700">변속 솔레노이드</text><path d="M420,174H480" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="480" y="156" width="220" height="36" fill="#f3dcc3" rx="5"/><text x="590.0" y="178.0" text-anchor="middle" style="font-weight:700">댐퍼 클러치 솔레노이드</text><path d="M420,240H480" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="480" y="222" width="220" height="36" fill="#f3dcc3" rx="5"/><text x="590.0" y="244.0" text-anchor="middle" style="font-weight:700">압력 제어 솔레노이드</text><rect class="o" x="480" y="290" width="220" height="40" fill="#f4e1dd" rx="6"/><text class="n" x="590" y="308" text-anchor="middle" >PCSV(퍼지 컨트롤 솔레노이드)</text><text class="n" x="590" y="323" text-anchor="middle" style="fill:#c1121f">엔진 증발가스용 → 변속기 부품 아님</text><rect class="o" x="20" y="320" width="440" height="60" fill="#fff" rx="8"/><text class="n" x="34" y="340" text-anchor="start" >유온센서 데이터가 −30℃ 고정: 회로 단선·센서·PCM(TCM) 이상</text><text class="n" x="34" y="357" text-anchor="start" >(오일량 과다는 원인이 아님)</text><text class="n" x="34" y="374" text-anchor="start" >TCM 학습 시기: 솔레노이드 교환·변속 충격·변속기 수리 (소음 ✗)</text><text class="n" x="18" y="410">입력축 속도센서의 형식: 인덕티브·홀·액티브 센서 타입(‘네거티브 타입’은 없다).</text><text class="n" x="18" y="428">유온 센서의 서미스터는 온도가 오르면 저항이 낮아지는 부특성이며 댐퍼 클러치 작동 영역·유압 보정에 쓰인다.</text></svg>