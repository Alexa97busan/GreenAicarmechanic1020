<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="소음 발생 시 점검사항과 해당하지 않는 항목"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="400" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">차량 소음 점검 방법</text><rect x="20" y="50" width="680" height="230" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="360.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">차량 소음 발생 시 점검 방법</text><rect class="o" x="36" y="76" width="648" height="38" fill="#e8f0d8" rx="6"/><text x="52" y="100" text-anchor="start" style="font-weight:700;fill:#2f7f3f">✓ 실제 주행 상태를 가정하고 차량을 운행하며 이상 여부 확인</text><rect class="o" x="36" y="124" width="648" height="38" fill="#e8f0d8" rx="6"/><text x="52" y="148" text-anchor="start" style="font-weight:700;fill:#2f7f3f">✓ 작은 수준의 요철을 넘으며 소음 확인</text><rect class="o" x="36" y="172" width="648" height="38" fill="#e8f0d8" rx="6"/><text x="52" y="196" text-anchor="start" style="font-weight:700;fill:#2f7f3f">✓ 차량의 방향 전환(조향) 중 소음이 발생하는지 확인</text><rect class="o" x="36" y="220" width="648" height="38" fill="#f4e1dd" rx="6"/><text x="52" y="244" text-anchor="start" style="font-weight:700;fill:#c1121f">✗ 고속 운행을 하며 브레이크를 수 회 나눠 조작</text><rect class="o" x="20" y="296" width="680" height="50" fill="#fff" rx="8"/><text class="n" x="36" y="318" text-anchor="start" >고속 주행 중 급한 브레이크 조작은 사고 위험이 커 소음 점검이 아니라 제동 성능 시험에 가깝다.</text><text class="n" x="36" y="336" text-anchor="start" >소음 점검은 안전한 속도에서 실제 주행 조건을 재현해 소리가 나는 조건을 찾는다.</text><text class="n" x="18" y="388">소음 발생 시 점검사항이 아닌 것: 고속운행을 실시하고 브레이크를 수 회로 나눠 조작한다.</text></svg>