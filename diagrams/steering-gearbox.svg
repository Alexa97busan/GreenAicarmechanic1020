ircle class="o" cx="97" cy="322" r="4" fill="#d8d6cc"/><circle class="o" cx="443" cy="322" r="4" fill="#d8d6cc"/><text class="n" x="97" y="342" text-anchor="middle" >타이로드</text><text class="n" x="443" y="342" text-anchor="middle" >타이로드</text><rect class="o" x="190" y="196" width="110" height="34" fill="#d4e4f1" rx="6"/><text x="245.0" y="217.0" text-anchor="middle" style="font-weight:700">컨트롤 밸브</text><path d="M230,230L230,300" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/><path d="M230,230L230,300" fill="none" stroke="#7fb8e0" stroke-width="3" stroke-linejoin="round"/><path d="M270,230L270,262L380,262L380,300" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/><path d="M270,230L270,262L380,262L380,300" fill="none" stroke="#7fb8e0" stroke-width="3" stroke-linejoin="round"/><rect class="o" x="470" y="150" width="110" height="40" fill="#e6e4da" rx="6"/><text x="525.0" y="168.0" text-anchor="middle" style="font-weight:700">오일 펌프</text><text class="n" x="525.0" y="183.0" text-anchor="middle" >(엔진 구동)</text><rect class="o" x="470" y="90" width="110" height="40" fill="#d4e4f1" rx="6"/><text x="525.0" y="114.0" text-anchor="middle" style="font-weight:700">오일 리저버</text><path d="M300,213L470,213L470,190" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/><path d="M300,213L470,213L470,190" fill="none" stroke="#7fb8e0" stroke-width="3" stroke-linejoin="round"/><path d="M525,130L525,150" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/><path d="M525,130L525,150" fill="none" stroke="#7fb8e0" stroke-width="3" stroke-linejoin="round"/><text class="n" x="136" y="90" text-anchor="start" >스티어링 휠</text><text class="n" x="112" y="126" text-anchor="start" >회전력(토크) 센서</text><path class="l" d="M104,124L112,124"/><text class="n" x="166" y="292" text-anchor="start" >피니언</text><text class="n" x="250" y="362" text-anchor="middle" >랙 (직선 운동)</text><rect x="480" y="220" width="220" height="170" rx="8" fill="#fff" stroke="#ccc"/><text x="590.0" y="240" text-anchor="middle" style="font-weight:700;fill:#e07a1f">점검 포인트</text><text class="n" x="492" y="268" text-anchor="start" >· 토크 센서: 비접촉형, 조작력 검출</text><text class="n" x="492" y="286" text-anchor="start" >· 프리로드: 중립에서 측정</text><text class="n" x="492" y="304" text-anchor="start" >  (끝까지 돌린 뒤 ✗)</text><text class="n" x="492" y="322" text-anchor="start" >· 스티어링각: 다르면 토 점검</text><text class="n" x="492" y="340" text-anchor="start" >· 오일 레벨 차 5mm 이상 →</text><text class="n" x="492" y="358" text-anchor="start" >  라인에 공기 유입</text><text class="n" x="18" y="410">피니언은 회전운동을 랙의 직선운동으로 바꾼다. 동력 실린더(피스톤)에 유압을 가해 조향력을 보조한다.</text><text class="n" x="18" y="428">스티어링 휠 탈거 시 에어백 잠금 볼트를 풀지 않은 채 두면 안 된다(‘그대로 두고 작업’은 틀림).</text></svg>