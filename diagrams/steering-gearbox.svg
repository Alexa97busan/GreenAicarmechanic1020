<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="스티어링 휠, 컬럼, 피니언, 랙, 동력 피스톤과 컨트롤 밸브, 오일 펌프"><style>
