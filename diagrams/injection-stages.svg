<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="예비 분사, 주 분사, 사후 분사의 시기와 목적"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">디젤 분사 3단계와 인젝터 작동</text><path d="M70,250H690" stroke="#222" stroke-width="1.5"/><path d="M70,250V70" stroke="#222" stroke-width="1.5"/><text class="n" x="64" y="76" text-anchor="end" >분사 신호</text><text class="n" x="690" y="268" text-anchor="end" >크랭크 각도 →</text><path d="M400,256V80" stroke="#888" stroke-dasharray="4 3"/><text class="n" x="400" y="272" text-anchor="middle" >상사점(TDC)</text><rect class="o" x="300" y="216" width="30" height="34" fill="#e8d9a8" /><text x="315.0" y="208" text-anchor="middle" style="font-weight:700">예비 분사</text><rect class="o" x="372" y="160" width="60" height="90" fill="#f0c08a" /><text x="402.0" y="152" text-anchor="middle" style="font-weight:700">주 분사</text><rect class="o" x="520" y="216" width="28" height="34" fill="#cfe0c0" /><text x="534.0" y="208" text-anchor="middle" style="font-weight:700">사후 분사</text><path d="M80,242C250,240 330,210 380,120C430,150 470,210 690,238" fill="none" stroke="#c1121f" stroke-width="2"/><text class="n" x="640" y="220" text-anchor="middle" style="fill:#c1121f">실린더 압력</text><rect class="o" x="40" y="290" width="195" height="44" fill="#fff" rx="5"/><text x="137" y="308" text-anchor="middle" style="font-weight:700">예비 분사</text><text class="n" x="137" y="324" text-anchor="middle" >연소 압력 상승 완만·소음 저감</text><rect class="o" x="255" y="290" width="195" height="44" fill="#fff" rx="5"/><text x="352" y="308" text-anchor="middle" style="font-weight:700">주 분사</text><text class="n" x="352" y="324" text-anchor="middle" >엔진 출력(에너지)을 만든다</text><rect class="o" x="470" y="290" width="210" height="44" fill="#fff" rx="5"/><text x="575" y="308" text-anchor="middle" style="font-weight:700">사후 분사</text><text class="n" x="575" y="324" text-anchor="middle" >DPF 재생·LNT 탄화수소 공급</text><text class="n" x="36" y="360" text-anchor="start" style="font-weight:700">인젝터 작동 4단계:</text><text class="n" x="150" y="360" text-anchor="start" >① 닫힘(고압 적용) →</text><text class="n" x="290" y="360" text-anchor="start" >② 열림(분사 개시) →</text><text class="n" x="430" y="360" text-anchor="start" >③ 완전 열림 →</text><text class="n" x="570" y="360" text-anchor="start" >④ 닫힘(분사 완료)</text><text class="n" x="18" y="410">예비 분사 중단 조건: 연료 압력이 최솟값(100bar) 이하, 분사량이 너무 적음, 엔진 자동 중단 오류 등. (2000rpm 이상은 중단 조건이 아니다)</text><text class="n" x="18" y="428">피에조 인젝터는 코일 대신 피에조 소자를 써 최대 약 1,800bar 분사압으로 빠르게 다단 분사한다.</text></svg>