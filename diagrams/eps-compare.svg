<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="유압식과 전동식 동력 조향장치의 특징과 단점 비교"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="440" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">유압식과 전동식 동력 조향 비교</text><rect x="20" y="50" width="330" height="280" rx="8" fill="#faf9f5" stroke="#ccc"/><text x="185.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">유압식 (EHPS)</text><rect x="370" y="50" width="330" height="280" rx="8" fill="#e8f0d8" stroke="#ccc"/><text x="535.0" y="70" text-anchor="middle" style="font-weight:700;fill:#222">전동식 (MDPS)</text><text class="n" x="36" y="84" text-anchor="start" >· 구동원: 엔진 구동 유압 펌프</text><text class="n" x="36" y="106" text-anchor="start" >· 오일 사용, 유압 파이프 많음</text><text class="n" x="36" y="128" text-anchor="start" >· 엔진 정지 시 보조력 없음</text><text class="n" x="36" y="150" text-anchor="start" >· 대형 차량에도 적합</text><text class="n" x="36" y="172" text-anchor="start" >· 펌프가 항상 돌아 연료 소모↑</text><text class="n" x="386" y="84" text-anchor="start" >· 구동원: 전동 모터 (오일 없음)</text><text class="n" x="386" y="106" text-anchor="start" >· 친환경, 부품 감소·경량화</text><text class="n" x="386" y="128" text-anchor="start" >· 조향 특성 변경이 쉽다</text><text class="n" x="386" y="150" text-anchor="start" >· 엔진 정지 상태에서도 조향력 제공</text><text class="n" x="386" y="172" text-anchor="start" >· 연료 소비를 줄여 연비 향상</text><text class="n" x="386" y="194" text-anchor="start" >· 모터를 제어해 정확한 조향 제어</text><text x="386" y="238" text-anchor="start" style="font-weight:700;fill:#c1121f">단점</text><text class="n" x="386" y="258" text-anchor="start" >· 회전력이 약해 대형 차량에 부적합</text><text class="n" x="386" y="278" text-anchor="start" >· 모터 작동 소음, 설치 자유도 적음</text><text class="n" x="386" y="298" text-anchor="start" >· 유압식보다 핸들 복원력이 약함</text><rect class="o" x="20" y="344" width="680" height="46" fill="#fff" rx="8"/><text class="n" x="36" y="364" text-anchor="start" >저속에서는 조향력을 가볍게(편의성), 고속에서는 무겁게(안정성). ‘저속 주행안전성 향상’은 틀린 설명.</text><text class="n" x="36" y="382" text-anchor="start" >‘연료소비율을 높여 에너지 소모를 줄인다’, ‘회전력이 강해 대형차량에 적합’도 틀린 설명.</text><text class="n" x="18" y="410">전자제어 동력 조향장치의 구비 조건: 높은 내구성·신뢰도. ‘내구성과 신뢰도가 낮아야 한다’는 틀림.</text><text class="n" x="18" y="428">토크 센서(회전력 센서)는 비접촉형으로 운전자의 조향핸들 조작력을 검출한다.</text></svg>