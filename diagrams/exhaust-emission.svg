<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="혼합비에 따른 CO, HC, NOx 배출 변화 그래프"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}.b{font-weight:700}
.l{stroke:#444;stroke-width:1;fill:none}.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
</style><defs><linearGradient id="mat_gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="mat_br" width="6" height="3" patternUnits="userSpaceOnUse"><path d="M0,1.5H6" stroke="#fff" stroke-width=".7" opacity=".5"/><path d="M0,.4H6" stroke="#000" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="mat_fbe5e7m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3f4"/><stop offset="0.28" stop-color="#fbe5e7"/><stop offset="0.5" stop-color="#e9d5d7"/><stop offset="0.74" stop-color="#fcedee"/><stop offset="1" stop-color="#c9b7b9"/></linearGradient><linearGradient id="mat_fbeeddm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf7f0"/><stop offset="0.28" stop-color="#fbeedd"/><stop offset="0.5" stop-color="#e9ddce"/><stop offset="0.74" stop-color="#fcf3e7"/><stop offset="1" stop-color="#c9beb1"/></linearGradient><linearGradient id="mat_e3edf8m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f7fc"/><stop offset="0.28" stop-color="#e3edf8"/><stop offset="0.5" stop-color="#d3dce7"/><stop offset="0.74" stop-color="#ebf2fa"/><stop offset="1" stop-color="#b6bec6"/></linearGradient></defs><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker></defs><rect width="720" height="450" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">배출가스와 혼합비 (CO · HC · NOx)</text><rect x="60" y="60" width="420" height="260" fill="#fff" class="o" rx="4"/><text x="270" y="344" text-anchor="middle" class="n">← 농후(연료 많음)      λ = 1 (이론공연비)      희박(공기 많음) →</text><path d="M270,60V320" stroke="#999" stroke-dasharray="4 4"/><path d="M60,90C150,95 220,150 270,290C320,310 400,312 480,312" fill="none" stroke="#c1121f" stroke-width="3"/><text x="70" y="82" fill="#c1121f" class="b" style="fill:#c1121f">CO</text><path d="M60,120C150,130 220,200 270,262C330,282 400,262 440,200C460,160 470,120 480,100" fill="none" stroke="#e07a1f" stroke-width="3"/><text x="440" y="92" class="b" style="fill:#e07a1f">HC</text><path d="M60,300C150,290 230,220 300,120C340,92 380,110 420,170C450,215 470,250 480,262" fill="none" stroke="#1d5fa8" stroke-width="3"/><text x="320" y="108" class="b" style="fill:#1d5fa8">NOx</text><rect x="502.0" y="63.0" width="200.0" height="78.0" rx="8" fill="#000" opacity=".09"/><rect class="o" x="500" y="60" width="200" height="78" rx="8" fill="url(#mat_fbe5e7m)"/><rect x="500.0" y="60.0" width="200.0" height="78.0" rx="8" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="501.5" y="61.5" width="197.0" height="26" rx="8" fill="url(#mat_gl)" pointer-events="none"/><text x="600" y="80" text-anchor="middle" class="b">CO 일산화탄소</text><text x="600" y="97" text-anchor="middle" class="n">무색무취 · 농후할수록 ↑</text><text x="600" y="114" text-anchor="middle" class="n">희박하면 거의 안 나옴</text><rect x="502.0" y="151.0" width="200.0" height="78.0" rx="8" fill="#000" opacity=".09"/><rect class="o" x="500" y="148" width="200" height="78" rx="8" fill="url(#mat_fbeeddm)"/><rect x="500.0" y="148.0" width="200.0" height="78.0" rx="8" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="501.5" y="149.5" width="197.0" height="26" rx="8" fill="url(#mat_gl)" pointer-events="none"/><text x="600" y="168" text-anchor="middle" class="b">HC 탄화수소</text><text x="600" y="185" text-anchor="middle" class="n">농후할 때 ↑</text><text x="600" y="202" text-anchor="middle" class="n">아주 희박(실화)할 때도 ↑</text><rect x="502.0" y="239.0" width="200.0" height="78.0" rx="8" fill="#000" opacity=".09"/><rect class="o" x="500" y="236" width="200" height="78" rx="8" fill="url(#mat_e3edf8m)"/><rect x="500.0" y="236.0" width="200.0" height="78.0" rx="8" fill="url(#mat_br)" opacity=".5" pointer-events="none"/><rect x="501.5" y="237.5" width="197.0" height="26" rx="8" fill="url(#mat_gl)" pointer-events="none"/><text x="600" y="256" text-anchor="middle" class="b">NOx 질소산화물</text><text x="600" y="273" text-anchor="middle" class="n">약간 희박 · 고온에서 최대</text><text x="600" y="290" text-anchor="middle" class="n">농후하면 적음</text><text class="n" x="18" y="402" style="font-size:12.5px;fill:#222">CO₂ 이산화탄소: 무해하지만 온실효과를 증가시킴 (감소시킨다는 설명은 틀림)</text><text class="n" x="18" y="421" style="font-size:12.5px;fill:#222">디젤: NOx와 PM(입자상 물질)은 서로 반대 — 연소온도 높으면 NOx↑·PM↓, 농후·저온이면 PM↑</text><text class="n" x="18" y="440" style="font-size:12.5px;fill:#222">EGR은 연소온도를 낮춰 NOx를 줄입니다</text></svg>