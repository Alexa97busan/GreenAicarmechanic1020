<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="센서 입력과 액추에이터 출력으로 나누어 본 엔진 ECU"><style>
text{font:12px "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;fill:#222}
.t{font-size:15px;font-weight:700}.n{font-size:11px;fill:#555}
.l{stroke:#444;stroke-width:.8;fill:none}.d{fill:#444}
.o{stroke:#222;stroke-width:1.3;stroke-linejoin:round}
.k{stroke:#222;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#444"/></marker>
<marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#c1121f"/></marker></defs><rect width="720" height="450" rx="12" fill="#F4F3EF"/><text class="t" x="18" y="30">엔진 ECU의 입력(센서)과 출력(액추에이터)</text><text x="20" y="56" text-anchor="start" style="font-weight:700;fill:#1d4e89">입력 (센서)</text><text x="500" y="56" text-anchor="start" style="font-weight:700;fill:#e07a1f">출력 (액추에이터)</text><rect class="o" x="20" y="66" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="85.0" text-anchor="middle" >CKPS (크랭크각)</text><path d="M220,81H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="104" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="123.0" text-anchor="middle" >CMPS (캠각)</text><path d="M220,119H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="142" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="161.0" text-anchor="middle" >WTS (수온)</text><path d="M220,157H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="180" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="199.0" text-anchor="middle" >AFS / MAP (흡입공기)</text><path d="M220,195H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="218" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="237.0" text-anchor="middle" >APS 1·2 (가속페달)</text><path d="M220,233H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="256" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="275.0" text-anchor="middle" >TPS (스로틀)</text><path d="M220,271H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="20" y="294" width="200" height="30" fill="#d4e4f1" rx="5"/><text x="120.0" y="313.0" text-anchor="middle" >산소(람다) 센서</text><path d="M220,309H290" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="290" y="110" width="140" height="160" fill="#fff" rx="6"/><text x="360.0" y="188.0" text-anchor="middle" style="font-weight:700">엔진 ECU</text><text class="n" x="360.0" y="203.0" text-anchor="middle" >(EMS)</text><path d="M430,95H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="80" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="100.0" text-anchor="middle" >인젝터</text><path d="M430,139H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="124" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="144.0" text-anchor="middle" >점화 코일</text><path d="M430,183H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="168" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="188.0" text-anchor="middle" >EGR 액추에이터</text><path d="M430,227H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="212" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="232.0" text-anchor="middle" >ETC 모터(스로틀)</text><path d="M430,271H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="256" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="276.0" text-anchor="middle" >PCSV</text><path d="M430,315H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect class="o" x="500" y="300" width="200" height="32" fill="#f3dcc3" rx="5"/><text x="600.0" y="320.0" text-anchor="middle" >연료펌프 릴레이</text><rect class="o" x="20" y="346" width="680" height="44" fill="#fff" rx="8"/><text class="n" x="36" y="366" text-anchor="start" >센서는 ECU 입력, 액추에이터는 ECU 출력 → ‘ECU 입출력이 다른 것’ = EGR 액추에이터.</text><text class="n" x="36" y="382" text-anchor="start" >부조 실린더 검사: CKPS와 CMPS 신호로 판단. TPS는 접점식 가변저항에서 홀센서 방식으로 발전.</text><text class="n" x="18" y="420">피드백 제어 정지 조건 예: 연료 공급을 일시 차단할 때. EMS의 장점: 배출가스 감소·연비 향상·에너지 효율 상승(황사 억제 ✗).</text><text class="n" x="18" y="438">‘연료 소비 향상’(연료가 더 든다는 뜻)은 EMS의 장점이 아니다.</text></svg>