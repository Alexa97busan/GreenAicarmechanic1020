"/><rect class="o" x="500" y="212" width="200" height="32" fill="url(#mat_f3dcc3p)" rx="5"/><rect x="501.5" y="213.5" width="197.0" height="13.44" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text x="600.0" y="232.0" text-anchor="middle" >ETC 모터(스로틀)</text><path d="M430,271H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="502.0" y="259.0" width="200.0" height="32.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="500" y="256" width="200" height="32" fill="url(#mat_f3dcc3p)" rx="5"/><rect x="501.5" y="257.5" width="197.0" height="13.44" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text x="600.0" y="276.0" text-anchor="middle" >PCSV</text><path d="M430,315H500" stroke="#222" stroke-width="1.6" marker-end="url(#a)" fill="none"/><rect x="502.0" y="303.0" width="200.0" height="32.0" rx="5" fill="#000" opacity=".09"/><rect class="o" x="500" y="300" width="200" height="32" fill="url(#mat_f3dcc3p)" rx="5"/><rect x="501.5" y="301.5" width="197.0" height="13.44" rx="5" fill="url(#mat_gl)" pointer-events="none"/><text x="600.0" y="320.0" text-anchor="middle" >연료펌프 릴레이</text><rect class="o" x="20" y="346" width="680" height="44" fill="#fff" rx="8"/><text class="n" x="36" y="366" text-anchor="start" >센서는 ECU 입력, 액추에이터는 ECU 출력 → ‘ECU 입출력이 다른 것’ = EGR 액추에이터.</text><text class="n" x="36" y="382" text-anchor="start" >부조 실린더 검사: CKPS와 CMPS 신호로 판단. TPS는 접점식 가변저항에서 홀센서 방식으로 발전.</text><text class="n" x="18" y="420">피드백 제어 정지 조건 예: 연료 공급을 일시 차단할 때. EMS의 장점: 배출가스 감소·연비 향상·에너지 효율 상승(황사 억제 ✗).</text><text class="n" x="18" y="438">‘연료 소비 향상’(연료가 더 든다는 뜻)은 EMS의 장점이 아니다.</text><g pointer-events="none"><rect class="o" x="26" y="76" width="20" height="10" rx="2" fill="#8a8f93" /><rect class="o" x="34" y="73" width="6" height="16" rx="1" fill="#c3c7ca" /><rect class="o" x="18" y="77" width="9" height="8" rx="2" fill="url(#bk)" /><rect class="o" x="26" y="114" width="20" height="10" rx="2" fill="#8a8f93" /><rect class="o" x="18" y="115" width="9" he