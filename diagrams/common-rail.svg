eight:700">고압</text><text class="n" x="300" y="322" text-anchor="middle" >리턴 라인(여분 연료 → 탱크)</text><text class="n" x="18" y="370">연료 공급 순서: 저압 펌프 → 고압 펌프 → 커먼레일 → 인젝터. 입구 제어식 압력 조절 밸브(IMV)는 고압 펌프 입구(저압 라인) 측에 있다.</text><text class="n" x="18" y="388">레일 압력 센서 신호로 ECU가 IMV 듀티를 제어해 레일 압력을 조절하고, 인젝터를 구동해 예비·주·사후 분사를 한다.</text></svg>