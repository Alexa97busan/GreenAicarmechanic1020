th="3"/><path d="M675,196L675,250" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/><path d="M675,196L675,250" fill="none" stroke="#c1121f" stroke-width="5" stroke-linejoin="round"/><path class="fl" d="M675,196L675,250" stroke-width="3"/><path d="M525,300V330H65V220M575,300V330M625,300V330M675,300V330" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="6 4"/><rect class="o" x="20" y="150" width="90" height="70" fill="#e6e4da" rx="6"/><text x="65" y="190" text-anchor="middle" >연료탱크</text><rect class="o" x="140" y="160" width="80" height="50" fill="#d4e4f1" rx="5"/><text x="180" y="182" text-anchor="middle" >저압 펌프</text><text class="n" x="180" y="197" text-anchor="middle" >(전기식)</text><rect class="o" x="250" y="160" width="70" height="50" fill="#d4e4f1" rx="5"/><text x="285" y="190" text-anchor="middle" >연료 필터</text><rect class="o" x="350" y="150" width="120" height="70" fill="#f0d6d6" rx="6"/><text x="418" y="182" text-anchor="middle" >고압 펌프</text><text class="n" x="418" y="200" text-anchor="middle" >(캠축·체인 구동)</text><rect class="o" x="336" y="168" width="22" height="34" fill="#e07a1f" rx="3"/><text class="n" x="347" y="240" text-anchor="middle" >입구 제어 밸브(IMV)</text><path class="l" d="M347,230V204"/><rect class="o" x="500" y="160" width="200" height="36" fill="#f0d6d6" rx="10"/><text x="600" y="183" text-anchor="middle" >커먼레일</text><rect class="o" x="580" y="136" width="24" height="18" fill="#fff" /><text class="n" x="592" y="128" text-anchor="middle" >레일 압력 센서</text><rect class="o" x="513" y="250" width="24" height="50" fill="#e6e4da" rx="4"/><rect class="o" x="563" y="250" width="24" height="50" fill="#e6e4da" rx="4"/><rect class="o" x="613" y="250" width="24" height="50" fill="#e6e4da" rx="4"/><rect class="o" x="663" y="250" width="24" height="50" fill="#e6e4da" rx="4"/><text class="n" x="600" y="352" text-anchor="middle" >인젝터 (예비·주·사후 분사)</text><rect class="o" x="280" y="40" width="160" height="40" fill="#fff" rx="6"/><text x="360" y="65" text-anchor="middle" >ECU (엔진 제어기)</text><path d="M347,80V168" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><path d="M440,56H592V136" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><path d="M440,70H584A8,8 0 0 1 600,70H718V275H690" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><text class="n" x="710" y="64" text-anchor="end" >구동 신호</text><polygon points="119,179 132,185 119,191" fill="#1d4e89" stroke="#222" stroke-width="1"/><polygon points="229,179 242,185 229,191" fill="#1d4e89" stroke="#222" stroke-width="1"/><polygon points="322,179 335,185 322,191" fill="#1d4e89" stroke="#222" stroke-width="1"/><polygon points="479,179 492,185 479,191" fill="#c1121f" stroke="#222" stroke-width="1"/><text x="110" y="138" text-anchor="middle" style="fill:#1d4e89;font-weight:700">저압 라인</text><text x="480" y="140" text-anchor="middle" style="fill:#c1121f;font-weight:700">고압</text><text class="n" x="300" y="322" text-anchor="middle" >리턴 라인(여분 연료 → 탱크)</text><text class="n" x="18" y="370">연료 공급 순서: 저압 펌프 → 고압 펌프 → 커먼레일 → 인젝터. 입구 제어식 압력 조절 밸브(IMV)는 고압 펌프 입구(저압 라인) 측에 있다.</text><text class="n" x="18" y="388">레일 압력 센서 신호로 ECU가 IMV 듀티를 제어해 레일 압력을 조절하고, 인젝터를 구동해 예비·주·사후 분사를 한다.</text></svg>