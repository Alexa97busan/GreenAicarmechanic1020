 stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M272,244L272,290L120,290L120,310" stroke-width="2"/><rect class="o" x="80" y="310" width="80" height="46" fill="#e6e4da" rx="5"/><text class="n" x="120" y="330" text-anchor="middle" >앞좌 휠</text><text class="n" x="120" y="346" text-anchor="middle" >휠 실린더</text><rect class="o" x="100" y="362" width="40" height="14" fill="#fff" /><text class="n" x="120" y="390" text-anchor="middle" >휠 스피드센서</text><path d="M330,244L330,290L280,290L280,310" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M330,244L330,290L280,290L280,310" fill="none" stroke="#7fb8e0" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M330,244L330,290L280,290L280,310" stroke-width="2"/><rect class="o" x="240" y="310" width="80" height="46" fill="#e6e4da" rx="5"/><text class="n" x="280" y="330" text-anchor="middle" >앞우 휠</text><text class="n" x="280" y="346" text-anchor="middle" >휠 실린더</text><rect class="o" x="260" y="362" width="40" height="14" fill="#fff" /><text class="n" x="280" y="390" text-anchor="middle" >휠 스피드센서</text><path d="M388,244L388,290L440,290L440,310" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M388,244L388,290L440,290L440,310" fill="none" stroke="#7fb8e0" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M388,244L388,290L440,290L440,310" stroke-width="2"/><rect class="o" x="400" y="310" width="80" height="46" fill="#e6e4da" rx="5"/><text class="n" x="440" y="330" text-anchor="middle" >뒤좌 휠</text><text class="n" x="440" y="346" text-anchor="middle" >휠 실린더</text><rect class="o" x="420" y="362" width="40" height="14" fill="#fff" /><text class="n" x="440" y="390" text-anchor="middle" >휠 스피드센서</text><path d="M446,244L446,290L600,290L600,310" fill="none" stroke="#222" stroke-width="6" stroke-linejoin="round"/><path d="M446,244L446,290L600,290L600,310" fill="none" stroke="#7fb8e0" stroke-width="4" stroke-linejoin="round"/><path class="fl" d="M446,244L446,290L600,290L600,310" stroke-width="2"/><rect class="o" x="560" y="310" width="80" height="46" fill="#e6e4da" rx="5"/><text class="n" x="600" y="330" text-anchor="middle" >뒤우 휠</text><text class="n" x="600" y="346" text-anchor="middle" >휠 실린더</text><rect class="o" x="580" y="362" width="40" height="14" fill="#fff" /><text class="n" x="600" y="390" text-anchor="middle" >휠 스피드센서</text><path d="M80,376H40V166H250" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" fill="none"/><text class="n" x="42" y="160" text-anchor="start" >센서 신호(4바퀴)</text><text class="n" x="18" y="450">휠 스피드 센서가 하나라도 고장 나면 ABS는 작동을 중지하고 일반 제동만 유지한다(‘2개 이상일 때’라는 설명은 틀림).</text><text class="n" x="18" y="468">약 10km/h 도달 시 펌프 모터 테스트, 과전압 지속 시 밸브 릴레이 OFF, 저전압 검출 시 ABS 제어 금지·경고등 점등.</text></svg>