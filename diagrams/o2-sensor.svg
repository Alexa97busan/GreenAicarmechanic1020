ke-width=".8"/><path class="o" d="M314,300V414A16,16 0 0 0 346,414V300" fill="none" stroke="#6b7b8c" stroke-width="2.4"/><path class="o" d="M322,320V402A8,8 0 0 0 338,402V320" fill="none" stroke="#6b7b8c" stroke-width="1.6"/><rect class="o" x="326" y="160" width="8" height="240" fill="#c9c6bd" /><path d="M327,350l6,6l-6,6l6,6l-6,6l6,6l-6,6" stroke="#c1121f" stroke-width="1.6" fill="none"/><path d="M440,384H368" stroke="#555" stroke-width="2" marker-end="url(#a)" fill="none"/><text x="18" y="62">O₂ 신호선(+)</text><path class="l" d="M176,58L312,62"/><circle class="d" cx="312" cy="62" r="2"/><text x="18" y="106">그로밋(고무 실)</text><path class="l" d="M176,102L306,125"/><circle class="d" cx="306" cy="125" r="2"/><text x="18" y="160">대기(기준 공기) 유입</text><path class="l" d="M176,156L290,185" marker-end="url(#a)"/><text x="18" y="228">세라믹 절연체</text><path class="l" d="M176,224L310,200"/><circle class="d" cx="310" cy="200" r="2"/><text x="18" y="320">나사부(배기관 장착)</text><path class="l" d="M176,316L302,316"/><circle class="d" cx="302" cy="316" r="2"/><text x="18" y="372">보호 커버(이중)</text><path class="l" d="M176,368L301,367"/><circle class="d" cx="301" cy="367" r="2"/><text x="18" y="420">백금 전극(외측)</text><path class="l" d="M176,416L315,405"/><circle class="d" cx="315" cy="405" r="2"/><text x="470" y="56">히터 전원선(+)</text><path class="l" d="M464,52L348,56"/><circle class="d" cx="348" cy="56" r="2"/><text x="470" y="90">히터 접지선(−)</text><path class="l" d="M464,86L338,88"/><circle class="d" cx="338" cy="88" r="2"/><text x="470" y="190">스테인리스 외피</text><path class="l" d="M464,186L362,190"/><circle class="d" cx="362" cy="190" r="2"/><text x="470" y="246">하우징(육각부)</text><path class="l" d="M464,242L378,256"/><circle class="d" cx="378" cy="256" r="2"/><text x="470" y="290">가스켓(와셔)</text><path class="l" d="M464,286L370,282"/><circle class="d" cx="370" cy="282" r="2"/><text x="470" y="310">세라믹 분말 실</text><path class="l" d="M464,306L350,264"/><circle class="d" cx="350" cy="264" r="2"/><text x="470" y="350">히터(저항선)</text><path class="l" d="M464,346L333,362"/><circle class="d" cx="333" cy="362" r="2"/><text x="470" y="412">지르코니아 소자(ZrO₂)</text><path class="l" d="M464,408L345,330"/><circle class="d" cx="345" cy="330" r="2"/><text x="446" y="388">배기가스 →</text><text class="n" x="18" y="490">소자 내·외면의 산소 농도 차로 기전력 발생: 농후(λ&lt;1)일 때 약 0.6~1.0 V, 희박(λ&gt;1)일 때 약 0.1~0.2 V, 이론공연비 부근에서 급변한다.</text><text class="n" x="18" y="508">히터가 소자를 가열해 약 300 ℃ 이상에서 활성화(시동 직후 조기 작동). 신호선 1, 접지선 1, 히터선 2의 4선식.</text></svg>